openapi: 3.0.3
info:
  title: mediaOrquestator API
  version: "1"
  description: |
    HTTP API of the `orchestrator serve` server: projects, executions (runs),
    models and downloads, environment and statistics. More detail in `docs/http-api.md`.

    With a token configured on the server, every request (except
    `GET /api/health`) needs `Authorization: Bearer <token>`. Errors
    always have the same shape: `{"error": {"code", "message"}}`.
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Health
  - name: Projects
  - name: Library
  - name: Import
  - name: Runs
  - name: Events
  - name: Artifacts
  - name: Environment
  - name: Assistant
  - name: Prompts
  - name: Review
  - name: Models
  - name: Generation
  - name: Downloads
  - name: Access
  - name: API

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Checks that the server is alive (no token needed)
      security: []
      responses:
        "200":
          description: Server is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /api/openapi.json:
    get:
      tags: [API]
      summary: This description of the API in OpenAPI format
      responses:
        "200":
          description: OpenAPI 3.0 document.
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/projects:
    get:
      tags: [Projects]
      summary: Lists the projects
      parameters:
        - { $ref: "#/components/parameters/ManagedInclude" }
        - { $ref: "#/components/parameters/ClientFilter" }
      description: >-
        Each project says who made it in `client` (the `client:` of its `scenes.yaml`; `embedded` if it has none, and `unknown` for a managed one) and, if it comes from the generation API, its `kind` (`generation`, `image_edit` or `video_edit`); with `managed=include` managed projects appear in the list and `client=a,b` keeps only those clients.
        Id, declared name, mode (`video`, `images` or `music`), scene count and the `adult` label; a music project also reports `track_count`. If the YAML cannot be read, `invalid` and `error`. The server starts censored: projects marked `adult: true` do not appear (and cannot be requested: they answer 404 like a nonexistent one); with `--strict`, neither do those not marked `adult: false`.
      responses:
        "200":
          description: List of projects.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProjectSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Projects]
      summary: Creates a project with a valid starter scenes.yaml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: Project identifier (folder name). }
                client: { type: string, pattern: "^[a-z0-9-]{1,32}$", description: "Optional: the dashboard that makes the project; stored as `client:` in its `scenes.yaml` and shown in the listings. Without it nothing is stored (the project is `embedded`). A name that is not valid gives a 422." }
      responses:
        "201": { $ref: "#/components/responses/CreatedId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/projects/{id}:
    delete:
      tags: [Projects]
      summary: Deletes the project, including its tmp/ and out/
      description: "A generation API project (`api-gen-`, `api-edit-`, `api-vid-`) is not deleted here: it answers 400 saying which endpoint deletes it (`DELETE /api/generations/{id}`, `/api/image-edits/{id}` or `/api/video-edits/{id}`) and touches nothing."
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "204": { description: Project deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/duplicate:
    post:
      tags: [Projects]
      summary: Duplicates the project (scenes.yaml only)
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_id]
              properties:
                new_id: { type: string }
      responses:
        "201": { $ref: "#/components/responses/CreatedId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/export:
    get:
      tags: [Projects]
      summary: Downloads the project (dataset or package)
      description: >-
        `format=dataset` (the default) writes the scenes (video or images) or the songs (music) in the format the import reads: a JSON of `[id, title, lora_info, full_prompt]` tuples, where `full_prompt` carries the scene text and the `Dialogue:`, `Negative:` (the scene's and the project's), `Motion:`, `Seed:`, `Speed:`, `Silence:` and `Variants:` lines (for music, `Lyrics:`, `Language:`, `BPM:`, `Duration:`, `Key:`, `Time signature:`, `Seed:` and `Variants:`). The project's subject prompt is prepended to each scene, and the style prefix and the voice are merged into each song. What the format cannot carry (models, voice, resolution, animation, camera and look, own images, mixes, favorites, songs made from other songs) is listed in the `X-Export-Notes` header (URL-encoded JSON); `X-Export-Count` says how many entries were written. `format=zip` downloads the complete package: `scenes.yaml` (all settings), the `sources/` files, a README (`README.txt`) and the recipe (`RECIPE.md` to read and `recipe.json` for the program: the models, voice and LoRA it uses with their catalog and download link, the settings it generates with, and whether they still follow the catalog's recommended ones), without the models or the generated output (`out/`, `tmp/`). It is imported with `/api/import/package/preview` and `/confirm`. An unknown format answers 400; a project with no scenes or songs cannot be exported as a dataset (422).
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: format, in: query, required: false, schema: { type: string, enum: [dataset, zip], default: dataset } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [es, en], default: en }, description: Language of the recipe inside the zip. }
      responses:
        "200":
          description: The downloadable file.
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Export-Notes: { schema: { type: string }, description: "Dataset only: JSON list of what is not carried over, URL-encoded." }
            X-Export-Count: { schema: { type: integer }, description: "Dataset only: entries written." }
          content:
            application/json: { schema: { type: array, items: { type: array, items: { type: string } } } }
            application/zip: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/review/vision-models:
    get:
      tags: [Review]
      summary: Vision models Ollama has
      description: >-
        Lists the Ollama models able to read images, from smallest to largest. None is chosen automatically: the user decides which one judges the frames of a review.
      responses:
        "200":
          description: The models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  models: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Ollama is unreachable. }

  /api/projects/{id}/reviews:
    get:
      tags: [Review]
      summary: Reviews of the project, newest first
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Each review with how many findings it has and how many are pending.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Review]
      summary: Analyses the project's animated clips (or creates an empty review)
      description: >-
        Starts the analysis in the background and answers 202 with the review (`state: analyzing`, with `done` of `total` clips): poll it with `GET /api/reviews/{rid}`. For each animated clip that exists in `tmp/` it measures colour drift and sharpness frame by frame and, if `model` is given (an Ollama vision model), asks it whether people are deformed; each problem is a finding with its proposed fix and a frame as evidence. The model is unloaded from Ollama when finished. Without `model` it only measures. With `analyze: false` it creates an empty review (201) for the user's own findings. 409 if the project is already being analysed or has an active run; 422 if there are no animated clips yet.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model: { type: string }
                analyze: { type: boolean, default: true }
      responses:
        "201": { description: Empty review created. }
        "202":
          description: Analysis started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Review" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/reviews/{rid}:
    get:
      tags: [Review]
      summary: A review with its findings
      description: Reading it refreshes the state of running tasks from the state of their runs.
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      responses:
        "200":
          description: The review and its findings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  review: { $ref: "#/components/schemas/Review" }
                  findings: { type: array, items: { $ref: "#/components/schemas/Finding" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Review]
      summary: Deletes a review and its frames
      description: 409 if it is being analysed or has running tasks.
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      responses:
        "204": { description: "Deleted." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reviews/delete:
    post:
      tags: [Review]
      summary: Deletes several reviews
      description: >-
        With `ids`, those reviews; with a filter (`project`, `before` in RFC 3339), those that match it. They cannot be mixed. Reviews being analysed or with running tasks are not deleted and are returned in `skipped_active`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
                project: { type: string }
                before: { type: string, format: date-time }
      responses:
        "200":
          description: Result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
                  skipped_active: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/reviews/{rid}/findings:
    post:
      tags: [Review]
      summary: Adds a finding of the user's own (what the user saw)
      description: >-
        Requires `scene` and `description`; `from_seconds`, `severity` (0 to 10) and `fix` are optional. Without `fix` the proposal is to redo the scene with a different seed. The fixes are `trim` (`seconds`), `reseed` (`seed`), `motion_prompt` (`motion_prompt`) and `prompt` (`prompt`).
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scene, description]
              properties:
                scene: { type: string }
                description: { type: string }
                from_seconds: { type: number }
                severity: { type: integer, minimum: 0, maximum: 10 }
                fix: { $ref: "#/components/schemas/Fix" }
      responses:
        "201":
          description: The finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reviews/{rid}/findings/{fid}:
    patch:
      tags: [Review]
      summary: Changes a finding's fix, skips it or edits its text
      description: Accepts `fix`, `description`, `severity`, `from_seconds` and `skipped`. 409 while its task is running.
      parameters:
        - { $ref: "#/components/parameters/ReviewId" }
        - { $ref: "#/components/parameters/FindingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fix: { $ref: "#/components/schemas/Fix" }
                description: { type: string }
                severity: { type: integer, minimum: 0, maximum: 10 }
                from_seconds: { type: number }
                skipped: { type: boolean }
      responses:
        "200":
          description: The finding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Finding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reviews/{rid}/findings/{fid}/frame:
    get:
      tags: [Review]
      summary: The frame that proves a finding
      parameters:
        - { $ref: "#/components/parameters/ReviewId" }
        - { $ref: "#/components/parameters/FindingId" }
      responses:
        "200":
          description: A PNG.
          content:
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reviews/{rid}/findings/{fid}/suggest:
    post:
      tags: [Review]
      summary: Proposes a smoother motion for the scene
      description: >-
        Asks the local text model (on CPU, like the prompt assistant) for a smoother `motion_prompt` based on what was seen. It is only a proposal: it changes nothing. 409 with an active run.
      parameters:
        - { $ref: "#/components/parameters/ReviewId" }
        - { $ref: "#/components/parameters/FindingId" }
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema:
                type: object
                properties:
                  motion_prompt: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reviews/{rid}/tasks:
    post:
      tags: [Review]
      summary: Runs fixes as tasks
      description: >-
        For each finding (`finding_ids`, or all pending ones) it applies its fix to `scenes.yaml` (with a backup the first time and preserving comments) and queues a run limited to its scene. The finding becomes `running` and then `done` or `failed` according to the run. 409 if the project already has an active or queued run.
      parameters: [{ $ref: "#/components/parameters/ReviewId" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                finding_ids: { type: array, items: { type: string } }
                gpu: { type: string }
      responses:
        "202":
          description: Tasks started.
          content:
            application/json:
              schema:
                type: object
                properties:
                  started:
                    type: array
                    items:
                      type: object
                      properties:
                        finding_id: { type: string }
                        run_id: { type: string }
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        finding_id: { type: string }
                        reason: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/config:
    get:
      tags: [Projects]
      summary: The project's YAML and its structured form
      description: |
        Saving validates the YAML with the same rules as a run (and that the
        models and sources it names exist). Fields that were added to
        `scenes.yaml` and that this description does not detail field by field:

        - **Fades between scenes (video):** `defaults.transition_seconds`
          (0 to 2; 0 or absent = cuts) and `transition_seconds` in a
          scene (the fade it enters with from the previous one; it overrides the
          project's and 0 is a cut). Fades overlap the scenes, so
          the video ends up shorter by the sum of the fades. `transition`
          (in `defaults` and in a scene) picks the type (`fade` by default,
          `fadeblack`, `fadewhite`, `dissolve`, `wipeleft`, `wiperight`, `wipeup`,
          `wipedown`, `slideleft`, `slideright`, `slideup`, `slidedown`,
          `circleopen`, `circleclose`, `radial`, `pixelize`).
        - **Video scenes:** `clip` (an own video from `sources/` instead of
          generating and animating an image) with `clip_speed` (video speed, 0.25 to 4; empty = automatic),
          `clip_start` and `clip_end` (seconds
          from the start of the file, optional) to use only a part; with
          `animate: true` they also apply, and count from the start of the
          animation and only in its forward part;
          it cannot be combined with `image`, `animate`, `motion_prompt`, `animation` or
          `render`.
        - **Video and image scenes:** `image` (an own image from
          `sources/`, video only), `init_image` and `strength` (img2img: starting
          from an image in `sources/`), `motion.type` also `rotate_cw` and
          `rotate_ccw`, and each scene's own quality: `render`
          (`resolution`, `steps`, `cfg_scale`) and `animation` (`resolution`,
          `frames`, `steps`, only if the scene animates), all optional; if
          missing, the project's value applies.
        - **Motion graphics with the catalog parts (video):** besides
          `motion_graphic` (the page is written by the model), a scene can
          be made from a part of the catalog at `GET /api/music-motion/catalog`:
          `motion_part` (the part's name, or `auto` to let the model pick
          one from `motion_graphic`), `motion_params` (its parameters, within
          the catalog's limits), `motion_text` (up to 120 characters, a line
          on the verse layer for the whole scene) and `motion_bpm` (40 to 240). Without
          a model or a song: the page comes from the part, the project's design and a
          fixed tempo clock. The `defaults.motion` block carries `bpm` (default
          120) and `design` (the same fields as a piece's design: `dark`,
          `light`, `accent`, `display`, `body`, `default_mode`, `modes`, `concept`,
          `verse_style` and `hit_style`); without a design a fallback palette is chosen
          from the words of `subject_prompt`. `motion_part` cannot be combined with
          `image`, `init_image`, `clip`, `animate`, `motion_prompt`, `animation` or
          `render`, and `motion_params`, `motion_text` and `motion_bpm` are not valid without
          `motion_part`.
        - **Video:** the `bgm` block (`prompt` or `file`, `volume`, `fade_seconds`,
          `ducking`, `seed`): background music under the voice-over.
        - **Music** (`output.mode: music`): `tracks` instead of `scenes`. Each
          track has `prompt`, `lyrics`, `instrumental`, `duration_seconds`,
          `bpm`, `keyscale`, `timesignature`, `vocal_language`, `vocals`, `seed`,
          `variants`, `use_lm`, `adapter`/`adapter_scale`, and to start from a
          song `task` (`cover`, `cover-nofsq`, `repaint`, `extract`) with
          `source`, `cover_strength`, `repaint_start`/`repaint_end` and `stem`, or
          `reference` (timbre reference for a new song).
          `defaults.music` holds the models, the synthesis parameters,
          `style_prefix`, the default adapter and the engine (`engine`:
          `cli` or `server`, with `keep_loaded`).

        The names in `source`, `reference`, `bgm.file`, `image` and `init_image`
        are files in the project's `sources/` folder (see the sources
        endpoints).
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Project configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  yaml: { type: string }
                  parsed: { type: object, additionalProperties: true }
                  valid: { type: boolean }
                  warnings: { type: array, items: { type: string } }
                  error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Projects]
      summary: Validates and saves the project's YAML
      description: If it does not validate (422) the file on disk is left untouched. In music mode it also checks that the `models/music` models exist.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  warnings: { type: array, items: { type: string } }
                  removed_clips: { type: array, items: { type: string }, description: "Videos in `sources/` that the previous configuration used as a `clip` and this one no longer does: they are deleted so as not to leave stray clips (not while a run is active)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/projects/{id}/cache:
    get:
      tags: [Projects]
      summary: What the next run would do with the cache, per scene and phase
      description: >-
        States `hit`, `run`, `always` and `n/a`; `cold` is true if there is no cache manifest. In music mode each entry is a track, with the phases `compose` (`n/a` if the track brings its own lyrics or has a task), `synth` and `export`.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Cache report.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/sources:
    get:
      tags: [Projects]
      summary: Project sources (audio for remix, repaint, extract, reference and background music; scene images)
      description: The files in `sources/`, sorted by name; `kind` is `audio`, `image`, `video` (a clip a scene can use as its own) or `blend` (a Blender scene for `blender.file`). A video carries `used_by`, the scenes that use it (empty if nobody uses it, in which case it can be deleted). They are played through the artifacts endpoint (`sources/<name>`).
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: List of sources.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        kind: { type: string, enum: [audio, image, video, blend] }
                        used_by: { type: array, items: { type: string }, description: "Videos only: ids of the scenes that use it as a `clip`." }
                        size: { type: integer }
                        modified: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Projects]
      summary: Copies an already exported song as a source
      description: Copies an `.mp3` or `.wav` from `out/` to `sources/`; the original is not touched. It never replaces an existing source.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: string, description: "Path under out/, for example out/songs/ballad.mp3." }
                name: { type: string, description: "Name of the source (by default, the file's own)." }
      responses:
        "201":
          description: Copied.
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/peaks:
    get:
      tags: [Projects]
      summary: Waveform peaks of a project audio
      description: >-
        To draw the waveform and offer «Recortar silencios» (Trim silences). Reads an `.mp3` or `.wav` from `sources/` (`sources/<name>`) or from `out/` (`out/<project>/<name>`) and returns the duration, `peaks` (the maximum level, 0 to 1, of `buckets` equal slices of the file) and `active`, the first and last instant with sound (above -45 dBFS in 0.1 s windows), or `null` if everything is silence. `buckets` is 800 by default and at most 4000. With `bpm` (20 to 400) it also looks for the beat in the first 30 s and answers `beat_offset`: the second of its first hit (less than one beat), or `null` without `bpm` or if there is no clear beat. Another path, a name that is not audio or a link that leaves the project answer 400; a nonexistent file, 404; an unreadable one, 422; without ffmpeg, 503.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: file, in: query, required: true, schema: { type: string }, description: "Path relative to the project, for example sources/base.mp3." }
        - { name: buckets, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 4000, default: 800 } }
        - { name: bpm, in: query, required: false, schema: { type: number, minimum: 20, maximum: 400 }, description: "Tempo of the song, used to find where its beat falls." }
      responses:
        "200":
          description: Peaks and the stretch with sound.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duration: { type: number, description: Seconds. }
                  buckets: { type: integer }
                  peaks: { type: array, items: { type: number, minimum: 0, maximum: 1 } }
                  active:
                    nullable: true
                    type: object
                    properties:
                      start: { type: number }
                      end: { type: number }
                  beat_offset: { type: number, nullable: true, description: Second of the first hit (less than one beat); only with bpm and a clear beat. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: ffmpeg is missing. }
  /api/projects/{id}/transcribe:
    post:
      tags: [Projects]
      summary: Lyrics of a project audio or video (Whisper)
      description: >-
        Reads with `whisper-cli`, on this machine and on the CPU, an `.mp3`, a `.wav` or a preserved video from `sources/` and returns the language, the segments with their times and the text. Without `language` the language is detected once at the start and kept for the whole file (`language_detected: true`). It does not carry the previous text from one window to the next, and empty segments or ones containing only musical notes are discarded, as are repetitions of more than 3 identical consecutive lines (`dropped` says how many). A wordless audio answers 200 with an empty `text`. It is a transcription to be reviewed: sung voice is transcribed worse than spoken voice, especially with instruments. Another source or a language that is not an ISO code answer 400; a nonexistent source, 404; while a run is queued or active, 409; an unreadable audio, 422; without `whisper-cli`, without a model, without ffmpeg or without memory, 503; if it takes more than 10 minutes, 504.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, description: Name of an audio or video in `sources/`. }
                language: { type: string, description: "ISO 639-1 code (es, en…). Without it, it is detected." }
      responses:
        "200":
          description: The transcription.
          content:
            application/json:
              schema:
                type: object
                properties:
                  language: { type: string }
                  language_detected: { type: boolean }
                  text: { type: string, description: The segments joined with line breaks. }
                  segments:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: number, description: Seconds. }
                        end: { type: number }
                        text: { type: string }
                  dropped: { type: integer }
                  model: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "whisper-cli, its model, ffmpeg or memory is missing." }
        "504": { description: Took more than 10 minutes. }
  /api/projects/{id}/measure:
    post:
      tags: [Projects]
      summary: Tempo and key of a project audio or video
      description: >-
        Estimates the tempo (`bpm`, 60 to 200, with half and double in `bpm_alternatives` when they fall in that range) and the key (`keyscale`, as music tracks write it: `D minor`) of an `.mp3`, a `.wav` or a preserved video from `sources/`, with its confidence (0 to 1). The server computes it itself, with no models or GPU, so it does not wait for runs. They are **estimates**: the tempo is usually right or comes out at half or double, and the key may come out as its relative. Without a clear beat `bpm` is `null`; without a clear key, `keyscale`. It does not measure the time signature. Another source answers 400; a nonexistent one, 404; an unreadable audio, 422; more than 20 minutes, 422; without ffmpeg, 503.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source: { type: string, description: Name of an audio or video in `sources/`. }
      responses:
        "200":
          description: The measurements.
          content:
            application/json:
              schema:
                type: object
                properties:
                  duration: { type: number, description: Seconds. }
                  bpm: { type: number, nullable: true }
                  bpm_alternatives: { type: array, items: { type: number } }
                  bpm_confidence: { type: number, minimum: 0, maximum: 1 }
                  keyscale: { type: string, nullable: true }
                  key_confidence: { type: number, minimum: 0, maximum: 1 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: ffmpeg is missing. }
  /api/projects/{id}/recognize:
    post:
      tags: [Projects]
      summary: Listen to the sound of a project audio or video with LAION-CLAP
      description: >-
        Sends the first 30 seconds of an `.mp3`, a `.wav` or a preserved video from `sources/` to the LAION-CLAP service, which scores the sound against the genre, mood and instrument labels of the music vocabulary, and returns the best of each group (`genre`, `mood`, `instrument`, with their score, which is a similarity and not a probability) and `tags`, all together in the order in which they are written. It does not start the service: it must be running (Environment screen); otherwise, 503 with the reason in `error.reason` (`not_running`, `no_service`, `no_weights`...). `method` is `clap` or `muq` (MuQ-MuLan, with the `diffrhythm2 classify` executable and on CPU; 503 with `no_service` or `no_weights` if the executable or the converted weights are missing); the lyrics have their own call (`/transcribe`) and `whisper` here is 400. It is experimental: in our tests CLAP separated genres poorly, so it is a hint for the assistant and not a verdict.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, method]
              properties:
                source: { type: string, description: Name of an audio or video in `sources/`. }
                method: { type: string, enum: [clap, muq] }
      responses:
        "200":
          description: What was heard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  method: { type: string }
                  genre: { type: array, items: { $ref: "#/components/schemas/SoundTag" } }
                  mood: { type: array, items: { $ref: "#/components/schemas/SoundTag" } }
                  instrument: { type: array, items: { $ref: "#/components/schemas/SoundTag" } }
                  tags: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { description: The CLAP service failed. }
        "503": { description: CLAP is not running or ffmpeg is missing. }
  /api/music/recognizers:
    get:
      tags: [Music]
      summary: Which methods exist to recognize a song
      description: >-
        Whisper (the lyrics, always available), LAION-CLAP (the sound: available if its service is running; otherwise `reason` and `detail` say why) and MuQ-MuLan (available if the `diffrhythm2` executable is built at `bin/services/diffrhythm2` and the audio weights are converted; otherwise `no_service` or `no_weights`). It starts nothing.
      responses:
        "200":
          description: The methods.
          content:
            application/json:
              schema:
                type: object
                properties:
                  recognizers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [whisper, clap, muq] }
                        available: { type: boolean }
                        reason: { type: string }
                        detail: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/projects/{id}/loudness:
    get:
      tags: [Projects]
      summary: Loudness of a project audio
      description: >-
        Measures the integrated loudness (EBU R128, in LUFS) of an `.mp3` or `.wav` from `sources/` (`sources/<name>`) or from `out/` (`out/<project>/<name>`). Reads the whole file. The music studio uses it to roughly compute what normalizing a mix would do in the preview. A silent audio answers `lufs: null`. Another path or a name that is not audio answer 400; a nonexistent file, 404; an unreadable one, 422; without ffmpeg, 503.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: file, in: query, required: true, schema: { type: string }, description: "Path relative to the project, for example out/demo/ballad.mp3." }
      responses:
        "200":
          description: Loudness of the audio.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lufs: { type: number, nullable: true, description: Integrated LUFS; null if the audio is silence. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: ffmpeg is missing. }
  /api/library:
    get:
      tags: [Library]
      summary: All the songs of all the music projects, with their stars and playlists
      parameters:
        - { $ref: "#/components/parameters/ManagedInclude" }
        - { $ref: "#/components/parameters/ClientFilter" }
      description: Walks the music projects and lists the songs in their `manifest.json` that are still on disk (most recent first), plus what the user adds to them. A song's key is `project/track/seed`, like the favorites'.
      responses:
        "200":
          description: Songs, stars and playlists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  songs:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string, example: songs/ballad/7 }
                        project: { type: string }
                        track_id: { type: string }
                        variant: { type: integer }
                        seed: { type: integer }
                        title: { type: string }
                        caption: { type: string }
                        lyrics: { type: string }
                        instrumental: { type: boolean }
                        bpm: { type: integer }
                        keyscale: { type: string }
                        vocal_language: { type: string }
                        audio_seconds: { type: number }
                        duration: { type: number, description: "The length of the audio as the song map reads it (the decoded samples), to the millisecond: what a script has to cover. Absent when it cannot be measured (for example without ffmpeg). `audio_seconds` is the rounded one the manifest records." }
                        file: { type: string, description: "Path of the audio inside the project (requested through `/api/projects/{id}/artifacts/...`)." }
                        cover: { type: string }
                        favorite: { type: boolean, description: "Marked as a favorite in its project." }
                        generated_at: { type: string }
                        client: { type: string, description: "Who made the song's project (`embedded` if it does not say)." }
                  ratings:
                    type: object
                    additionalProperties: { type: integer, minimum: 1, maximum: 5 }
                  playlists:
                    type: array
                    items: { $ref: "#/components/schemas/LibraryPlaylist" }
  /api/library/meta:
    put:
      tags: [Library]
      summary: Saves the stars and the playlists
      description: Replaces the whole document (stars 1 to 5, a song with no stars does not appear; up to 200 playlists of up to 2000 songs). It is saved in `projects/.library.json`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ratings:
                  type: object
                  additionalProperties: { type: integer, minimum: 1, maximum: 5 }
                playlists:
                  type: array
                  items: { $ref: "#/components/schemas/LibraryPlaylist" }
      responses:
        "200":
          description: What was saved.
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/storage:
    get:
      tags: [Projects]
      summary: Size of each project and free disk space
      parameters:
        - { $ref: "#/components/parameters/ManagedInclude" }
        - { $ref: "#/components/parameters/ClientFilter" }
      description: "Adds up the files of each project without following symbolic links except those that lead to the media folder (a project's `models` and `voices` are links to installation-wide folders and are not counted) and gives the free and total space of the disk where the projects are. With a media folder (`--media-dir`) it adds `media`: its absolute path, each project's folder and the free and total space of its disk, read on every request; a client that writes there knows how much is left. Without a media folder there is no `media`. With a models folder (`--models-dir`) it adds `models`: its path, whether it is available and the free and total space of its disk, also read on every request. `disk` is always the disk's, never a sum of the listed projects: asking for `managed=include` does not change it or count anything twice."
      responses:
        "200":
          description: Sizes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        total_bytes: { type: integer }
                        client: { type: string, description: "Who made the project (as in `GET /api/projects`)." }
                        kind: { type: string, enum: [generation, image_edit, video_edit], description: "Only on a generation API project (with `managed=include`)." }
                  disk:
                    type: object
                    properties:
                      free_bytes: { type: integer }
                      total_bytes: { type: integer }
                      warn_below_bytes: { type: integer, description: "Below this the space is low: 20 GB, or `ORCHESTRATOR_MIN_FREE_GB` (0 disables the warning)." }
                      low: { type: boolean, description: "Less than `warn_below_bytes` is left. It is a warning: it never prevents launching a run." }
                  media:
                    type: object
                    description: "Only if the server has a media folder. Projects live there (`<dir>/<id>/` with `config/`, `out/` and `tmp/`) and `projects/<id>/` holds links."
                    properties:
                      dir: { type: string, description: "Absolute path of the media folder, as the server sees it." }
                      disk: { $ref: "#/components/schemas/DiskReport" }
                      projects:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            folder: { type: string, description: The project's folder inside the media folder. }
                  models: { $ref: "#/components/schemas/ModelsDirectory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/projects/{id}/storage:
    get:
      tags: [Projects]
      summary: What takes up a project's space, part by part
      description: "The parts: `cache` (`tmp/` without its leftovers), `leftovers` (files in `tmp/` of scenes that no longer exist), `clips` and `animations` (`out/clips/`), `final` (the rest of `out/`: the video, the manifests and the exports), `sources`, `reviews` (`.reviews/`) and `backups` (`scenes.yaml.*`). Each with its bytes and its file count; `cleanable` says whether it can be cleaned (not `final` or `sources`)."
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Breakdown.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_bytes: { type: integer }
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [cache, leftovers, clips, animations, final, sources, reviews, backups] }
                        bytes: { type: integer }
                        files: { type: integer }
                        cleanable: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/projects/{id}/storage/clean:
    post:
      tags: [Projects]
      summary: Cleans parts of a project
      description: Deletes the files of the requested parts (`cache`, `leftovers`, `clips`, `animations`, `reviews`, `backups`) and answers how many bytes it freed. `final` and `sources` are not cleaned this way (400). With a queued or running run it answers 409. Emptying `cache` forces the scenes to be redone on the next run.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parts]
              properties:
                parts: { type: array, items: { type: string } }
      responses:
        "200":
          description: Cleaned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  freed_bytes: { type: integer }
                  cleaned: { type: object, additionalProperties: { type: integer }, description: "Bytes freed per part." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/clips:
    get:
      tags: [Projects]
      summary: Clips the projects have kept
      description: Each run keeps each scene's finished clip at the project's `out/clips/<scene>.mp4` and, for generated scenes, its complete animation (forward and back) at `out/clips/<scene>.anim.mp4`. This lists those of all projects (except `exclude`), to choose one as a scene's own clip with `POST /api/projects/{id}/sources/clip`.
      parameters:
        - { name: exclude, in: query, required: false, schema: { type: string }, description: "Project that is not listed (the current one)." }
        - { name: project, in: query, required: false, schema: { type: string }, description: "Lists only the clips of this project (a video project's gallery)." }
        - { $ref: "#/components/parameters/ManagedInclude" }
        - { $ref: "#/components/parameters/ClientFilter" }
      responses:
        "200":
          description: Kept clips.
          content:
            application/json:
              schema:
                type: object
                properties:
                  clips:
                    type: array
                    items:
                      type: object
                      properties:
                        project: { type: string }
                        scene: { type: string }
                        kind: { type: string, enum: [clip, animation], description: "`clip`: the scene's finished clip; `animation`: its complete animation." }
                        size: { type: integer }
                        modified: { type: string, format: date-time }
                        client: { type: string, description: "Who made the clip's project (as in `GET /api/projects`)." }
                        project_kind: { type: string, enum: [generation, image_edit, video_edit], description: "Only if the project belongs to the generation API (with `managed=include`)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/projects/{id}/sources/clip:
    post:
      tags: [Projects]
      summary: Copies another project's kept clip as a source
      description: Copies `out/clips/<scene>.mp4` from `from_project` to this project's `sources/` (it never replaces a file; without `name` it uses `<project>-<scene>.mp4`, with a number if it already exists). It is a copy, so the scene does not depend on the other project, and deleting it or deleting its runs with their files does not affect it. 404 if the project or its clip do not exist.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_project, scene]
              properties:
                from_project: { type: string }
                scene: { type: string }
                kind: { type: string, enum: [clip, animation], description: "Which one is copied (`clip` by default). The animation is copied by default as `<project>-<scene>-anim.mp4`." }
                name: { type: string, description: "Name of the copy, ending in .mp4, .mov, .webm or .mkv." }
      responses:
        "201":
          description: Copied.
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/projects/{id}/sources/from-url:
    post:
      tags: [Projects]
      summary: Adds the audio of a YouTube video as a source
      description: >-
        Downloads with `yt-dlp` only the audio of ONE YouTube video (`https` on `youtube.com`, `www.`, `m.`, `music.` or `youtu.be`; never playlists) and saves it as `sources/<name>.mp3`. No account or cookies. At most 20 minutes of video, 256 MB and 5 minutes of waiting; closing the request cancels the download and leaves no files. The default name comes from the title (letters, digits, `.`, `_` and `-`, with a numeric suffix if it already exists). An address that is not YouTube answers 400; an existing name, 409; a video that requires signing in, is too long or unavailable, 422; without `yt-dlp` (`bash scripts/get-ytdlp.sh`) or without ffmpeg, 503; if it takes more than 5 minutes, 504.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, description: "https address of a YouTube video." }
                name: { type: string, description: "Name of the source, ending in .mp3 (by default, the video's title)." }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { type: object, properties: { name: { type: string } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: yt-dlp or ffmpeg is missing. }
        "504": { description: The download exceeded 5 minutes and was stopped. }
  /api/projects/{id}/songs/{track}/{variant}:
    delete:
      tags: [Projects]
      summary: Deletes an exported song from a music project
      description: >-
        Deletes that variant's audio (`variant` starts at 0), its cover if no other song uses it, and its entry in `manifest.json`. It does not touch the track definition or the mixes already rendered. With an active or queued run of the project it answers 409; a project that is not a music one, 422.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: track, in: path, required: true, schema: { type: string } }
        - { name: variant, in: path, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /api/projects/{id}/sources/{name}:
    put:
      tags: [Projects]
      summary: Uploads an audio as a source
      description: >-
        Raw body (the file), up to 256 MB. `.mp3`, `.wav` and images (`.png`, `.jpg`, `.jpeg`, `.webp`, for a scene's own image) are stored as they are; a video (`.mp4`, `.mov`, `.mkv`, `.webm`, `.avi`) is converted: its audio is extracted to `<name>.mp3` with ffmpeg and the video is not kept (the response gives the stored name). An existing name answers 409 and is not replaced; a video with no audio or that ffmpeg cannot read answers 422; without ffmpeg, 503.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - name: as
          in: query
          required: false
          description: >-
            `clip`: the upload is a scene's own video (`.mp4`, `.mov`, `.webm` or `.mkv`); it is stored as is in `sources/` and listed as `kind: video`. `picture`: the upload is a scene's starting image. It accepts an image (`.png`, `.jpg`, `.jpeg`, `.webp`), a GIF or a video; a GIF or a video is reduced to its first frame (`<name>.png`, the original is not kept). The response includes `metadata` when the file carried generation data (prompt, negative, seed, steps, cfg, model). Without this parameter everything works as before (a video is still converted to audio).
          schema: { type: string, enum: [picture, clip] }
      requestBody:
        required: true
        content:
          audio/mpeg: { schema: { type: string, format: binary } }
          audio/wav: { schema: { type: string, format: binary } }
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  metadata:
                    type: object
                    description: Only with `as=picture` and if the file carried generation data; all fields are optional.
                    properties:
                      prompt: { type: string }
                      negative_prompt: { type: string }
                      seed: { type: integer, format: int64 }
                      steps: { type: integer }
                      cfg_scale: { type: number }
                      sampler: { type: string }
                      model: { type: string }
                      width: { type: integer }
                      height: { type: integer }
                      strength: { type: number }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: The file exceeds the limit. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: A video needs ffmpeg and it is not installed. }
    delete:
      tags: [Projects]
      summary: Deletes a source
      description: Answers 409 while a track of the project uses it or a run is active.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/artifacts/{path}:
    get:
      tags: [Artifacts]
      summary: Serves a project file (video, image, audio, manifest…)
      description: |
        Read-only; the path is confined to the project. It supports Range
        requests, also for music audio (`.mp3` as `audio/mpeg`,
        `.wav` as audio) so playback can seek forward and back. For `<img>`, `<audio>` and `<video>`, `?ticket=` is used (see
        `POST /api/auth/ticket`) because they cannot send headers.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - name: path
          in: path
          required: true
          description: Path relative to the project, e.g. `out/demo.mp4`.
          schema: { type: string }
          allowReserved: true
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: File content.
          content:
            "*/*":
              schema: { type: string, format: binary }
            audio/mpeg:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
        "206": { description: "Partial content (Range), e.g. a stretch of a music track's audio." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/import/preview:
    post:
      tags: [Import]
      summary: Converts a JSON/HTML dataset into a scenes.yaml (creates nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, description: Content of the JSON or HTML. }
                project: { type: string }
                silence_seconds: { type: number }
                mode:
                  type: string
                  enum: [video, motion, music]
                  description: "video (default) writes scenes; motion writes motion graphics scenes (description + Duration:, Overlay: and other markers); music writes tracks (style + Lyrics: + markers)."
                output_mode:
                  type: string
                  enum: [video, images]
                  default: video
                  description: "images makes the project an images project (`output.mode: images`); only for a scenes dataset (not `mode` music or motion)."
      responses:
        "200":
          description: Preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  yaml: { type: string }
                  report: { type: object, additionalProperties: true }
                  entries: { type: integer }
                  imported: { type: integer }
                  silent: { type: integer }
                  instrumental: { type: integer, description: "Instrumental tracks (mode=music only)." }
                  rejected: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/import/confirm:
    post:
      tags: [Import]
      summary: Creates the project with the previewed YAML
      description: Never overwrites an existing id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, yaml]
              properties:
                id: { type: string }
                yaml: { type: string }
                output_mode:
                  type: string
                  enum: [video, images]
                  default: video
                  description: "replaces the `output.mode` of the YAML; `images` makes an images project."
      responses:
        "201": { $ref: "#/components/responses/CreatedId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/import/package/preview:
    post:
      tags: [Import]
      summary: What a project package contains and what this machine lacks
      description: >-
        The body is the package's `.zip` (`application/zip`). Returns the recipe (the files it uses, with their state on this machine), the catalog downloads that are missing grouped by package (`install`), the missing files the catalog does not know (`unknown`), the suggested id and whether it already exists (`id_taken`), and `ready` when nothing is missing. It creates nothing.
      parameters:
        - { name: lang, in: query, required: false, schema: { type: string, enum: [es, en], default: en } }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "200": { description: The report. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: The package is too large. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/import/package/confirm:
    post:
      tags: [Import]
      summary: Creates a project from a package
      description: >-
        The body is the same `.zip`; `id` is the project identifier. It writes `scenes.yaml` and `sources/` (nothing else from the zip) and never overwrites an existing id. Missing models do not prevent it: the response says what to install (`install`, `unknown`) and `ready` if it can already generate.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: lang, in: query, required: false, schema: { type: string, enum: [es, en], default: en } }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201": { description: "`{id, ready, install, unknown}`." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: The package is too large. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/projects/{id}/scenes/{scene}/motion:
    get:
      tags: [Projects]
      summary: The saved page of a motion graphic or an overlay
      description: >-
        Reads the HTML page that a motion graphic scene (`motion_graphic`) or its overlay (`overlay`, with `?overlay=1`) has saved in `motion/`. Returns `{scene, overlay, exists, html, preview, duration, origin, summary, model, browser}`: `preview` is the same page ready for an isolated frame (content policy and virtual clock first; it is driven with `postMessage({type:"seek", t})`), `duration` the seconds it is fitted to (`?duration=` or the scene's estimate), `origin` is `generated` (as the model wrote it), `edited` or `supplied`. Without a page, `exists` is false.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/SceneId" }
        - { name: overlay, in: query, schema: { type: string, enum: ["1"] }, description: The overlay instead of the graphic. }
        - { name: duration, in: query, schema: { type: number } }
      responses:
        "200": { description: The page (or its absence). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Projects]
      summary: Saves by hand the page of a motion graphic or an overlay
      description: >-
        Replaces the saved page. What is shown is checked without running it: a complete document and nothing loaded from outside (`400` otherwise). A run checks it again in the browser. Body `{html, overlay?}`; returns the same as the GET.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/SceneId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [html]
              properties:
                html: { type: string }
                overlay: { type: boolean }
      responses:
        "200": { description: The saved page. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/projects/{id}/scenes/{scene}/motion/generate:
    post:
      tags: [Assistant]
      summary: Asks the model for a new page for a motion graphic or an overlay
      description: >-
        Writes the page from the scene's saved description with the provider of the `motion_graphics` task, checks it in the browser (up to 3 attempts, giving the model back what failed) and replaces the saved one. Optional body `{overlay?, provider?}`. `503` without Chrome/Chromium or without a model, `409` if a run is in progress and the model loads on this machine, `422` if the model fails to produce a page that works.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/SceneId" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                overlay: { type: boolean }
                provider: { type: string }
      responses:
        "200": { description: "The new page, as in the GET." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: A run is in progress. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: The browser or the model is missing. }

  /api/projects/{id}/videoclip/plan:
    post:
      tags: [Music]
      summary: Plan for a music video from a song
      description: >-
        Splits a song exported from a music project into shots: it distributes its duration among the lyrics sections (`[Verse]`, `[Chorus]`…) according to the text they sing and cuts each section into shots of about `shot_seconds` (6 by default; never more than 60 shots in total). Each shot carries the lyric lines it covers, a camera movement and its image prompt. With `ai: true` the assistant (Ollama, on CPU) writes a common look (`subject_prompt`) and each shot's image; if it cannot (or a run is in progress), the response carries a warning and the prompts come from the style and the lyrics. It creates nothing. `422` if the project is not a music one, the track or version does not exist or the song is gone.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id: { type: string }
                variant: { type: integer, description: Version (0 = the first). }
                shot_seconds: { type: number }
                transition_seconds: { type: number, description: "Fade between shots (0.8 by default)." }
                ai: { type: boolean }
                model: { type: string }
      responses:
        "200": { description: "`{title, caption, audio_file, audio_seconds, transition_seconds, subject_prompt, used_ai, warnings?, sections?, aligned_cuts?, shots: [{id, section, start, seconds, duration, lines?, motion, intensity, prompt}]}`. `duration` is how long the scene lasts (fades eat the end of each one except the last, so the video ends where the song does). The cuts between sections are moved to the clearest volume change of the song near where the text puts them (it reads the audio with ffmpeg; without it they follow the text): `aligned_cuts` is how many of the cuts between the `sections` sections were moved." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/projects/{id}/videoclip:
    post:
      tags: [Music]
      summary: Creates the video project of a song
      description: >-
        Creates the (new) project `id` from a video `yaml` whose background music (`bgm.file`) is the song: it copies it into `sources/` with that name (the original stays) and validates the project; if anything fails it leaves nothing half-done. It never overwrites. `422` if the yaml is not a video one, has no `bgm.file` or its extension is not the song's.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id, id, yaml]
              properties:
                track_id: { type: string }
                variant: { type: integer }
                id: { type: string, description: The new project. }
                yaml: { type: string }
      responses:
        "201": { $ref: "#/components/responses/CreatedId" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/projects/{id}/runs:
    post:
      tags: [Runs]
      summary: Launches a run of the project
      description: |
        The options are equivalent to the CLI flags. The project is validated
        beforehand: an invalid one is never queued. One run per GPU at a time; the
        others wait in the queue.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        description: Send `{}` to launch the run with the default values (the server also tolerates there being no body; the typed client only sends the body if the contract requires it).
        content:
          application/json:
            schema:
              type: object
              properties:
                gpu: { type: string, description: 'One index or several separated by commas, e.g. "0,1".' }
                keep_tmp: { type: boolean }
                force: { type: boolean }
                only: { type: string, description: Id of a scene (or of a track in music mode). }
                vram_warn_mb: { type: integer, default: 2048 }
                overlap: { type: integer, minimum: 0, maximum: 8, default: 0, description: "With one card or none, the narration and the probe of up to N scenes ahead and the clip encoding are done while the card draws another scene (0: one phase after another). Ignored, with a warning, with several cards or with motion graphics and overlays; the result is the same." }
                mode: { type: string, enum: [video, images, music] }
      responses:
        "202":
          description: Run accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  queue_position: { type: integer }
                  warnings: { type: array, items: { type: string }, description: "Warnings that do not prevent the run; currently, that little space is left on the projects' disk." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/runs:
    get:
      tags: [Runs]
      summary: Run history, most recent first
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        "200":
          description: List of runs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/runs/{id}:
    get:
      tags: [Runs]
      summary: A run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: The run (with `queue_position` if it is queued).
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
                  queue_position: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Runs]
      summary: Deletes a finished run from the history
      description: |
        It only touches the history and its events; the generated files (video,
        images, tmp/) are not deleted. It cannot be undone.
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "204": { description: Run deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/runs/{id}/cancel:
    post:
      tags: [Runs]
      summary: Cancels a queued or running run
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Run cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  run: { $ref: "#/components/schemas/Run" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/runs/delete:
    post:
      tags: [Runs]
      summary: Deletes several finished runs at once
      description: |
        Send `ids` **or** a filter (`project`, `states`, `before`), not both.
        Queued or running runs are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }
                project: { type: string }
                states:
                  type: array
                  items: { type: string, enum: [succeeded, failed, cancelled, interrupted] }
                before: { type: string, format: date-time }
      responses:
        "200":
          description: Result of the deletion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer }
                  skipped_active: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/runs/{id}/resources:
    get:
      tags: [Runs]
      summary: VRAM, GPU utilization and RAM sampled during the run
      description: |
        The VRAM is that of the whole GPU during the run, so it includes
        any other process that uses it.
      parameters: [{ $ref: "#/components/parameters/RunId" }]
      responses:
        "200":
          description: Samples and peaks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResources" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/runs/{id}/events:
    get:
      tags: [Events]
      summary: Live run events (SSE)
      description: |
        For `EventSource`, not for a one-off request: «Try it out» does not
        work here. It replays all events and then follows live.
        Messages without `event:` (pipeline event), `run-state` and
        `stream-end`. The pipeline phases are `tts`, `probe`, `render`,
        `animate`, `clip`, `concat`, `export` and, in music mode, `compose` and
        `synth` (with the track id as `scene_id`). A video with background
        music adds, after `concat` and with `scene_id: "_global"`, `bgm` (the
        generated soundtrack) and `mix` (the final video). With a token use `?ticket=`.
      parameters:
        - { $ref: "#/components/parameters/RunId" }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/stats/phase-duration:
    get:
      tags: [Runs]
      summary: How long a phase takes with a model, a size and a card, according to the history
      description: >-
        The median and the 95th percentile of the seconds of a phase (`render`: per image; `animate`: per clip) done with the
        given model, resolution, steps (and, for an animation, frames) and card, from the
        executions of the last 90 days of runs that finished successfully. Phases that a run failed, that were
        cancelled or that were reused from the cache (they have no duration) are not counted. With fewer than `min_executions` executions there is not enough
        history: `enough` is `false` and no duration is given. `gpu` is the card name as given by
        `nvidia-smi`.
      parameters:
        - { name: phase, in: query, required: true, schema: { type: string, enum: [render, animate] } }
        - { name: model, in: query, required: true, description: "The model file (the diffusion one; for an animation, the engine's).", schema: { type: string } }
        - { name: resolution, in: query, required: true, schema: { type: string } }
        - { name: gpu, in: query, required: true, schema: { type: string } }
        - { name: steps, in: query, schema: { type: integer } }
        - { name: frames, in: query, schema: { type: integer } }
      responses:
        "200":
          description: What the history says.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhaseDuration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/estimate:
    post:
      tags: [Runs]
      summary: A project's estimated time, with what this machine has taken
      description: >-
        Adds up the image and animation phases that the project is going to run. For each one it uses the history median
        (see `GET /api/stats/phase-duration`) if there is enough and, if not, the catalog's measured table scaled by the
        card's speed. The rest (narration, probe, clip and join) is CPU and ffmpeg work: it comes from the history
        (per scene and the join) if there is enough of both parts and, if not, from the table (4 s per scene and 15 s), without scaling it by the card. It says where it comes from: `history`,
        `table` or `mixed`, and how many executions at minimum the history part relies on. With `project` that project's cache is
        read and the phases it will reuse add nothing (`cached_phases`). It does not cover music
        projects.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EstimateRequest" }
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/stats:
    get:
      tags: [Runs]
      summary: Aggregated statistics of the history
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: mode, in: query, description: "Only the runs of projects of those types: `video`, `images` or `music`, comma-separated.", schema: { type: string } }
        - { name: origin, in: query, description: "Only the runs of projects made on `desktop` or `mobile` (those the Create page makes, named `mobile-…`), comma-separated.", schema: { type: string } }
        - { name: server, in: query, description: "Only the runs made by those servers (comma-separated names), when several share the history.", schema: { type: string } }
        - { name: client, in: query, description: "Only the runs requested by those clients (comma-separated names, in the form `^[a-z0-9-]{1,32}$`): that of a generation API dashboard, `unknown` or `embedded` (the normal projects). Any other value gives `400`.", schema: { type: string } }
        - { name: since, in: query, description: "RFC 3339 or YYYY-MM-DD (by default, the last 30 days).", schema: { type: string } }
        - { name: until, in: query, schema: { type: string } }
      responses:
        "200":
          description: Totals, duration, days, phases, cache, projects, types (`by_mode`) and GPUs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/auth/ticket:
    post:
      tags: [Access]
      summary: Requests a 10-minute ticket for streams and media
      description: It works only as `?ticket=` on the events and the artifacts.
      responses:
        "200":
          description: Ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { type: string }
                  expiresAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/environment/ollama/unload:
    post:
      tags: [Environment]
      summary: Frees the VRAM Ollama holds
      description: >-
        Asks Ollama to unload all the models it has loaded (those it keeps after last use, `OLLAMA_KEEP_ALIVE`) and returns their names. If there are none, the list is empty. The environment report marks each GPU with `ollama_mb` (memory Ollama holds on it) and `low_vram` (less than 6 GB free).
      responses:
        "200":
          description: Models unloaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  unloaded: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { description: Ollama is unreachable. }
  /api/environment:
    get:
      tags: [Environment]
      summary: Binaries, models, voices, LoRAs and GPUs of the machine
      description: >-
        `content_mode` is `censored` (projects for over-18s do not exist for the API) or `strict` (only those marked as suitable); `edition` is `private` or `public` and is fixed when the program is built (see `docs/DEVELOPMENT.md`): there is no way to change it while running. The binaries include `ace-lm`, `ace-synth` and `ace-server` (music engine; `ace-server` is the server engine, `engine: server`; optional: their absence does not affect video or images) and the report lists in `music` the files of `models/music` and in `music_adapters` the installed LoRA adapters (one per file or folder). `ram` gives the machine's total and available memory (`total_bytes`, `available_bytes`). `ollama` gives the Ollama address in use (`host`), where it comes from (`source`: `setting`, `env` or `default`) and whether it is not this machine (`remote`), without contacting it; with a remote Ollama the Ollama VRAM-retention warning is not added to the GPUs. `disk` gives the free and total space of the projects' disk and whether it is low (`low`, below 20 GB or `ORCHESTRATOR_MIN_FREE_GB`).
      parameters:
        - { name: lora_dir, in: query, schema: { type: string } }
      responses:
        "200":
          description: Environment report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnvironmentReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assist:
    post:
      tags: [Assistant]
      summary: Writes a prompt in English with a local Ollama model (on CPU)
      description: >-
        With `task: music` it writes the style (in English) and the lyrics (in the language of
        the description, with `[Verse]`/`[Chorus]` tags) of a song; with
        `instrumental: true` only the style. With `generator: heartmula` or
        `diffrhythm2` it also asks for the style tags (`tags`: 4 to 8 short
        English words, lowercase and comma-separated) and writes the
        section tags those engines read (`[intro]`, `[verse]`, `[chorus]`, `[bridge]`,
        `[outro]`, `[inst]`, `[solo]`, `[hook]`, `[break]`, `[end]`, lowercase;
        the ones they do not know are removed). With `task: tags` it writes only the tags from
        the style. With `task: lyrics-from-transcript` it arranges the transcription of a
        song (`text`, up to 8000 characters, one segment per line; it may be empty
        if the song has no lyrics and something is given in `hint`, `bpm`, `keyscale` or
        `picture`) into sections by line repetition and proposes a style and tags, **without
        inventing text**: if the model changes the words, the response returns the
        transcription as is under a single section tag and `unchanged_words: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task, text]
              properties:
                task: { type: string, enum: [image, motion, music, tags, lyrics-from-transcript] }
                text: { type: string, description: "Description of the scene or the song, in any language (up to 2000 characters). With `lyrics-from-transcript`, the transcription (up to 8000), which may be empty." }
                generator: { type: string, enum: [ace-step, heartmula, diffrhythm2], description: "Only with `music` and `lyrics-from-transcript`: the track's generator (ace-step by default)." }
                language: { type: string, description: "Only with `lyrics-from-transcript`: ISO 639-1 code of the lyrics." }
                hint: { type: string, description: "Only with `lyrics-from-transcript`: what the user knows about the song (up to 500 characters)." }
                bpm: { type: number, description: "Only with `lyrics-from-transcript`: measured tempo (an estimate)." }
                keyscale: { type: string, description: "Only with `lyrics-from-transcript`: measured key, for example `D minor`." }
                picture: { type: string, description: "Only with `lyrics-from-transcript`: the description of a video's image (up to 2000 characters)." }
                instrumental: { type: boolean, description: "Only with `music`: write only the style, no lyrics." }
                examples:
                  type: array
                  maxItems: 5
                  description: "Prompts of the house style (each field up to 2000 characters), put in the model's context as examples to follow and never to copy. A server that takes them lists `examples` in the `features` of `GET /api/music-motion/catalog`."
                  items:
                    type: object
                    required: [prompt]
                    properties:
                      prompt: { type: string }
                      negative: { type: string }
                      tags: { type: string }
                model: { type: string, description: "A model installed in Ollama (see `GET /api/assist/models`); empty or absent = the server's (`ORCHESTRATOR_ASSIST_MODEL`, otherwise `qwen3:8b`). Nothing is downloaded." }
                provider: { type: string, description: "A provider that replaces the `assistant` routing for this call only (see `GET /api/routing`); if remote it requires consent (`consent_required`)." }
      responses:
        "200":
          description: Generated prompt.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string, description: "The prompt, or the model's answer as is with `music`." }
                  caption: { type: string, description: "Only with `music`: the style, in English." }
                  lyrics: { type: string, description: "Only with `music`: the lyrics with section tags (empty if instrumental)." }
                  tags: { type: string, description: "With `music` for heartmula or diffrhythm2, and with `lyrics-from-transcript` for them: the style tags, normalized. Absent if the model did not give them." }
                  unchanged_words: { type: boolean, description: "Only with `lyrics-from-transcript`: the lyrics have the transcription's words and nothing else." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            The model refused to write the text (code `assist_refused`). The refusal comes from the
            model itself, not from the application: the message names the model and suggests choosing another.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { description: "Ollama is not responding, the model is not installed or there is not enough memory." }

  /api/tts/preview:
    post:
      tags: [Assistant]
      summary: Listen to a narration with an installed voice (Piper, on CPU), without writing anything to the project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, voice]
              properties:
                text: { type: string, description: "The text to read (up to 600 characters)." }
                voice: { type: string, description: "An installed voice, as scenes.yaml names it: `voices/<name>.onnx`." }
                speed: { type: number, description: "Speed, 0.1 to 4 (default 1), the same as the scene's `speed`." }
                speaker: { type: integer, minimum: 0, description: "Speaker of a voice that has several (see `speakers` in `GET /api/environment`); default 0. Out of range is `400`." }
      responses:
        "200":
          description: The audio.
          content:
            audio/wav:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "The voice is not installed (or its `.onnx.json` is missing)." }
        "502": { description: Piper could not synthesize the text. }

  /api/transcribe:
    post:
      tags: [Assistant]
      summary: Transcribe a spoken sentence (Whisper, on the server and on CPU)
      description: >-
        The body is the recording as the browser makes it (WebM/Opus, MP4/AAC, Ogg, WAV or MP3; ffmpeg detects the format), up to 5 MB and 60 seconds. It is read with `whisper-cli` on this machine and the recording lives in a temporary folder only during the call: it is not saved and its text does not go to the logs. Without `language` the language is detected. A recording with no words answers 200 with an empty `text`. Unlike a song's lyrics, it does not wait for runs (it only checks memory) and does not clean up repetitions. More than 5 MB or 60 seconds answers 413; an unreadable audio, 422; without `whisper-cli`, without a model, without ffmpeg or without memory, 503.
      parameters:
        - { name: language, in: query, required: false, schema: { type: string }, description: "ISO 639-1 code (es, en…). Without it, it is detected." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The spoken text.
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  language: { type: string }
                  language_detected: { type: boolean }
                  duration: { type: number, description: Seconds of the recording. }
                  model: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: The recording weighs more than 5 MB or lasts more than 60 seconds. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "whisper-cli, its model, ffmpeg or memory is missing." }
        "504": { description: Took too long and was stopped. }

  /api/assist/listen:
    post:
      tags: [Assistant]
      summary: Listen to a song recorded with the microphone and say what kind it is
      description: >-
        The body is the recording of a song playing, as the browser makes it (up to 10 MB and 60 seconds; at least 4). It measures the tempo and the key with its own estimator, measures how it sounds (timbre, bass, texture, dynamics, rhythm density and volume), reads a few words of the lyrics with `whisper-cli` and asks the assistant to describe the style and what it is about from all of that; if it does not know the genre it says so (`genre_unknown`) instead of inventing it. The lyrics heard are neither returned nor saved, and the recording lives in a temporary folder only during the call. `request` is the sentence to ask for an original song of that style. All figures are estimates; the tempo and the key are only given if they are reliable. It waits until no run is in progress, like the assistant. An unreadable or too short audio answers 422; without `whisper-cli`, model, ffmpeg, memory or assistant, 503.
      parameters:
        - { name: language, in: query, required: false, schema: { type: string }, description: "ISO 639-1 code of the lyrics. Without it, it is detected." }
        - { name: method, in: query, required: false, schema: { type: string, enum: [whisper, clap, muq] }, description: "`clap` adds what LAION-CLAP hears of the sound (its service has to be running: 503 with `error.reason` if not) and returns it in `heard`; `muq` does the same with MuQ-MuLan (503 with `no_service` or `no_weights` if it is not ready)." }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: What was heard.
          content:
            application/json:
              schema:
                type: object
                properties:
                  seconds: { type: number }
                  language: { type: string }
                  no_words: { type: boolean, description: "Fewer than four words recognized: it may be instrumental or its voice could not be read; neither is claimed." }
                  sound: { type: array, items: { type: string }, description: "How it sounds, in plain words, measured on the recording (timbre, bass, texture, dynamics, rhythm, volume)." }
                  heard: { type: array, items: { type: string }, description: "Labels that LAION-CLAP or MuQ-MuLan gave to the sound (with `method=clap` or `method=muq`)." }
                  genre_unknown: { type: boolean, description: "The assistant could not give a genre: the style only describes the sound." }
                  bpm: { type: number }
                  bpm_confidence: { type: number }
                  keyscale: { type: string }
                  key_confidence: { type: number }
                  style: { type: string, description: "Genre, mood, instruments and voice, in English." }
                  theme: { type: string, description: "What the lyrics are about, in their language; empty without words." }
                  request: { type: string, description: The sentence to ask for an original song of that style. }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: A run is in progress. }
        "413": { description: The recording weighs more than 10 MB or lasts more than 60 seconds. }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "whisper-cli, its model, ffmpeg, memory or the assistant is missing." }
        "504": { description: Took too long and was stopped. }

  /api/assist/request:
    post:
      tags: [Assistant]
      summary: Interpret a free-form request (what is asked for, title and the texts of that type) in a single call
      description: >-
        Turns a written or dictated sentence, in any language, into what the generator needs: the type (`video`, `image` or `music`), a short title, the language and the texts of that type, written with the same assistant tasks (CPU, memory check, model refusal, remote provider with consent). An image carries `image_prompt`; a video, `image_prompt` and `motion_prompt` (without `image_prompt` if an image or a video is attached, which are the starting point); a song, `caption`, `lyrics` (empty if instrumental) and, with the `heartmula` or `diffrhythm2` generator, `tags`. The type comes from `kind` (`kind_source: user`), from the model (`model`), from the attachment (`attachment`: an audio is music, an image or a video is video) or is `video` (`default`). If the type is known but a text cannot be written, the response carries the type and the title, that text empty and a warning in `warnings`; if the model refuses the request and there is no text at all, 422 `assist_refused`. An empty text or one of more than 2000 characters, an unknown `kind` or a language that is not an ISO code answer 400; while a run is queued or active, 409; without Ollama, without the model or without memory, 503.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "The request (up to 2000 characters)." }
                language: { type: string, description: "ISO 639-1 code of the request, if known." }
                kind: { type: string, enum: [video, image, music], description: "Sets the type; the model does not decide it." }
                generator: { type: string, description: "Music generator (ace-step, heartmula, diffrhythm2) for the tags and the sections." }
                seconds: { type: integer, minimum: 0, maximum: 1800, description: "With `music`: the song's duration in seconds; sets the structure of the lyrics (up to 75 s short, more than 150 s long, otherwise normal)." }
                instrumental: { type: boolean, description: "With `music`: sets whether the song has vocals when the caller already knows (another suggestion for the same card); without it the request model reads it." }
                attachments:
                  type: object
                  properties:
                    image: { type: boolean }
                    video: { type: boolean }
                    audio: { type: boolean }
                model: { type: string }
                provider: { type: string }
      responses:
        "200":
          description: What was understood.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kind: { type: string, enum: [video, image, music] }
                  kind_source: { type: string, enum: [user, model, attachment, default] }
                  title: { type: string }
                  language: { type: string }
                  image_prompt: { type: string }
                  motion_prompt: { type: string }
                  caption: { type: string }
                  lyrics: { type: string }
                  tags: { type: string }
                  instrumental: { type: boolean }
                  seconds: { type: integer, description: "Duration the request names, or 0." }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: The model refused the request (`assist_refused`). }
        "503": { description: "Ollama is not responding, the model is missing or there is not enough memory." }

  /api/assist/svg:
    post:
      tags: [Assistant]
      summary: Write an SVG drawing from a description
      description: >-
        Writes one SVG document from a description, in any language, with the assistant's guards: the routing of the task (and the consent for a remote provider), the wait for a run in progress, the memory rule, CPU only for a local model, and the model's own refusal. The prompt asks for a single `<svg>` with a `viewBox`, shapes and groups with an `id` on every element worth selecting, fills and strokes as attributes (no `<style>`, gradients, filters or `<text>`), at most 40 elements. What comes back is checked cheaply: it must parse as XML, its root must be `<svg>`, it must have a `viewBox` and it must hold no `<script>`, `<foreignObject>`, event attribute (`onclick`…) or reference to anything outside the document; otherwise `422` `validation_failed` says which. A model that declines is `422` `assist_refused`. An empty text, or one of more than 2000 characters, answers 400; while a run is queued or active, 409; without Ollama, without the model or without memory, 503. It takes as long as any assistant call (tens of seconds to minutes on the CPU). A server that has this operation lists `svg` in the `features` of `GET /api/music-motion/catalog`; a client checks that before offering it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "What to draw (up to 2000 characters)." }
                model: { type: string, description: "An installed model (see `GET /api/assist/models`); without it, the usual routing." }
                provider: { type: string }
      responses:
        "200":
          description: The drawing.
          content:
            application/json:
              schema:
                type: object
                required: [svg]
                properties:
                  svg: { type: string, description: "The SVG document, from `<svg` to `</svg>`." }
                  model: { type: string, description: "The model that was asked for, when the request named one." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: "The model refused (`assist_refused`) or its answer is not a usable SVG (`validation_failed`)." }
        "503": { description: "Ollama is not responding, the model is missing or there is not enough memory." }

  /api/assist/plan:
    post:
      tags: [Assistant]
      summary: Plan a whole animated video from one sentence
      description: >-
        Turns one sentence, in any language, into the plan of a music video: the song's brief (`title`, `caption`, `lyrics`, `tags`, `instrumental`, `seconds`, written by the music task for the given `generator`), the animation's choices (`style`, `level`, `fps`, `mode` and a one-sentence `concept`, each one a value the catalog offers) and the parts worth having, checked against the catalog (`exists`; a part that is not in it carries the `request` that asks for its draft). `animation.prompt` is the sentence itself. It has the guards of the other assistant calls: routing and consent for a remote provider, the wait for a run in progress (`409`), the memory rule, CPU only for a local model and the model's own refusal. A field the model cannot fill, or fills with a value the catalog does not offer, comes empty with an entry in `warnings`; a refusal with nothing written is `422` `assist_refused`. It makes two assistant calls (tens of seconds to minutes on the CPU). A server that has it lists `plan` in the `features` of `GET /api/music-motion/catalog`; a client checks that before using it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: "The sentence (up to 2000 characters)." }
                generator: { type: string, description: "The song's generator (`ace-step`, `heartmula`, `diffrhythm2`); it shapes the lyrics and the tags." }
                language: { type: string, description: "ISO 639-1 code of the sentence, when the caller knows it." }
                seconds: { type: integer, minimum: 1, maximum: 600, description: "The length of the song, when the person already chose it: it is used as is and there is no warning about the length." }
                examples:
                  type: array
                  maxItems: 5
                  description: "Prompts of the house style (each field up to 2000 characters), put in the model's context as examples to follow and never to copy. A server that takes them lists `examples` in the `features` of `GET /api/music-motion/catalog`."
                  items:
                    type: object
                    required: [prompt]
                    properties:
                      prompt: { type: string }
                      negative: { type: string }
                      tags: { type: string }
                model: { type: string, description: "An installed model (see `GET /api/assist/models`); without it, the usual routing." }
                provider: { type: string, description: "A saved provider that replaces the routing for this call only; a remote one needs consent (`consent_required`)." }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                type: object
                required: [song, animation, parts, warnings]
                properties:
                  song:
                    type: object
                    properties:
                      title: { type: string }
                      caption: { type: string }
                      lyrics: { type: string, description: "Empty when instrumental." }
                      tags: { type: string }
                      instrumental: { type: boolean }
                      seconds: { type: integer, description: "0 or absent when the sentence names no length (with a warning)." }
                  animation:
                    type: object
                    properties:
                      style: { type: string, description: "A value of `styles` in the catalog; empty with a warning when not." }
                      level: { type: string }
                      fps: { type: integer }
                      mode: { type: string }
                      concept: { type: string }
                      prompt: { type: string, description: "The sentence, to use as the person's direction for the piece and its proposals." }
                  parts:
                    type: array
                    description: "At most 6."
                    items:
                      type: object
                      required: [name, exists]
                      properties:
                        name: { type: string }
                        exists: { type: boolean }
                        request: { type: string, description: "Only when it does not exist: the sentence for `POST /api/music-motion/part-drafts`." }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: "The model refused (`assist_refused`)." }
        "503": { description: "Ollama is not responding, the model is missing or there is not enough memory." }

  /api/assist/dataset:
    post:
      tags: [Assistant]
      summary: Write a dataset of several entries from one sentence
      description: >-
        Turns one sentence, in any language, into a dataset in the tuple shape `POST /api/import/preview` reads: a storyboard (`mode: video`: each entry is a scene with its `Dialogue:`, `Motion:` and picture line), animated graphics (`motion`: an entry names a part of the catalog with `Part:` and `Param` lines, checked against it, or describes a graphic with `Graphic:`) or songs (`music`: each entry is a track with its style, `Lyrics:` unless instrumental and `Tags:` in the `generator`'s vocabulary; at most 6 tracks, each one more model call). At most 12 entries. The lines the request fixes are written by the server, not left to the model: `negative` becomes the `Negative:` line and `images.variants` the `Variants:` line of every scene, and `look` ends the picture line of every scene. Every entry is checked with the import's own mapping before it is returned; one that fails (a repeated id is renamed, a scene with no picture line, a part that is not in the catalog) is left out with an entry in `warnings`, so what comes back previews. It has the guards of `POST /api/assist/plan`: routing and consent for a remote provider, the wait for a run in progress (`409`), the memory rule, CPU only for a local model and the model's refusal (`422` `assist_refused`); nothing usable written is `422` `validation_failed`. A server that has it lists `dataset` in the `features` of `GET /api/music-motion/catalog`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, text]
              properties:
                mode: { type: string, enum: [video, motion, music] }
                text: { type: string, description: "The sentence (up to 2000 characters)." }
                language: { type: string, description: "ISO 639-1 code of the sentence, and of the narration." }
                engine: { type: string, description: "The video generator the scenes are for (video mode)." }
                negative: { type: string, maxLength: 500, description: "Written as the shared `Negative:` line of every scene (video mode)." }
                look: { type: string, maxLength: 200, description: "A phrase of style that ends the picture line of every scene (video mode)." }
                images:
                  type: object
                  properties:
                    variants: { type: integer, minimum: 1, maximum: 16, description: "Written as `Variants:` in every scene (video mode)." }
                generator: { type: string, description: "The music generator whose tag vocabulary the tracks use (music mode)." }
                examples:
                  type: array
                  maxItems: 5
                  description: "Prompts of the house style (each field up to 2000 characters), put in the model's context as examples to follow and never to copy. A server that takes them lists `examples` in the `features` of `GET /api/music-motion/catalog`."
                  items:
                    type: object
                    required: [prompt]
                    properties:
                      prompt: { type: string }
                      negative: { type: string }
                      tags: { type: string }
                model: { type: string, description: "An installed model (see `GET /api/assist/models`); without it, the usual routing." }
                provider: { type: string, description: "A saved provider that replaces the routing for this call only; a remote one needs consent (`consent_required`)." }
      responses:
        "200":
          description: The dataset.
          content:
            application/json:
              schema:
                type: object
                required: [entries, mode, warnings]
                properties:
                  entries:
                    type: array
                    description: "`[id, title, lora_info, text]` tuples (`lora_info` is empty): send them, as JSON, as the `content` of `POST /api/import/preview` with the same `mode`."
                    items: { type: array, minItems: 4, maxItems: 4, items: { type: string } }
                  mode: { type: string }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: "The model refused (`assist_refused`) or nothing usable was written (`validation_failed`)." }
        "503": { description: "Ollama is not responding, the model is missing or there is not enough memory." }

  /api/prompts:
    get:
      tags: [Prompts]
      summary: Search the prompt presets
      description: >-
        Prompts of a house style that people pick from and that the assistant receives as examples. Kept as JSON files under `<media dir>/prompts/<kind>/` (beside the projects directory when there is no media directory). `q` matches title, prompt and tags (case-insensitive) and sorts the title matches first; `tags` lists tags that must all be present; the rest is by date, newest first. A censored server does not list the presets marked `nsfw`. Presets written to that folder by the command `orchestrator prompts fetch` (public datasets whose licence it reads from their card) are listed without a restart.
      parameters:
        - { name: kind, in: query, required: false, schema: { type: string, enum: [image, video, motion, music, animation] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: tags, in: query, required: false, schema: { type: string }, description: "Comma-separated." }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: The presets and how many matched.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PromptPreset" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Prompts]
      summary: Save a preset of the person's own
      description: >-
        Created with `own: true` and `source: "user"`; `kind` and `prompt` (up to 2000 characters) are required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, prompt]
              properties:
                kind: { type: string, enum: [image, video, motion, music, animation] }
                title: { type: string }
                prompt: { type: string }
                negative: { type: string }
                tags: { type: array, items: { type: string } }
                engine: { type: string }
                language: { type: string }
                nsfw: { type: boolean }
      responses:
        "201": { description: "The preset.", content: { application/json: { schema: { $ref: "#/components/schemas/PromptPreset" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/prompts/{id}:
    delete:
      tags: [Prompts]
      summary: Delete a preset of the person's own
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "A bundled preset is read-only (`forbidden`)." }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/prompts/import:
    post:
      tags: [Prompts]
      summary: Import a bundle of presets
      description: >-
        A bundle is `{format: "prompt-presets", version: 1, items: [...]}` (at most 20000 items, 32 MiB). An item with the same `kind`, `source` and `source_id` as one already kept counts in `already`; one without `source` or `licence`, with an invalid `kind`, an empty prompt or one over 2000 characters is in `refused` with its `index` and the `reason`, and the rest is still added (as bundled, read-only presets).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [format, version, items]
              properties:
                format: { type: string, enum: [prompt-presets] }
                version: { type: integer, enum: [1] }
                items: { type: array, items: { $ref: "#/components/schemas/PromptPreset" } }
      responses:
        "200":
          description: What was done with the bundle.
          content:
            application/json:
              schema:
                type: object
                required: [added, already, refused]
                properties:
                  added: { type: integer }
                  already: { type: integer }
                  refused:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        reason: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assist/models:
    get:
      tags: [Assistant]
      summary: Chat models installed in Ollama that the assistant can use
      description: >-
        Excludes embedding and reranking models. `fits` says whether the model passes the assistant's
        memory rule (its size times 1.3 plus 4 GiB) with the memory free right now (always
        `true` if it cannot be read). `default` is the model used when a request names
        none.
      responses:
        "200":
          description: Installed models, from smallest to largest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer, format: int64 }
                        fits: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Ollama is not responding. }

  /api/assist/music-tags:
    get:
      tags: [Assistant]
      summary: HeartMuLa style tag vocabulary, by category
      description: >-
        The tags among which the assistant chooses for HeartMuLa and against which the server
        checks its answer, so that a client can offer the same ones.
      responses:
        "200":
          description: Categories (genre, mood, instrument, tempo, voice, era and production) with their tags, and the ten popular combinations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        tags: { type: array, items: { type: string } }
                  combos:
                    type: array
                    description: The popular tag combinations.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        tags: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings:
    get:
      tags: [Settings]
      summary: Server settings
      description: >-
        Six blocks: `ollama`, `heartmula`, `diffrhythm2`, `remote`, `browser` and `motion_model`.
        `ollama.host` is the address in use and `source` where it comes from: `setting` (saved here),
        `env` (`OLLAMA_HOST`) or `default` (`http://127.0.0.1:11434`). `remote` is `true` when the
        address is not this machine (neither `localhost`, nor `127.0.0.0/8`, nor `::1`): what the
        assistant, «describe a reference» and the quality review send to Ollama then
        leaves this computer. `saved` is the saved value, or empty.
      responses:
        "200":
          description: Settings in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Settings]
      summary: Saves or removes the Ollama address
      description: >-
        It is saved in `~/.config/mediaorquestator/settings.json` (permissions 600) and applies from the
        next request, without restarting. Priority: saved setting, `OLLAMA_HOST`, default
        value. Only `http` or `https` addresses are accepted (or without a scheme: `http`), with a host,
        no user or password, no path, query or fragment, and up to 200 characters.
        An empty value removes the setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ollama_host: { type: string, description: "Address, like `192.168.1.50:11434`; empty = remove the setting." }
                music_motion:
                  type: object
                  properties:
                    review_drafts: { type: boolean, description: "Grade every part draft of music motion with the vision model of the `check` task." }
      responses:
        "200":
          description: Settings in use after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/ollama/test:
    post:
      tags: [Settings]
      summary: Tests the connection to an Ollama
      description: >-
        Asks Ollama for its version and its models (and which of them read images) in 5 seconds at
        most, without following redirects, with a cap of 4 MiB and 200 models. It sends nothing from the
        user and saves nothing. An address where nobody answers is a normal response
        (`ok: false` with the reason), not an HTTP error. It applies the same validation as saving.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string, description: "Address to test; by default, the one in use." }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  host: { type: string }
                  remote: { type: boolean }
                  version: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        vision: { type: boolean }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/database:
    get:
      tags: [Settings]
      summary: Where the run history is stored
      description: >-
        `saved` is what is stored and `active` what this server started with: the engine is read only once, at startup, so
        changing it requires a restart (`restart_required`). It never returns the password (`password_set`). `server_name` is what
        this server is called in a shared history and `servers` the names that already have runs in it.
      responses:
        "200":
          description: The database.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Settings]
      summary: Saves where the history is stored
      description: >-
        `driver` is `sqlite` (the file, the default), `mysql` or `postgres`; with a server, `host`, `name` and `user` are needed
        (`port` defaults to the engine's). An omitted `password` keeps the saved one if the rest names the same server.
        It does not connect (see `/test`) and is applied on restart. `server_name` sets this server's name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseRequest" }
      responses:
        "200":
          description: What was saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatabaseSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/database/test:
    post:
      tags: [Settings]
      summary: Tests the connection to a database
      description: >-
        Opens the connection with what the form says (the saved password if omitted) and asks for its version. It creates or changes
        nothing. A database where nobody answers is a normal response (`ok: false` with the error), not an HTTP error. `empty` says
        that it does not yet have the history tables (they are created on startup with it).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DatabaseRequest" }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  empty: { type: boolean }
                  error: { type: string }
        "400": { description: "The data is not a database, or it is SQLite, which has nothing to test." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/database/copy:
    post:
      tags: [Settings]
      summary: Copies the history from the SQLite file to the saved database
      description: >-
        Creates the tables if missing and copies runs, events, samples, reviews, findings and calibration from the file; rows
        that are already there (by id) are left as they are, so it can be repeated, and everything is done in one transaction. The rows
        in the file belong to this server. It will keep using the file until restart. `409` without a saved MySQL or Postgres
        database, if this server already stores the history in it or while a run is queued or running; `502` if the copy fails.
      responses:
        "200":
          description: How many rows were copied from each table.
          content:
            application/json:
              schema:
                type: object
                properties:
                  copied: { type: object, additionalProperties: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "There is no saved database, it is already in use or a run is active." }
        "502": { description: The copy failed and nothing was changed. }

  /api/metrics:
    get:
      tags: [Environment]
      summary: This server's state in the Prometheus text format
      description: >-
        Everything is computed on request and speaks only of this server (in a shared history, each one counts its own runs). It never names
        a project in a label, so one hidden by the content mode is not given away. Families: `mediaorquestator_info`,
        `_uptime_seconds`, `_database_up`, `_runs{state,client,kind}`, `_run_duration_seconds{client,kind}` (histogram of the last 1000 successful runs; `kind` is `video`, `edit` or `project` and `client` the dashboard that requested the run, `embedded` for normal projects; only the 20 clients with the most runs are named and the rest are summed under `other`),
        `_memory_{used,total,available}_bytes`, `_disk_free_bytes{folder}`, `_gpu_{memory_used,memory_total}_bytes`,
        `_gpu_utilization_ratio`, `_gpu_temperature_celsius`, `_gpu_power_watts` (per card, absent if there is no `nvidia-smi`),
        `_music_service_running{service}` and `_music_service_starting{service}`. It requires the same token as the rest of `/api`: in
        Prometheus, `metrics_path: /api/metrics` and `authorization: { credentials_file: ... }`.
      responses:
        "200":
          description: The metrics, version 0.0.4 of the exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/monitoring:
    get:
      tags: [Settings]
      summary: The saved monitoring tools
      description: >-
        Grafana, Prometheus, Loki and Redis, in that order, with their address and user. It never returns the password (`secret_set`).
        The server depends on none of them: it only stores what it is told and looks at them when asked.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringTools" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/monitoring/{tool}:
    put:
      tags: [Settings]
      summary: Saves a tool's address
      description: >-
        `tool` is `grafana`, `prometheus`, `loki` or `redis`. The address is `host[:port]` or an http(s) URL (the default
        port is the tool's: 3000, 9090, 3100, 6379; for Redis, only `host[:port]`). With `user` the calls
        carry Basic authentication; without `user`, `secret` is a token sent as Bearer (for Redis, the password). An omitted
        `secret` keeps the saved one if the address and the user are the same. An empty address removes the tool.
        It does not connect (see `/test`).
      parameters:
        - { name: tool, in: path, required: true, schema: { type: string, enum: [grafana, prometheus, loki, redis] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringRequest" }
      responses:
        "200":
          description: The saved tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitoringTools" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/settings/monitoring/{tool}/test:
    post:
      tags: [Settings]
      summary: Tests a monitoring tool
      description: >-
        Asks about its health and, with user and password, about something that needs them: Grafana `/api/health` and `/api/org`, Prometheus
        `/-/healthy` and its version, Loki `/ready` and its version, Redis `PING`. It writes nothing anywhere and saves nothing. Without a
        body it tests what is saved. A tool that is switched off is a normal response (`ok: false` with the error), not an HTTP error.
      parameters:
        - { name: tool, in: path, required: true, schema: { type: string, enum: [grafana, prometheus, loki, redis] } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitoringRequest" }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  version: { type: string }
                  authenticated: { type: boolean, description: "A user and password were given and the tool accepted them (or not)." }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/settings/heartmula/test:
    post:
      tags: [Settings]
      summary: Tests the connection to a HeartMuLa service
      description: >-
        Asks only `GET /health` of the service (given address or the saved one, with its password or the given one).
        It sends no lyrics or tags and saves nothing. An address where nobody answers is a
        normal response (`ok: false` with the reason), not an HTTP error.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string, description: "Address to test; by default, the saved one." }
                token: { type: string, description: "Password to use; by default, the saved one (or none if another address is given)." }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  host: { type: string }
                  remote: { type: boolean }
                  version: { type: string }
                  gpu: { type: string }
                  free_mb: { type: integer }
                  reason: { type: string, description: "unreachable or key_rejected." }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/settings/diffrhythm2/test:
    post:
      tags: [Settings]
      summary: Tests the connection to a DiffRhythm2 service
      description: >-
        Asks only `GET /health` of the service (given address or the saved one, with its password or the given one).
        It sends no lyrics or style and saves nothing. An address where nobody answers is a
        normal response (`ok: false` with the reason), not an HTTP error.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                host: { type: string, description: "Address to test; by default, the saved one." }
                token: { type: string, description: "Password to use; by default, the saved one (or none if another address is given)." }
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  host: { type: string }
                  remote: { type: boolean }
                  version: { type: string }
                  gpu: { type: string }
                  free_mb: { type: integer }
                  reason: { type: string, description: "unreachable or key_rejected." }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/music/engines:
    get:
      tags: [Music]
      summary: Optional music generators and whether they can be used now
      description: >-
        `heartmula`, `diffrhythm2` and `clap` (LAION-CLAP, which does not generate music: it only hears the sound of an audio and is
        started and stopped the same way): each one available if there is an external service configured that answers, or
        a possible local service (installed with `scripts/get-services.sh`, with dotnet, installed weights and a GPU
        with free memory). It starts no service; the response is cached for 30 s. If it is not
        available, `reason` says why (`no_service`, `no_weights`,
        `no_gpu`, `unreachable`, `no_consent`, `key_rejected`, `not_running`). The services are started
        and stopped by the user (`/start`, `/stop`); with one stopped the reason is `not_running` and `container`
        says the state. `?stats=1` also asks for the memory each one uses (uncached).
      parameters:
        - name: stats
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Availability of each generator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  engines:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        available: { type: boolean }
                        mode: { type: string, enum: [local, external] }
                        reason: { type: string }
                        detail: { type: string }
                        missing: { type: array, items: { type: string } }
                        version: { type: string }
                        container: { $ref: "#/components/schemas/ContainerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/music/engines/{engine}/start:
    post:
      tags: [Music]
      summary: Start a generator's service (or the LAION-CLAP service)
      description: >-
        Starts the `heartmula` or `diffrhythm2` service, or the LAION-CLAP service (`clap`, which is not a
        generator: it only serves to hear the sound of an audio), on the requested GPU (by default the one with the most free
        memory) and waits in the background for the service to say `ready`; the state is queried with
        `GET /api/music/engines`. The service stays up until it is stopped: neither a run nor the server
        shutdown stops it.
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string, enum: [heartmula, diffrhythm2, clap] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                gpu: { type: integer, description: CUDA index of the card. }
      responses:
        "202":
          description: Starting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/ContainerState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Cannot be started (`validation_failed` with `reason`); no service, weights or GPU installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/music/engines/{engine}/stop:
    post:
      tags: [Music]
      summary: Stop a generator's service (or the LAION-CLAP service)
      description: >-
        Stops the `heartmula`, `diffrhythm2` or `clap` service. 409 if an active music run uses that generator.
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string, enum: [heartmula, diffrhythm2, clap] } }
      responses:
        "200":
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/ContainerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/providers:
    get:
      tags: [Settings]
      summary: Model providers (the built-in Ollama first, then the saved ones)
      description: >-
        The `ollama` provider always exists (`builtin: true`), takes its address from the Ollama setting and cannot
        be edited or deleted here. `remote` is `true` when the address is not this machine. A key
        is never returned: only `key_set`.
      responses:
        "200":
          description: List of providers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Settings]
      summary: Adds a provider
      description: >-
        `type` is `ollama` (another Ollama, with the address rules of the Ollama setting) or `openai` (any
        compatible server: OpenAI, OpenRouter, Together, Groq, vLLM, LM Studio, llama.cpp). For `openai`
        the address carries an `http` or `https` scheme, no credentials, query or fragment, and its path is
        empty or ends in `/v1`. Without `id` it is derived from the name. The key is saved in `keys.json` (permissions
        600), never in `settings.json`, and is not sent over plain `http` to another machine (use `https`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "201":
          description: Provider created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/providers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Settings]
      summary: Edits a saved provider
      description: >-
        An absent `key` leaves the key as it is, an empty one removes it (the provider stays) and any other value
        saves it. The built-in `ollama` provider is not edited here: its address is changed in the Ollama settings.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProviderInput" }
      responses:
        "200":
          description: Provider after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Settings]
      summary: Deletes a provider and its key
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/providers/{id}/test:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Settings]
      summary: "Tests a provider: lists its models"
      description: >-
        Asks for the models (`GET /v1/models` or Ollama's tags) in 5 seconds at most, without following
        redirects, with a cap of 4 MiB and 200 models. It sends nothing from the user; the key goes only to the
        provider itself, as Bearer. A provider that does not answer or rejects the key is a
        normal response (`ok: false` with the reason), not an HTTP error.
      responses:
        "200":
          description: Test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  host: { type: string }
                  remote: { type: boolean }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        vision: { type: boolean, description: "Ollama only." }
                  error: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/routing:
    get:
      tags: [Settings]
      summary: Which provider runs each task
      description: >-
        Five tasks: `assistant` (prompt assistant: image, motion, song and music-video
        storyboard), `describe_image`, `describe_video`, `quality` (clip quality review) and
        `motion_graphics` (writing the HTML page of a motion graphic or overlay, text model). By default
        all go to the built-in Ollama. `model` is the provider's text model for `assistant` and the vision
        model for the others (empty on an Ollama with no declared model). `remote` says whether the provider is not
        this machine and `consented` whether the user agreed to send data to its current address. `max_calls` is
        the cap on calls from one job to a remote provider.
      responses:
        "200":
          description: Routing in use.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routing" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Settings]
      summary: Changes the provider of one or more tasks, or the call cap
      description: >-
        `routing` assigns a provider id to a task (`ollama` returns it to the built-in one). Routing a
        task to a **remote** provider requires the user's acknowledgement that the images, videos or
        texts of that task will leave this computer: it is given here with `acknowledge_remote: true` or beforehand with
        `POST /api/providers/{id}/acknowledge`; without it, `400` with the code `consent_required`. An OpenAI-compatible
        provider without the model the task needs is rejected (`no_model`). Nothing changes if
        anything fails. `max_calls` (at least 1; default 60) is the cap on calls per job to a
        remote provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                routing:
                  type: object
                  additionalProperties: { type: string }
                  description: "Task → provider id."
                acknowledge_remote: { type: boolean }
                max_calls: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Routing after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Routing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/providers/{id}/acknowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [Settings]
      summary: Agrees to send data to a remote provider, at its current address
      description: >-
        It is saved tied to the provider and its base address: if the address changes it has to be accepted
        again. The built-in provider does not need it (404).
      responses:
        "200":
          description: The provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/generation/options:
    get:
      tags: [Generation]
      summary: Which ways there are to make a video and with which models an image can be retouched
      description: >-
        The ways of making a video now (`video`, in stable order; the first available one is the
        default) and the models an image can be retouched with (`image_models`), each with what a
        client needs to draw its form without knowing the engines. An option this machine cannot
        run comes with `available: false` and the `reason`. A server that hides adult content does not offer the models
        made for adults (nor in the catalog): they do not exist for the API. The identifiers of the video options
        (`h3-full`, `wan-high`, `ltx`, `h3-draft`, `wan-medium`, `wan-low`, `ad-high`, `ad-medium`, `ad-low`) are
        those of the interface. `estimate` is the seconds of a generation at the best quality, 16:9 and with no start
        image; it does not grow with the duration, because the motion repeats (`clip_seconds`).
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GenerationOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/generations:
    get:
      tags: [Generation]
      summary: Lists the video generations, most recent first
      responses:
        "200":
          description: Generations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Generation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Makes a video in a single call
      description: >-
        Plans the generation (engine, models, resolution, duration, audio), creates it as a project of its own
        (hidden: it does not appear in `GET /api/projects`, the storage or the per-project statistics), launches its run
        on the usual queue and answers `202` with its identifier and the run's. With a start image the
        request is `multipart/form-data` (`request` part with the JSON and `image` part); without it, `application/json`.
        The duration is the scene's: the engine's clip is short (`clip_seconds`) and repeats until it fills it; clips are not
        chained. `422` with the reason if the option does not accept the request (duration, aspect ratio,
        quality, audio, unknown option, neither prompt nor image) or if the server does not keep adult content;
        `503` if the option cannot be run now. In both cases nothing is created.


        Besides the start image it accepts an **end image** (`end_image`) with the options whose `inputs` says
        `end_image: true`, and **references** (images, videos and audios) with those that advertise `reference_images`
        (`h3-ref`, `h3-ref-draft`), with the maximums and durations of `inputs`, which depend on the card. References
        cannot be combined with `image` or `end_image`, and carry at least one image, which anchors the
        scene and is the first reference; in the prompt they are named `<Picture 1>`, `<Picture 2>`… in the order of the
        parts. An end image needs the start one. With an end image the clip does not go back and forth: it plays
        once and its last frame is held until the duration is filled. `reuse_inputs_of` uses the files of
        another generation without sending them again. Each rejection is a `422` with the part and what is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GenerationRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: "The request JSON (`GenerationRequest`)." }
                image: { type: string, format: binary, description: "Start image: png, jpg, jpeg or webp." }
                end_image: { type: string, format: binary, description: "End image (png, jpg, jpeg or webp): only with the options that have `inputs.end_image`; needs `image`." }
                reference_images:
                  type: array
                  items: { type: string, format: binary }
                  description: "Reference images, in order (the first anchors the scene). Only with the options that have `inputs.reference_images`."
                reference_videos:
                  type: array
                  items: { type: string, format: binary }
                  description: "Reference videos (mp4, mov, webm or mkv), each up to `inputs.reference_videos.max_seconds`."
                reference_audios:
                  type: array
                  items: { type: string, format: binary }
                  description: "Reference audios (mp3, wav, m4a, aac, ogg or flac), each up to `inputs.reference_audios.max_seconds`."
      responses:
        "202":
          description: Generation accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The option cannot be run now (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/generations/{id}:
    get:
      tags: [Generation]
      summary: State and progress of a generation
      description: >-
        `state` is `queued`, `running`, `done` or `failed`; `progress` goes from 0 to 100 according to the run phases that
        have finished; when done, `video` is the video's address (a read-only artifact, with the same
        access as the rest of the API) and, if it failed, `error` says why. Events are followed at
        `GET /api/runs/{run_id}/events`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Generation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Cancels and deletes a generation with its files and its run history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/music-motion/catalog:
    get:
      tags: [Music motion]
      summary: The parts, characters and options a piece is made with
      description: >-
        What is needed to draw a piece's form without knowing the engine: the catalog's animated parts
        (with their parameters, limits and levels), the characters and backgrounds of the illustrated library, the levels, the
        styles, the frame rates, a character's actions, the typefaces and the modes. It is read on each
        request: a part or a character added in the user's folder appears in the next one. The scenes written for the verses of a
        piece (parts with `scene`) are **not** in `parts` unless asked for: `include=scene` adds all of them, `piece=<id>` adds
        those written for that piece.
      parameters:
        - { name: include, in: query, required: false, schema: { type: string, enum: [scene] }, description: "`scene` adds every scene part." }
        - { name: piece, in: query, required: false, schema: { type: string }, description: "Adds the scene parts written for this piece." }
      responses:
        "200":
          description: The catalog.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicMotionCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/music-motion/parts/{name}:
    get:
      tags: [Music motion]
      summary: Reads back a part
      description: >-
        The `manifest` and the `fragment` (`part.html`) of a part of the catalog, the user's (`source: user`) or one that
        comes with the program (`source: builtin`), so a part can be carried to another server (post them as a part draft
        there) or drawn in a browser. `404` for a name that is not a part or is not a valid name. It holds only what is
        in the two files, and `origin` when the part has one.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The part.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicUserPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Music motion]
      summary: Replaces a part of the user's
      description: >-
        Writes a new `manifest` and `fragment` over a part of the user's folder, with the checks of an approval
        (manifest and fragment rules, page, motion, two identical drawings), without going through a draft. The manifest
        must keep the name of the part. The part keeps its origin and the catalog lists the change at once. `409` for a
        part that comes with the program (`source: builtin`); `422` with the problems, or with a manifest that names another
        part, and nothing changes; `503` if Chrome is missing.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartDraftPut" }
      responses:
        "200":
          description: The part as the catalog lists it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: Chrome is missing. }
    delete:
      tags: [Music motion]
      summary: Deletes a part of the user's
      description: >-
        Removes the part's folder; the catalog stops listing it at once. `409` if a piece's script (main part, extra or
        layer item) or a style uses it, naming them in the message, unless `force=true`; `409` too for a part that
        comes with the program (`source: builtin`). Nothing is changed in the pieces or styles that used it: they stop
        being valid until they get another part.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: force, in: query, required: false, schema: { type: boolean }, description: Delete it even if pieces or styles use it. }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/music-motion/part-drafts:
    get:
      tags: [Music motion]
      summary: Lists the part drafts, most recent first
      description: >-
        A draft is a new part written by the assistant from a sentence and, if given, an image. It
        is not in the catalog until it is approved. The list carries neither `manifest` nor `fragment` (they are in the read of one).
      responses:
        "200":
          description: Drafts.
          content:
            application/json:
              schema:
                type: object
                required: [drafts]
                properties:
                  drafts:
                    type: array
                    items: { $ref: "#/components/schemas/PartDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Music motion]
      summary: Requests a part draft from a sentence and, optionally, an image
      description: >-
        The JSON body may be up to 8 MiB (`x-max-body-bytes`: 8388608), enough for a part sent as text with a vector drawing or a
        picture in it; a larger one is `400` naming the limit.


        With a JSON body (`request` and, to use a frame from the library, `reference_id` and `frame`, one of
        `analysis.frames`) or with `multipart/form-data` (`request` and, if wanted, `file` with a png, jpg or webp of
        up to 20 MB). The image is optional: without it the part is written from the sentence alone (`with_picture` is `false`).
        Answers `202` with the draft in the `writing` state; the work continues in the background and moves to `ready` or to
        `failed` (with `error`). If there is an image, the age is checked before writing anything: a minor, or a person whose age
        cannot be confirmed, stops the draft and the image is not kept. The assistant is asked up to 3 times, with
        the reason for the previous rejection. `422` with the reason if the sentence is missing or exceeds 500 characters, the reference or
        the frame are not valid or the file is not an image (nothing is created); `409` while a run is queued or
        active and the model is local; `503` with the reason if there is no Chrome or assistant, or if an image is given and there is no
        vision model (a given image is not discarded in order to continue without it).


        **Choosing the model:** `model` (in the JSON body, or a `model` field of the form) names one of the installed models
        (`GET /api/assist/models`) that writes the part instead of the one the motion-graphics task is routed to. One that is not
        installed is `422` naming it and the installed ones, and nothing is created. The draft keeps it (`model`), and a retry
        writes with the same one. It does not choose the vision model that reads an image.


        **Choosing the provider:** `provider` (JSON body or form field) is the id of a saved provider (`GET /api/providers`)
        that writes the part instead of the `motion_graphics` routing, for this draft only (the routing is not written);
        `model` then names a model of that provider. A remote provider needs consent (`400 consent_required`), an unknown one
        is `400` naming it, and both are refused before anything is created. The draft keeps it (`provider`) and a retry uses
        the same one.


        **A scene for a verse:** a JSON body with `scene: {piece, script_piece, brief?}` (JSON only; with it `request` is **not
        needed** and, when sent, is taken as the idea if there is no `brief`; without `scene`, `request` stays required). The server
        builds the writer's whole input from the saved piece: the script piece's lines with their words and times (in the piece's
        seconds) and keyword, the hit, the section and its number, the mode, the resolved design, the length, the parts of the
        neighbouring pieces and the scene rubric; no lyric is sent by the client. `brief` is the idea or metaphor asked for (up
        to 500 characters, else `422`). An unknown `piece` or `script_piece` is `404` and a piece with no script `422`, before
        anything is created. The draft carries `scene` and `brief`, is written with the scene instruction, may draw the lyric itself
        (`verse: own` in its manifest), is checked and previewed in the verse's own lines and fails when a word is not drawn at its
        time. The part it becomes is named `scene-<short>-<n>` (`<short>` is the end of the piece's id, so the name fits the 32
        characters a part name has; the piece is in the manifest's `scene.piece`) and its manifest carries `scene`. `multipart` does
        not take `scene`. `manifest`/`fragment`, a reference or a frame with `scene` is `422`. A server that has scenes lists `scene` in
        the `features` of the catalog.


        **From scratch, with no assistant:** a JSON body with `manifest` and `fragment` (strings, as in the draft's `PUT`)
        instead of `request`. They are checked like an edit is (rules, page, motion, a name that is not in the catalog) and the
        preview is drawn before answering `200` with the draft: `ready`, or `failed` with its `problems` (and the two files,
        so it can be edited with `PUT`) if they do not pass. It needs only Chrome (`503` without it), no assistant and no
        vision model. `manifest`/`fragment` with a picture or a frame is `400`.


        **Change an existing part with the assistant:** `request` (the instruction, 1 to 500 characters) together with
        `manifest` and `fragment` (the current text; the manifest must be a JSON with its `name`). The assistant starts from
        that text instead of from nothing and writes the changed version; it is the same flow as a draft asked for with a sentence
        (`202` with the draft `writing`, the same checks and preview, up to 3 attempts, then `ready` or `failed`). The draft
        has `replaces`: the name of the given manifest, which the new version may keep although the catalog already has it (it
        keeps it unless the instruction asks for another). To store the result over an approved part, send its `manifest` and
        `fragment` with `PUT /api/music-motion/parts/{name}`; `approve` still refuses a name the catalog has. `422` if the
        manifest or the fragment is missing or the manifest has no name; with a picture or a frame, `400`. It needs the
        assistant like a draft from a sentence (`503`, `409` as there).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartDraftRequest" }
          multipart/form-data:
            schema:
              type: object
              properties:
                request: { type: string }
                file: { type: string, format: binary }
      responses:
        "200":
          description: A draft made from a manifest and a fragment (`ready` or `failed`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartDraft" }
        "202":
          description: Draft accepted; it is being written.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "Chrome, the assistant or, with an image, the vision model is missing." }

  /api/music-motion/part-drafts/{id}:
    get:
      tags: [Music motion]
      summary: A draft with its manifest, its fragment, its problems and its preview
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Music motion]
      summary: Replaces a draft's manifest and fragment
      description: >-
        They are checked like any part (manifest and fragment rules, page, motion, two identical
        drawings, a name that is not in the catalog). If they pass they are saved, another preview is drawn and the draft
        becomes `ready`; otherwise, `422` with the problems and the draft does not change. `409` while it is being written.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PartDraftPut" }
      responses:
        "200":
          description: The draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartDraft" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: Chrome is missing. }
    delete:
      tags: [Music motion]
      summary: Deletes a draft with its files
      description: If it is being written, it stops the work.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/part-drafts/{id}/retry:
    post:
      tags: [Music motion]
      summary: Another attempt on a failed draft
      description: >-
        Asks the assistant for the part again with the same sentence and the same description of the image (it is not
        described again). Answers `202` with the draft in `writing`. `422` if it is not `failed` or if its image was deleted (because of
        a minor); `409` if it is being written or there is a run with a local model; `503` if Chrome or the assistant is missing.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Another attempt in progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartDraft" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: Chrome or the assistant is missing. }

  /api/music-motion/part-drafts/{id}/approve:
    post:
      tags: [Music motion]
      summary: "Approves a draft: the part moves to the catalog"
      description: >-
        Only a `ready` draft. It is checked again, the manifest and the fragment are copied to the user's parts
        folder (where the catalog lists it) and the draft is deleted. Answers the part as the
        catalog lists it. `409` if that folder already has a part with that name (the name is changed by editing the draft) or
        if it is being written; `422` if it is not `ready` or no longer passes the checks. Nothing approves a draft by itself.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The new catalog part.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: Chrome is missing. }

  /api/music-motion/part-drafts/{id}/preview/{name}:
    get:
      tags: [Music motion]
      summary: A frame of a draft's preview
      description: "`name` is one of those in `preview` (for example `01.png`)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: The frame.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/presets:
    get:
      tags: [Music motion]
      summary: Lists the styles, most recent first
      description: >-
        A style is a design, a rhythm and a list of catalog parts taken from a reference; a piece can
        start from one (`preset` when creating it). A style is kept even if its reference is deleted.
      responses:
        "200":
          description: Styles.
          content:
            application/json:
              schema:
                type: object
                required: [presets]
                properties:
                  presets:
                    type: array
                    items: { $ref: "#/components/schemas/MotionPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Music motion]
      summary: Extracts a style from an already analysed reference, or makes one from its fields
      description: >-
        Without `reference_id` the style is made from `name` (required), `design`, `rhythm` and `parts`, with the same
        validation as `PUT /presets/{id}` (`422` naming the field), and no reference or assistant is involved; sending
        `reference_id` together with those fields is a `422`. With `reference_id`:
                The design comes from the video's colors by rules (always valid: if the accent does not contrast enough it is
        adjusted and the style says so in `adjustments`), the typefaces and finishes from what the description of the
        look says, the rhythm from how long a shot lasts, and the parts are chosen by the assistant from the description and
        the catalog (without an assistant, or if it fails, the list stays empty and the style is made anyway). `422` with the reason
        if the reference does not exist or is not ready yet. Answers `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotionPresetRequest" }
      responses:
        "201":
          description: Style created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionPreset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/presets/{id}:
    get:
      tags: [Music motion]
      summary: A style
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The style.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionPreset" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Music motion]
      summary: Replaces a style's name, design, rhythm and parts
      description: >-
        Validates the whole style (the design as a whole design, the rhythm between 2 and 15 seconds, the catalog
        parts without repeats and at most 8): `422` with the reason, which names the field (`design.accent`, `rhythm`,
        `parts[0]`…).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotionPresetPut" }
      responses:
        "200":
          description: The style.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionPreset" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Music motion]
      summary: Deletes a style
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/references:
    get:
      tags: [Music motion]
      summary: Lists the references, most recent first
      description: >-
        The reference library: videos given as an example of a good piece. Each one with its state
        (`analysing`, `ready` or `failed`), title, tags and, if ready, its analysis.
      responses:
        "200":
          description: References.
          content:
            application/json:
              schema:
                type: object
                required: [references]
                properties:
                  references:
                    type: array
                    items: { $ref: "#/components/schemas/MotionReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Music motion]
      summary: Adds a reference from a YouTube address or an uploaded video
      description: >-
        With a JSON body (`url`, `title`, `notes`, `tags`) it takes the address of a YouTube video like a project's
        sources (no account or cookies); with `multipart/form-data` it receives the video in the `file` field (and
        `title`, `notes`, `tags`). Answers `202` with the reference in the `analysing` state: the analysis is done in the
        background and the reference moves to `ready` or to `failed` (with the reason in `error`). `422` with the reason if
        the address is not valid, the file is not a video or the video lasts more than 20 minutes; in that case nothing is
        created. The video is not kept: only its key frames and the analysis. A reference does not leave the server nor
        is it used to generate images or video.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotionReferenceRequest" }
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                notes: { type: string }
                tags: { type: string, description: "JSON list of tags or comma-separated tags." }
      responses:
        "202":
          description: Reference accepted; it is being analysed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: yt-dlp is missing. }

  /api/music-motion/references/{id}:
    get:
      tags: [Music motion]
      summary: A reference with its analysis
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionReference" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Music motion]
      summary: Changes a reference's title, notes or tags
      description: Each field is optional; one that is not sent stays as it was. `422` if any is not valid.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MotionReferencePatch" }
      responses:
        "200":
          description: The changed reference.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MotionReference" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
    delete:
      tags: [Music motion]
      summary: Deletes a reference with its files
      description: If it is being analysed, it stops the analysis.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/references/{id}/learn:
    post:
      tags: [Music motion]
      summary: Learn from a reference
      description: >-
        Learns from a `ready` reference in the background and proposes only what is different from what exists: one style and
        up to three parts. A proposal whose distance to the closest style, part or draft is below the threshold of the
        `strictness` is not made and is listed under `discarded` with the reason. A style that is kept is a normal style
        (`origin` `learned`); a part is a draft (`origin` `learned`) until it is approved. Nothing enters the catalog by itself.
        Without an assistant, a browser or a vision model the style is still drawn and what was left out is said in `skipped`.
        Answers `202` with the learning in `running`; read it with `GET /api/music-motion/learnings/{id}`. If a learning of this
        reference is running it answers `200` with that one and starts nothing. `404` for a reference that does not exist,
        `409` if it is not `ready`, `422` for a strictness that is not `low`, `normal` or `high`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LearnRequest" }
      responses:
        "200":
          description: A learning of this reference was already running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learning" }
        "202":
          description: The learning started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learning" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/learnings:
    get:
      tags: [Music motion]
      summary: The learnings, newest first
      parameters:
        - { name: reference_id, in: query, description: "Only the learnings of this reference.", schema: { type: string } }
      responses:
        "200":
          description: The learnings.
          content:
            application/json:
              schema:
                type: object
                required: [learnings]
                properties:
                  learnings: { type: array, items: { $ref: "#/components/schemas/Learning" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/music-motion/learnings/{id}:
    get:
      tags: [Music motion]
      summary: A learning with its proposals
      description: >-
        What the learning kept (`styles` and `part_drafts`, each with what became of it now), what it dropped as too similar
        (`discarded`) and what it could not do (`skipped`). The drafts are read live: one that is still being written says
        `writing`. An item that no longer exists (deleted, or a draft approved into the catalog) says `gone`. A learning that
        was running when the server stopped reads `failed`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The learning.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Learning" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/references/{id}/frames/{name}:
    get:
      tags: [Music motion]
      summary: A key frame of a reference
      description: "`name` is one of those in `analysis.frames` (for example `03.jpg`)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: The frame.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/pieces:
    get:
      tags: [Music motion]
      summary: Lists the pieces, most recent first
      description: >-
        Summaries, without the script, the design or the song map (they are in `GET /api/music-motion/pieces/{id}`).
      responses:
        "200":
          description: Pieces.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MusicPiece" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Music motion]
      summary: Creates a piece from a song of a music project
      description: >-
        Reads the song (tempo, beats, sections, lyrics with timings and volume: the song map), picks a design
        and proposes a script with a fixed rule (no assistant: it is immediate), and saves everything as a piece of its own
        (a hidden project: it does not appear in `GET /api/projects`, the statistics or the per-project storage). Without
        `style` it is `typographic`; without `level`, `simple`; without `fps`, 30 (24 in the `illustrated` style); without
        `resolution`, 1280x720. If the song has not been transcribed, the lyrics' verses are distributed across its
        sections and `song_map.words_estimated` is `true`. `422` with the reason if anything is not valid (level, style,
        speed, resolution, client, design, unknown song); in that case nothing is created. Answers `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicPieceRequest" }
      responses:
        "201":
          description: Piece created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiece" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}:
    get:
      tags: [Music motion]
      summary: A piece with its design, its script and its song map
      description: >-
        `state` is `draft` (not yet drawn), `queued`, `running`, `done` or `failed`; `progress` goes from 0 to 100; when
        done, `video` is the video's address (a read-only artifact). `estimate` is a forecast of the
        drawing time (always `estimate: true`), corrected with how long the previous drawings took on this
        machine. Events are followed at `GET /api/runs/{run_id}/events`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The piece.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiece" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Music motion]
      summary: Cancels and deletes a piece with its files and its run history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/music-motion/pieces/{id}/design:
    put:
      tags: [Music motion]
      summary: Sets the piece's design
      description: >-
        Replaces the design after validating it (hexadecimal colors, typefaces from the list, modes, an accent with
        3:1 contrast against the background of the modes in use, a concept of up to 200 characters) and checking
        that the saved script is still valid with it. A design set this way is marked as the user's (`edited`): a new
        song does not overwrite it. `422` with the reason if it is not valid; `409` while it is being drawn.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicDesign" }
      responses:
        "200":
          description: The saved design.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicDesignStored" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/script:
    put:
      tags: [Music motion]
      summary: Sets the piece's script
      description: >-
        Replaces the script after validating it whole: the pieces cover the song with no gaps or overlaps, each part is
        in the catalog and its parameters within their limits, the keyword and the word hit are words of
        their verses, and the stages use characters, poses, expressions and actions from the library and do not leave a
        character half out of frame (unless it enters or leaves). `422` with the piece and the reason if it is not valid;
        `409` while it is being drawn.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicScript" }
      responses:
        "200":
          description: The saved script.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicScript" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/preview:
    post:
      tags: [Music motion]
      summary: Builds the pages of a piece without saving anything
      description: >-
        The pages the render would draw, each wrapped for a sandboxed frame (the virtual clock and the beat clock, and
        `postMessage({type:"seek", t})` to move it) with the song map cut to its piece. The body may carry a `design`
        and a `script`; they replace the saved ones for this call only. `422` with the same reason as `PUT /design` and
        `PUT /script` when one is not valid, and nothing is saved in any case. `?scenes=p1,p4` builds only those pieces
        (`422` for a name that is not a piece). Needs no Chrome and is allowed while the piece is being drawn.
        `replacements` lists the pieces whose part was swapped for the level; a saved script is drawn as it is, so it is
        empty today.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: scenes, in: query, required: false, schema: { type: string }, description: "Piece ids, separated by commas." }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                design: { $ref: "#/components/schemas/MusicDesign" }
                script: { $ref: "#/components/schemas/MusicScript" }
      responses:
        "200":
          description: The pages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiecePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/frame:
    get:
      tags: [Music motion]
      summary: A frame of the saved piece, drawn like the render
      description: >-
        A PNG of the saved piece at second `t`, drawn with Chrome as the render draws it, to compare with a preview in
        the browser; not for scrubbing. `422` for a `t` that is not a number or is outside the piece (no browser is
        started); `503` when there is no Chrome.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: t, in: query, required: true, schema: { type: number } }
      responses:
        "200":
          description: The frame.
          content:
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: There is no Chrome. }

  /api/music-motion/library/characters/{name}:
    get:
      tags: [Music motion]
      summary: Reads a character of the library with its drawings
      description: "The character as the server reads it, with the SVG of each pose. `404` for a name that is not in the library or is not a valid name."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The character.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicLibraryCharacter" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/library/backgrounds/{name}:
    get:
      tags: [Music motion]
      summary: Reads a background of the library with its drawing
      description: "`404` for a name that is not in the library or is not a valid name."
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The background.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicLibraryBackground" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/pieces/{id}/review:
    post:
      tags: [Music motion]
      summary: Grades the whole piece with the vision model, scene by scene and as a whole
      description: >-
        In the background (`202`): for each script piece three frames of its page (near the start, at its first word, near the end) are
        graded against the scene rubric by the vision model of the `check` task, then one frame of each scene is tiled into a contact sheet
        and graded for consistency of type, palette and frame and for scenes that repeat a metaphor. Read it on the piece as `review`
        (`state` `running`, then `done` or `failed`). `409` while a proposal, a render, a batch of scenes or another review of this piece
        runs, or a run holds the memory a local vision model needs; `422` without a script; `503` without Chrome or a vision model. A server with
        it lists `review` in the `features` of `GET /api/music-motion/catalog`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The review has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPieceReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "Chrome or the vision model is missing." }

  /api/music-motion/pieces/{id}/scenes:
    post:
      tags: [Music motion]
      summary: Writes a scene for every script piece, in the background
      description: >-
        One draft per script piece (or the ones in `script_pieces`), written one after the other with the same engine as
        `POST /part-drafts` with `scene` (so each has its previews and problems) and reported in the piece's `scenes`
        (`done` rises to `total`). `brief_mode` is `metaphor` (the default: the writer chooses the visual metaphor for what each verse
        means) or `literal` (it draws what the words say). `model`/`provider` as in the drafts. Nothing is approved: each draft is
        approved like any draft, or all at once with `POST /scenes/approve`. `202` with the batch. `409` while a proposal, a render
        or another batch of this piece runs, or a run holds the memory a local model needs; `422` without a script; `404` for a
        `script_pieces` id that is not in the script; `503` without Chrome or assistant. Listed as `scene` in the catalog's `features`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                script_pieces: { type: array, items: { type: string }, description: "Script piece ids; empty writes every piece." }
                brief_mode: { type: string, enum: [metaphor, literal], default: metaphor }
                model: { type: string }
                provider: { type: string }
                review: { description: "As `review` in `POST /part-drafts`, passed to every draft of the batch.", oneOf: [{ type: boolean }, { type: object, properties: { min: { type: integer }, attempts: { type: integer } } }] }
      responses:
        "202":
          description: The batch has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSceneBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "Chrome or the assistant is missing." }
    delete:
      tags: [Music motion]
      summary: Stops the batch after the draft it is writing
      description: Answers `202` with the batch (`cancelled` once the current draft is finished); `404` when the piece has no batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSceneBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/pieces/{id}/scenes/approve:
    post:
      tags: [Music motion]
      summary: Approves every ready scene of the batch and puts it in the script
      description: >-
        Each `ready` draft of the batch is approved (it becomes a scene part, `scene-<short>-<n>`) and becomes the `part` of its script
        piece (its `params` and `animate` are cleared); the script is validated and saved as `PUT /script` does. Answers `200` with
        `approved` (script piece, part, draft), `not_approved` (the drafts that were not ready or failed the checks, with their state and
        reason; their script pieces keep their parts) and the saved `script`. `422` naming the script piece when the script changed since the
        batch started (a script piece is not the one its scene was written for, or is gone); `409` while the batch is still writing;
        `404` without a batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What was approved.
          content:
            application/json:
              schema:
                type: object
                required: [approved, not_approved, script]
                properties:
                  approved:
                    type: array
                    items:
                      type: object
                      properties:
                        script_piece: { type: string }
                        part: { type: string }
                        draft_id: { type: string }
                  not_approved:
                    type: array
                    items:
                      type: object
                      properties:
                        script_piece: { type: string }
                        draft_id: { type: string }
                        state: { type: string }
                        error: { type: string }
                  script: { $ref: "#/components/schemas/MusicScript" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/propose:
    post:
      tags: [Music motion]
      summary: Asks the assistant for a new design or script
      description: >-
        With `what: design` it proposes a design from the style and the lyrics; with `what: script`, a script from the
        song map, the design, the level and the catalog. The assistant's answer is validated and, if it is not valid, it is
        asked again with the reason, up to 3 times; without an assistant, or if all 3 fail, the result comes from a fixed
        rule and `source` is `fallback` (it is not an error). Parts the level does not support are replaced by
        simpler ones and are reported in `replacements`. What is proposed is saved and replaces what was there.
        Every `fallback` carries its `fallback_reason`, and the answer names the `model`. `what: all`, and any proposal with
        `async: true`, answers `202` with the state and works in the background: read `proposal` in the piece until it is `done`
        or `failed`; while a run is queued or active it is `waiting` instead of falling back at once. A synchronous proposal
        falls back at once when a run holds the memory. The fixed rule does not read the `prompt`. `409` while another
        proposal of the piece is being written, and for an edit of the piece meanwhile.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicProposeRequest" }
      responses:
        "200":
          description: What was proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicProposeAnswer" }
        "202":
          description: Accepted; it is written in the background (`proposal` in the piece).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicProposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/render:
    post:
      tags: [Music motion]
      summary: Draws the piece
      description: >-
        Validates the script, writes the piece's project (one scene per script piece, with its page and its song
        map, and the song as the soundtrack), launches its run on the usual queue and answers `202` with the
        run identifier and the time forecast. Scenes whose piece has not changed come from the cache. `409`
        if it is already being drawn; `503` if there is no Chrome or Chromium.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Drawing started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicRenderAnswer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: There is no browser to draw with (`unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/music-motion/pieces/{id}/transcribe:
    post:
      tags: [Music motion]
      summary: Hears when each word of the piece's song is sung
      description: >-
        Reads the song with Whisper word by word (on the CPU: about a third of the song's duration) and rebuilds the song
        map: each word of the written lyrics carries the time at which it is heard (the lyrics do not change: what is
        heard only sets the times; a word that Whisper hears differently or does not hear takes a time between its
        neighbours), the verses keep their number and each section starts where its first word is sung;
        `song_map.words_estimated` becomes `false`. If the user did not edit the script, it is rebuilt with the fixed rule; if
        they edited it, it is kept and `script_warning` says how many of its pieces end up more than a second from a boundary of
        the new sections. It does not change the design, the level, the style or the frames. Without words heard it returns
        the piece as it was, with `words_note`. `409` if a run is in progress (also the piece's own: Whisper
        needs memory), `503` with the reason if Whisper is not installed or does not fit in memory, `404` if the piece
        does not exist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The piece with the rebuilt map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiece" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { description: Whisper failed to read the song (`internal`). , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503":
          description: Whisper is not installed or does not fit in memory (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/image-edits:
    post:
      tags: [Generation]
      summary: Retouches an image in a single call
      description: >-
        Takes an image (the `image` part of a `multipart/form-data` request), a model, a prompt, an optional negative
        prompt, an optional strength and a number of variants; creates the retouch as a project of its own
        (hidden, like the generations), launches its run on the usual queue and answers `202`. An `img2img` model
        starts from the image with `strength` (default 0.6) and makes up to `max_variants` variants; an `instruction` one
        changes the image according to the text («put a red cap on the man»), keeping the image's shape, and does not accept
        `strength` or `negative_prompt`. `422` with the reason if the model does not accept the request (blank prompt,
        `strength` outside (0, 1], variants outside 1 up to what the model makes, a setting it does not take) and
        `503` if the model cannot be run now; in both cases nothing is created.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request, image]
              properties:
                request: { type: string, description: "The request JSON (`ImageEditRequest`)." }
                image: { type: string, format: binary, description: "The image to retouch: png, jpg, jpeg or webp." }
      responses:
        "202":
          description: Retouch accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The model cannot be run now (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/image-edits/{id}:
    get:
      tags: [Generation]
      summary: State, progress and results of a retouch
      description: >-
        When done, `results` carries one image per variant with the seed that recreates it and its address
        (a read-only artifact).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The retouch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEdit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Cancels and deletes a retouch with its files and its run history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/video-edits/options:
    get:
      tags: [Generation]
      summary: Which tools can edit a video on this machine
      description: >-
        Lists the tools in stable order (`scale`, `interpolate`, `reframe`, `remove-background`, `depth`,
        `extend`, `motion-control`), each with its identifier, name, description, `available`, the reason if it is not
        available, the settings it accepts (name, type, limits, default value) and whether it needs a reference image.
        A tool that lacks files, binaries or the vision service comes with `available: false` and
        the reason; the list never fails.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEditOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/video-edits:
    get:
      tags: [Generation]
      summary: Lists the video edits, most recent first
      description: Edits do not appear in `GET /api/projects`, nor in the storage or in the per-project statistics.
      responses:
        "200":
          description: The edits.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoEdit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Edits a video in a single call
      description: >-
        Takes a video (the `video` part), a tool with its settings, a reference image if the
        tool takes one (the `image` part) and an optional `client`; creates the edit as a project of its own
        (hidden), launches its run on the usual queue and answers `202` with the edit's identifier and the
        run's. `motion-control` can take, instead of `video`, the identifier of a motion from the
        library (`motion` in `request`); with both, with neither, with a motion that does not exist or is not
        `ready`, or with a `start` that leaves fewer than 33 frames, it is `422`. `422` also for a setting the
        tool does not accept (it says which), a file that is not a readable video, an image that is missing or
        extra; `503` with the reason if the tool cannot be run now. In no case is anything created.
        If another heavy process is running, the response carries the same warning as any run and the edit waits its turn.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: "The request JSON (`VideoEditRequest`)." }
                video: { type: string, format: binary, description: "The video: mp4, mov, webm or mkv. Required except in `motion-control` with `motion`." }
                image: { type: string, format: binary, description: "The reference image: png, jpg, jpeg or webp. Only if the tool takes one (`motion-control`), and then required." }
      responses:
        "202":
          description: Edit accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The tool cannot be run now (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/video-edits/{id}:
    get:
      tags: [Generation]
      summary: State, progress and result of a video edit
      description: >-
        When done, `result` carries the video's address (a read-only artifact) and what it has.
        If it failed, `error` says why and no partial result is offered.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEdit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Cancels, if running, and deletes an edit with its files and its project
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/motions:
    get:
      tags: [Generation]
      summary: Lists the motion library
      description: >-
        Short videos of people moving that `motion-control` can apply to any image. The library
        starts empty: the server ships no videos.
      responses:
        "200":
          description: The motions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Motion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Adds a motion from a video
      description: >-
        Takes a video (`multipart/form-data`: the `request` part with optional `title` and `tags` and the
        `video` part, or in `request` the `source` address of a YouTube video (an `https` address, the only kind the sources of a
        project take too; anything else is `422`)), answers `202` with the motion in the `processing` state and prepares it in the background:
        its control frames (people's depth with the background in black, at 16 fps and 832x480) and its
        preview. It lasts at most 30 seconds and has at least one person; otherwise, `422` with the reason and nothing is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: "The request JSON (`MotionRequest`)." }
                video: { type: string, format: binary, description: "The video; not needed if `request` carries `source`." }
      responses:
        "202":
          description: Motion accepted, being prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Motion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The vision service is not available (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/motions/{id}:
    get:
      tags: [Generation]
      summary: A motion from the library
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The motion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Motion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Removes a motion from the library
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/motions/{id}/preview:
    get:
      tags: [Generation]
      summary: A motion's preview
      description: >-
        Accepts `?ticket=` in place of the Authorization header, so a `<video>` element can play it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: A small video with the source image.
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models/availability:
    get:
      tags: [Settings]
      summary: Which model tasks can run now
      description: >-
        For each routed task (`assistant`, `describe_image`, `describe_video`, `quality`, `motion_graphics`) it resolves the
        provider and says whether it can be used now: `{available, provider: {id, name, type}, reason?}`.
        `reason`: `unreachable` (no answer in 3 s), `no_models` (an Ollama with no chat model; embedding
        and reranker models do not count), `no_vision_model` (no model that reads images), `no_model` (an OpenAI-compatible
        provider without the task's model), `no_consent` (remote not accepted: it is not
        contacted) or `key_rejected` (its model list answers 401 or 403). It sends nothing from the user and
        loads no model. It is cached for 30 s on the server and discarded when settings, providers,
        keys or routing change. The interface hides the controls of an unavailable task.
      responses:
        "200":
          description: Availability per task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        available: { type: boolean }
                        provider:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string, enum: [ollama, openai] }
                        reason: { type: string, enum: [unreachable, no_models, no_vision_model, no_model, no_consent, key_rejected] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/describe:
    post:
      tags: [Assistant]
      summary: Describes an image or a video uploaded to `sources/` and returns the prompt that would draw it
      description: >-
        Reads the file with a local Ollama vision model (nothing leaves the machine) and writes a
        prompt in English. For a video, 4 to 8 frames are extracted, described and merged into an
        image prompt and a motion prompt. The file is only read: it reaches no generator.
        Before returning anything the age of each person is checked (every frame, in a video): if
        anyone is or looks under 18, or it cannot be confirmed, the response is `describe_minor`, there is no
        prompt and the file is deleted from `sources/`. The application adds no further filters: if it is the
        model itself that refuses or does not describe, the response is `describe_refused` and the message
        names the other installed vision models. It is rejected while an execution is queued
        or active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, source]
              properties:
                project: { type: string }
                source: { type: string, description: "Name of an image (png, jpg, webp) or a video (mp4, mov, webm, mkv, avi) among the project's sources." }
                model: { type: string, description: "An installed vision model (see `GET /api/describe/models`); empty = `gemma4:26b`, or the first installed." }
                detail: { type: boolean, description: "Without `model`: use the most detailed model, if there is one (only the private edition has one; it is ignored in the public one)." }
                split: { type: boolean, description: "Videos only: describe one shot per scene (`shots`) instead of a single prompt. Cuts are found with ffmpeg; shots shorter than 1.5 s are merged with the previous one and there are at most 12. An image ignores it." }
                provider: { type: string, description: "A provider that replaces the task's routing for this call only (the retry after a refusal); if remote it requires consent. There is never an automatic switch." }
      responses:
        "200":
          description: Description.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt: { type: string }
                  motion: { type: string, description: "Videos only: motion prompt of about 25 words (may be missing)." }
                  model: { type: string, description: The model that described. }
                  kind: { type: string, enum: [image, video] }
                  frames: { type: integer }
                  provider: { type: string, description: The id of the provider that described. }
                  shots:
                    type: array
                    description: "Only with `split` on a video: one element per shot, in order (a video without cuts gives one that covers everything). `prompt` is the first one's."
                    items:
                      type: object
                      properties:
                        start: { type: number, description: Second at which the shot starts. }
                        end: { type: number }
                        prompt: { type: string }
                        motion: { type: string, description: "Motion of about 25 words (may be missing)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            `describe_refused` (the model refused or did not describe; the error body adds `provider` and `alternatives: [{provider, name, model}]` with other models of the same provider and the other providers with a vision model, to retry with `provider`) or `describe_minor` (a person is or
            looks under 18, or their age could not be confirmed; the file was deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { description: "Ollama is not responding, the model is not installed or there is not enough memory." }

  /api/describe/models:
    get:
      tags: [Assistant]
      summary: Vision models installed in Ollama that the describe step can use
      description: >-
        `default` is the one used without `model` (`gemma4:26b`, or the first installed); `detail` is the
        most detailed model if installed (private edition only), empty if not. `fits` says whether it passes the memory rule
        (its size times 1.3 plus 4 GiB) with the memory free now.
      responses:
        "200":
          description: Vision models, from smallest to largest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: { type: string }
                  detail: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer, format: int64 }
                        fits: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Ollama is not responding. }

  /api/assets:
    get:
      tags: [Models]
      summary: Installed files by type (models, voices, LoRA, video, music, adapters)
      description: >-
        The `adapter` type (music LoRA adapters, in `models/music/adapters/`) lists
        each adapter once, whether it is a `.safetensors` file or a folder with
        `adapter_model.safetensors` and `adapter_config.json`, with the total size of its files.
      responses:
        "200":
          description: Inventory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        dir: { type: string }
                        extensions: { type: array, items: { type: string } }
                        note: { type: string }
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assets/catalog:
    get:
      tags: [Models]
      summary: Recommended catalog, with whether each entry is installed
      description: >-
        Adapter entries (`kind: adapter`) name their files as `<folder>/<file>` (a single level). Music entries (`kind: music`) are packages of four files with `role` `lm`, `text_encoder`, `dit` and `vae` that are installed in `models/music/`; the supporting ones are shared between packages.
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assets/{kind}/{name}:
    delete:
      tags: [Models]
      summary: Deletes an installed file
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [model, voice, lora, video, music, adapter] }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/civitai/resolve:
    get:
      tags: [Models]
      summary: Files of a Civitai model version
      parameters:
        - name: ref
          in: query
          required: true
          description: URL of the model on Civitai.
          schema: { type: string }
      responses:
        "200":
          description: Model, version and available files.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/tokens/{service}:
    put:
      tags: [Models]
      summary: Saves the download key for Hugging Face or Civitai
      description: The key is never returned in any response.
      parameters: [{ $ref: "#/components/parameters/TokenService" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Models]
      summary: Deletes the saved key
      description: "409 if there is no file and the key comes from an environment variable."
      parameters: [{ $ref: "#/components/parameters/TokenService" }]
      responses:
        "204": { description: Deleted (also if there was none). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/downloads:
    get:
      tags: [Downloads]
      summary: Recent downloads, newest first
      responses:
        "200":
          description: List of downloads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads:
                    type: array
                    items: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Downloads]
      summary: Queues a download (direct URL, Hugging Face or catalog entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [model, voice, lora, video, music, adapter] }
                url: { type: string }
                repo: { type: string }
                file: { type: string }
                revision: { type: string, default: main }
                id: { type: string, description: Id of a catalog entry. }
                name: { type: string }
                overwrite: { type: boolean }
      responses:
        "202":
          description: Download queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/downloads/{id}:
    get:
      tags: [Downloads]
      summary: A download
      parameters: [{ $ref: "#/components/parameters/DownloadId" }]
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/downloads/{id}/cancel:
    post:
      tags: [Downloads]
      summary: Cancels a queued or in-progress download
      parameters: [{ $ref: "#/components/parameters/DownloadId" }]
      responses:
        "200":
          description: Download cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/downloads/{id}/events:
    get:
      tags: [Downloads]
      summary: Live download progress (SSE)
      description: |
        For `EventSource`, not for a one-off request. Events
        `download-state`, `progress` and `stream-end`. With a token use `?ticket=`.
      parameters:
        - { $ref: "#/components/parameters/DownloadId" }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token configured when the server starts (`ORCHESTRATOR_TOKEN`).
  parameters:
    ManagedInclude:
      name: managed
      in: query
      required: false
      description: "`include` also lists the generation API projects (`api-gen-`, `api-edit-`, `api-vid-`) as ordinary projects, with their `client` and `kind`. Without it they are not listed. Any other value is a 400. Music motion animations (`api-mm-`) never appear."
      schema: { type: string, enum: [include] }
    ClientFilter:
      name: client
      in: query
      required: false
      description: "Comma-separated list of clients (client names, `embedded` or `unknown`): only the items of those clients appear. A name that is not valid is a 400."
      schema: { type: string, example: "video-studio,embedded" }
    ProjectId:
      name: id
      in: path
      required: true
      description: Project identifier.
      schema: { type: string }
    SceneId:
      name: scene
      in: path
      required: true
      description: Scene identifier.
      schema: { type: string }
    RunId:
      name: id
      in: path
      required: true
      description: Run identifier.
      schema: { type: string }
    ReviewId:
      name: rid
      in: path
      required: true
      description: Review identifier.
      schema: { type: string }
    FindingId:
      name: fid
      in: path
      required: true
      description: Finding identifier.
      schema: { type: string }
    DownloadId:
      name: id
      in: path
      required: true
      description: Download identifier.
      schema: { type: string }
    TokenService:
      name: service
      in: path
      required: true
      schema: { type: string, enum: [huggingface, civitai] }
    Ticket:
      name: ticket
      in: query
      description: Ticket from `POST /api/auth/ticket`, for clients that cannot send headers.
      schema: { type: string }
  schemas:
    PromptPreset:
      type: object
      required: [kind, prompt]
      properties:
        id: { type: string, description: "Given by the server." }
        kind: { type: string, enum: [image, video, motion, music, animation] }
        title: { type: string }
        prompt: { type: string, maxLength: 2000 }
        negative: { type: string }
        tags: { type: array, items: { type: string }, description: "Lower case, at most 20." }
        engine: { type: string }
        language: { type: string }
        source: { type: string, description: "Where it comes from; required in a bundle (`user` for the person's own)." }
        source_id: { type: string, description: "Its id at the source; with `kind` and `source` it says a preset was already imported." }
        licence: { type: string, description: "Required in a bundle." }
        nsfw: { type: boolean }
        own: { type: boolean, description: "The person's own; only these can be deleted." }
        created_at: { type: string, format: date-time }
    MonitoringRequest:
      type: object
      description: >-
        All fields are optional. An empty body, or an empty `address`, removes the tool (and its key). Without `user`, no
        user is saved. With `secret` absent the saved key is kept if the address and the user do not change; with `secret` (even
        if empty) what arrives is saved.
      properties:
        address: { type: string }
        user: { type: string }
        secret: { type: string, description: "Omit to keep the saved one." }
    MonitoringTools:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            type: object
            required: [id, secret_set]
            properties:
              id: { type: string, enum: [grafana, prometheus, loki, redis] }
              address: { type: string }
              user: { type: string }
              secret_set: { type: boolean }
    DatabaseRequest:
      type: object
      required: [driver]
      properties:
        driver: { type: string, enum: [sqlite, mysql, postgres] }
        host: { type: string }
        port: { type: integer }
        name: { type: string }
        user: { type: string }
        password: { type: string, description: "Omit to keep the saved one." }
        server_name: { type: string, description: "Name of this server in the history (empty: the machine's own). PUT only." }
    DatabaseView:
      type: object
      required: [driver, password_set]
      properties:
        driver: { type: string }
        host: { type: string }
        port: { type: integer }
        name: { type: string }
        user: { type: string }
        password_set: { type: boolean }
    DatabaseSettings:
      type: object
      required: [saved, active, restart_required, server_name, servers]
      properties:
        saved: { $ref: "#/components/schemas/DatabaseView" }
        active: { $ref: "#/components/schemas/DatabaseView" }
        restart_required: { type: boolean }
        server_name: { type: string }
        servers: { type: array, items: { type: string } }
    SoundTag:
      type: object
      required: [tag, score]
      properties:
        tag: { type: string }
        score: { type: number, description: "Cosine similarity with the sound (not a probability)." }
    LibraryPlaylist:
      type: object
      required: [id, name, songs]
      properties:
        id: { type: string, example: for-running, description: "Lowercase letters, digits and hyphens." }
        name: { type: string, maxLength: 80 }
        songs:
          type: array
          description: Song keys (`project/track/seed`) in order.
          items: { type: string }
    Fix:
      type: object
      required: [kind]
      description: How a finding is fixed. `trim` requires `seconds`, `reseed` requires `seed`, `motion_prompt` requires `motion_prompt` and `prompt` requires `prompt`.
      properties:
        kind: { type: string, enum: [trim, reseed, motion_prompt, prompt] }
        params: { type: object, additionalProperties: true }
    Review:
      type: object
      required: [id, project, state, total, done, created_at]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [analyzing, ready, failed] }
        model: { type: string, description: Vision model used; empty if it was only measured. }
        total: { type: integer, description: Clips being analysed. }
        done: { type: integer, description: Clips already analysed. }
        notes: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ReviewSummary:
      allOf:
        - { $ref: "#/components/schemas/Review" }
        - type: object
          properties:
            findings: { type: integer }
            pending: { type: integer }
    Finding:
      type: object
      required: [id, review_id, scene, kind, source, from_seconds, severity, description, has_frame, fix, status, created_at]
      properties:
        id: { type: string }
        review_id: { type: string }
        scene: { type: string }
        kind: { type: string, description: "deformation, color_drift, blur or observation (the user's own)." }
        source: { type: string, enum: [auto, manual] }
        from_seconds: { type: number }
        severity: { type: integer }
        description: { type: string }
        has_frame: { type: boolean }
        fix: { $ref: "#/components/schemas/Fix" }
        status: { type: string, enum: [pending, running, done, failed, skipped] }
        run_id: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
    Provider:
      type: object
      required: [id, name, type, base_url, text_model, vision_model, builtin, remote, key_set]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [ollama, openai] }
        base_url: { type: string }
        text_model: { type: string }
        vision_model: { type: string }
        builtin: { type: boolean }
        remote: { type: boolean }
        key_set: { type: boolean, description: "Whether a key is saved; the key is never returned." }
        blocked: { type: boolean, description: "`true` when this edition does not use the provider's address (another edition saved it): no task runs on it." }
    ProviderInput:
      type: object
      required: [name, type, base_url]
      properties:
        id: { type: string, description: "On create only; lowercase letters, digits and hyphens, up to 40. Without it, it is derived from the name." }
        name: { type: string, maxLength: 60 }
        type: { type: string, enum: [ollama, openai] }
        base_url: { type: string }
        text_model: { type: string, maxLength: 200 }
        vision_model: { type: string, maxLength: 200 }
        key: { type: string, description: "API key (up to 500 characters, no spaces). Absent: unchanged; empty: remove it." }
    Routing:
      type: object
      required: [routing, max_calls]
      properties:
        routing:
          type: object
          additionalProperties:
            type: object
            required: [provider, name, remote, consented, model]
            properties:
              provider: { type: string }
              name: { type: string }
              remote: { type: boolean }
              consented: { type: boolean }
              model: { type: string }
        max_calls: { type: integer }
    SettingsResponse:
      type: object
      description: The server settings in use. All the blocks always arrive.
      required: [ollama, heartmula, diffrhythm2, remote, browser, motion_model, music_motion]
      properties:
        ollama: { $ref: "#/components/schemas/OllamaSetting" }
        heartmula: { $ref: "#/components/schemas/MusicServiceSetting" }
        diffrhythm2: { $ref: "#/components/schemas/MusicServiceSetting" }
        remote:
          type: object
          description: Remote model provider.
          required: [max_calls]
          properties:
            max_calls: { type: integer, description: Cap on calls to a remote provider. }
        browser: { $ref: "#/components/schemas/BrowserSetting" }
        motion_model: { $ref: "#/components/schemas/MotionModelSetting" }
        music_motion:
          type: object
          description: "The settings of the music-motion pieces."
          required: [review_drafts]
          properties:
            review_drafts: { type: boolean, description: "When true every part draft is graded by the vision model of the `check` task after its previews are drawn (a request's own `review` wins). Off by default. Saved with `PUT /api/settings {music_motion: {review_drafts}}`." }
    OllamaSetting:
      type: object
      required: [host, source, remote, saved]
      properties:
        host: { type: string, description: The address in use. }
        source: { type: string, enum: [setting, env, default] }
        remote: { type: boolean, description: "`true` when the address is not this machine." }
        saved: { type: string, description: "The saved value, or empty." }
    MusicServiceSetting:
      type: object
      description: >-
        Optional external music service (HeartMuLa or DiffRhythm2). The token is never returned:
        it only says whether there is one.
      required: [saved, token_set, remote, consented]
      properties:
        saved: { type: string, description: "The saved address, or empty." }
        token_set: { type: boolean, description: A token is saved. }
        remote: { type: boolean, description: "`true` when the address is not this machine: the lyrics and tags leave this computer." }
        consented: { type: boolean, description: The person agreed to send them to that address (always `true` if it is this machine). }
    BrowserSetting:
      type: object
      description: The browser that draws the motion graphics.
      required: [saved, found]
      properties:
        saved: { type: string, description: "The saved path, or empty (it is looked up in the PATH)." }
        found: { type: boolean, description: There is a browser that can be used now. }
        path: { type: string }
        version: { type: string }
        error: { type: string, description: "Why none can be used, and how to fix it." }
    MotionModelSetting:
      type: object
      description: The model that writes the pages of the motion graphics.
      required: [saved, default]
      properties:
        saved: { type: string, description: "The saved model, or empty." }
        default: { type: string, description: The one used if none is saved. }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, validation_failed, not_found, conflict, forbidden, internal_error, method_not_allowed, unauthorized, engine_not_running, content_not_allowed, describe_refused, describe_minor, unavailable, assist_refused, consent_required, no_model, model_not_allowed, too_many_calls]
            message: { type: string }
            reason: { type: string }
            provider: { type: string, description: "Who refused the request (with `describe_refused`)." }
            alternatives:
              type: array
              description: "What it can be retried with (with `describe_refused`): other vision models of the same provider and other providers that have one."
              items:
                type: object
                required: [provider, name, model]
                properties:
                  provider: { type: string }
                  name: { type: string }
                  model: { type: string }
    GenerationRequest:
      type: object
      description: >-
        What is asked for. All fields are optional except that a `prompt` or a start image is needed.
        Without `option` the default is used; without `duration`, 5 s; without `aspect_ratio`, 16:9; without `quality`, `high`.
      properties:
        prompt: { type: string, description: "The text (up to 2000 characters). With a start image it describes the motion." }
        option: { type: string, description: "Identifier from `GET /api/generation/options`." }
        duration: { type: number, description: "Seconds of the scene (each option gives the range)." }
        aspect_ratio: { type: string, enum: ["16:9", "9:16", "1:1", "4:3", "3:4"] }
        quality: { type: string, enum: [draft, normal, high], description: "Scales the sides of the image and the clip: half, three quarters, full." }
        audio: { type: boolean, description: "Have the model write the sound (MiniMax H3 and LTX 2.3 only)." }
        adult: { type: boolean, description: "The label the client puts on the generation (like `adult` in a scenes.yaml). With `true` a server that hides adult content rejects it." }
        reuse_inputs_of: { type: string, description: "The identifier of another generation of the API whose input files (start image, end image, references) are used without sending them again. `422` if input parts are also sent, if it does not exist or if it kept none." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, its own (for example `video-studio`): 1 to 32 lowercase letters, digits or hyphens. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created. It is saved in the project's `scenes.yaml` and in the run, and is used to group in the statistics and the metrics." }
    Generation:
      type: object
      required: [id, state, progress, request, client, run_id, clip_seconds, created_at, size_bytes, inputs]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none or if it predates this field)." }
        state: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, description: "0 to 100." }
        request: { $ref: "#/components/schemas/GenerationRequest" }
        run_id: { type: string }
        clip_seconds: { type: number, description: "How long the clip the engine makes lasts; a longer duration repeats it." }
        estimate: { type: integer, description: "Seconds it takes on this machine." }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk (counted here and not in the per-project storage)." }
        video: { type: string, description: "The video's address, when done." }
        error: { type: string, description: "Why it failed." }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/GenerationInput" }
          description: "The files it used, in the order they were sent: the start image first and then the others. A generation that predates the inputs gives only its start image; with none, the list is empty."
    GenerationInput:
      type: object
      required: [kind, name, address]
      properties:
        kind: { type: string, enum: [start_image, end_image, reference_image, reference_video, reference_audio] }
        name: { type: string, description: "Its name in the generation project's `sources/`." }
        address: { type: string, description: "Read-only address it is downloaded from (a project artifact, with the same access as the video)." }
    MusicMotionCatalog:
      type: object
      required: [parts, characters, backgrounds, levels, styles, frame_rates, actions, fonts, font_stacks, font_files, modes, features]
      properties:
        parts: { type: array, items: { $ref: "#/components/schemas/MusicPart" } }
        characters: { type: array, items: { $ref: "#/components/schemas/MusicCharacter" } }
        backgrounds: { type: array, items: { $ref: "#/components/schemas/MusicBackground" } }
        levels: { type: array, items: { type: string }, description: "`simple`, `medium`, `advanced`." }
        styles: { type: array, items: { type: string }, description: "`typographic`, `illustrated`." }
        frame_rates: { type: array, items: { type: integer } }
        actions: { type: array, items: { type: string }, description: "A character's actions, in time with the beat." }
        fonts: { type: array, items: { type: string }, description: "The typefaces a design can use." }
        font_stacks: { type: object, additionalProperties: { type: string }, description: "The CSS font stack of each name in `fonts`, as the page of a piece sets it." }
        font_files:
          type: object
          description: "Which names in `fonts` are embedded in the pages as `data:` fonts: the six of the free pack (`inter`, `space-grotesk`, `jetbrains-mono`, `playfair-display`, `bebas-neue`, `fraunces`) and the old names that map to it (`grotesk` to Inter, `mono` to JetBrains Mono, `serif` to Fraunces, `heavy` to Bebas Neue; their old system stack stays as the fallback). `rounded` and `condensed` stay system stacks and are not here."
          additionalProperties:
            type: object
            properties:
              family: { type: string }
              weights: { type: array, items: { type: integer } }
              licence: { type: string, description: "`OFL-1.1` for the whole pack." }
        modes: { type: array, items: { type: string }, description: "`dark`, `light`." }
        features: { type: array, items: { type: string }, description: "What this server's scripts support beyond the base format: `animate` (keyframes on a parameter, see `MusicScriptPiece.animate`) and `layers` (lanes of parts over the pieces, see `MusicScript.layers`). A dashboard checks it before it saves a script that needs it. `svg` is not about scripts: it says `POST /api/assist/svg` exists. `review` says part drafts and pieces can be graded by the vision model (`review` on `POST /part-drafts` and `/scenes`, `POST /pieces/{id}/review`, the setting `music_motion.review_drafts`). `theme` says a design may carry `theme` and `transition_seconds`, the pack of fonts is embedded and the built-in `hud-chrome` and `grain` parts exist. `scene` says scenes written for the verses of a piece exist: `scene` on `POST /part-drafts`, `verse: own`/`hit: own` in a part's manifest, `POST /pieces/{id}/scenes` and `include=scene`/`piece=` on the catalog." }
    MusicSceneBatch:
      type: object
      required: [state, done, total, drafts, brief_mode, started_at]
      description: "The last batch of scenes written for the script of a piece (`POST /pieces/{id}/scenes`)."
      properties:
        state: { type: string, enum: [writing, done, cancelled, failed] }
        done: { type: integer, description: "Drafts finished (ready or failed) so far." }
        total: { type: integer }
        drafts:
          type: array
          items:
            type: object
            required: [script_piece, state]
            properties:
              script_piece: { type: string }
              draft_id: { type: string, description: "The part draft (`GET /part-drafts/{id}`, with its preview); empty while pending." }
              state: { type: string, enum: [pending, writing, ready, failed, approved], description: "The draft's own state; `approved` when the draft is gone because it became a part." }
              error: { type: string }
        model: { type: string }
        provider: { type: string }
        brief_mode: { type: string, enum: [metaphor, literal] }
        review:
          type: object
          description: "What every draft of the batch was asked to be reviewed with."
          properties:
            min: { type: integer }
            attempts: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    MusicPieceReview:
      type: object
      required: [state, started_at, scenes]
      description: "The last review of a whole piece (`POST /pieces/{id}/review`)."
      properties:
        state: { type: string, enum: [running, done, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        model: { type: string }
        scenes:
          type: array
          items:
            type: object
            required: [script_piece, score, notes]
            properties:
              script_piece: { type: string }
              score: { type: integer }
              verdict: { type: string, enum: [pass, weak, fail] }
              notes: { type: array, items: { type: string } }
              error: { type: string }
        overall:
          type: object
          description: "The piece as a whole, from a contact sheet of one frame per scene: whether type, palette and frame are consistent and whether scenes repeat a metaphor."
          properties:
            score: { type: integer }
            notes: { type: array, items: { type: string } }
            repeated: { type: array, items: { type: array, items: { type: string } }, description: "Groups of script pieces that use the same metaphor." }
            error: { type: string }
        error: { type: string }
    MusicPiecePreview:
      type: object
      required: [width, height, fps, scenes, replacements]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        scenes:
          type: array
          items:
            type: object
            required: [id, start, end, html, song]
            properties:
              id: { type: string }
              start: { type: number }
              end: { type: number }
              html: { type: string, description: "The page of the piece, wrapped for a sandboxed frame." }
              song: { type: object, description: "The song map cut to the piece, as the renderer gives it to the page." }
        replacements:
          type: array
          items:
            type: object
            required: [piece, from, to]
            properties:
              piece: { type: string }
              from: { type: string }
              to: { type: string }
    MusicLibraryCharacter:
      type: object
      required: [name, width, height, anchor, default_pose, default_expression, expressions, poses, source]
      properties:
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        anchor:
          type: object
          required: [x, y]
          properties: { x: { type: number }, y: { type: number } }
        default_pose: { type: string }
        default_expression: { type: string }
        expressions: { type: array, items: { type: string } }
        poses: { type: object, additionalProperties: { type: string }, description: "Pose name to its SVG." }
        source: { type: string, enum: [builtin, user] }
    MusicLibraryBackground:
      type: object
      required: [name, svg, source]
      properties:
        name: { type: string }
        svg: { type: string }
        source: { type: string, enum: [builtin, user] }
    MusicUserPart:
      type: object
      required: [name, source, manifest, fragment]
      description: "A part of the catalog as it is carried to another server or drawn in a browser."
      properties:
        name: { type: string }
        source: { type: string, enum: [user, builtin] }
        origin: { $ref: "#/components/schemas/MusicPartOrigin" }
        manifest: { type: object, description: "The content of manifest.json (name, description, version, levels, cost_ms, manual, params, and `verse`, `hit` and `scene` when it has them)." }
        fragment: { type: string, description: "The content of part.html." }
    MusicPart:
      type: object
      required: [name, description, levels, cost_ms, source, params]
      properties:
        name: { type: string }
        description: { type: string }
        levels: { type: array, items: { type: string } }
        cost_ms: { type: integer, description: "Milliseconds it costs to draw a frame at 1280x720 (measured)." }
        manual: { type: boolean, description: "Only used if the script names it (the fixed rule does not choose it)." }
        source: { type: string, enum: [builtin, user] }
        origin: { $ref: "#/components/schemas/MusicPartOrigin" }
        verse: { type: string, enum: [page, own], description: "Who draws the lyric when this is the main part of a piece: `page` (the default, also when absent) is the page's own layer, `own` is the part itself, which reads `window.__scene.lines`; the page then leaves `#verse` out." }
        hit: { type: string, enum: [page, own], description: "The same for the word hit (`#hit`/`#hitbg`). An extra part cannot declare `own` for either (`PUT /script` refuses it)." }
        scene:
          type: object
          description: "Set on a scene written for one script piece of one piece; such parts are listed only with `include=scene` or `piece=`, read back with `GET /parts/{name}`, deleted with their piece and refused as the part of a script piece of another piece (`422`)."
          properties:
            piece: { type: string }
            script_piece: { type: string }
        params: { type: array, items: { $ref: "#/components/schemas/MusicParam" } }
    MusicPartOrigin:
      type: object
      description: "Where a part of the user came from: the reference video that inspired it. Kept in `origin.json` beside the part when its draft is approved; absent for the parts that come with the program and for the ones written by hand."
      required: [approved_at]
      properties:
        reference_id: { type: string, description: "The reference of the library (it may have been deleted since)." }
        title: { type: string, description: "The title of the reference." }
        video: { type: string, description: "The address of the video." }
        frame: { type: string, description: "The key frame the draft was inspired by, when it was." }
        learned: { type: boolean, description: "True when a learning from a reference proposed the part." }
        learning_id: { type: string }
        approved_at: { type: string, format: date-time }
    MusicParam:
      type: object
      required: [name, type, default]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, int, number, bool, enum] }
        description: { type: string }
        default: { type: string, description: "The default value written as text (`3`, `true`, `allow`); `type` says how to read it." }
        min: { type: number }
        max: { type: number }
        max_length: { type: integer }
        options: { type: array, items: { type: string } }
        animatable: { type: boolean, description: "A script may change this parameter over a piece with `animate`. The part reads it on every frame; a parameter written into the page as text is never animatable." }
    MusicCharacter:
      type: object
      required: [name, description, poses, expressions, source]
      properties:
        name: { type: string }
        description: { type: string }
        poses: { type: array, items: { type: string } }
        expressions: { type: array, items: { type: string } }
        source: { type: string, enum: [builtin, user] }
    MusicBackground:
      type: object
      required: [name, description, source]
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [builtin, user] }
    MusicPieceRequest:
      type: object
      required: [project, track_id, variant]
      properties:
        project: { type: string, description: "The music project that has the song." }
        track_id: { type: string }
        variant: { type: integer, description: "The song's version (from 0)." }
        style: { type: string, enum: [typographic, illustrated] }
        level: { type: string, enum: [simple, medium, advanced] }
        fps: { type: integer, enum: [24, 30, 60] }
        resolution: { type: string, description: "For example `1280x720`." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request (as in `GenerationRequest`)." }
        design: { $ref: "#/components/schemas/MusicDesign" }
        preset: { type: string, description: "Identifier of a style (`/api/music-motion/presets`): the piece's design starts as the style's (that of `design`, if sent, takes precedence) and the fixed rule uses its parts and its rhythm. `422` if the style does not exist (nothing is created). Without `preset` the piece is made as usual." }
        prompt: { type: string, maxLength: 2000, description: "The person's direction for the video: it is kept with the piece and read by the proposals that send no prompt of their own. `422` above 2000 characters." }
        transcribe: { type: boolean, description: "Hear when each word is sung (Whisper, on the CPU) instead of distributing the lyrics across the sections; `false` by default. If it cannot be done (no Whisper, no memory, a run in progress) the piece is created anyway with estimated timings and `words_note` says why." }
    PartDraft:
      type: object
      required: [id, state, request, with_picture, attempts, problems, created_at, preview]
      properties:
        id: { type: string }
        state: { type: string, enum: [writing, ready, failed] }
        request: { type: string, description: "What the part has to do." }
        with_picture: { type: boolean, description: "Whether it was requested with an image." }
        source: { type: string, description: "Where the image came from: `upload` or `reference:<id>/<frame>`; absent without an image." }
        description: { type: string, description: "The look of the image, written by the vision model." }
        attempts: { type: integer, description: "Attempts the assistant made on this job (up to 3)." }
        name: { type: string, description: "The part's name, when it is `ready` (for a scene, decided by the server as soon as it starts)." }
        scene:
          type: object
          description: "Set on a draft asked for with `scene`."
          properties:
            piece: { type: string }
            script_piece: { type: string }
        brief: { type: string, description: "The idea the scene was asked for with." }
        review_ask:
          type: object
          description: "What the request asked of the review (absent: none); a retry keeps it."
          properties:
            min: { type: integer }
            attempts: { type: integer }
        review: { $ref: "#/components/schemas/PartDraftReview" }
        problems: { type: array, items: { type: string }, description: "What failed on the last attempt." }
        warnings: { type: array, items: { type: string }, description: "What the checks let pass but the person should know, on a `ready` draft: an `{{asset:name}}` slot the theme of the design has no drawing for (the slot is empty)." }
        error: { type: string, description: "Why it is `failed`." }
        created_at: { type: string, format: date-time }
        preview: { type: array, items: { type: string }, description: "Names of the preview frames." }
        manifest: { type: string, description: "The text of manifest.json (in the read of one)." }
        fragment: { type: string, description: "The text of part.html (in the read of one)." }
        origin: { type: string, enum: [learned], description: "`learned` when a learning from a reference proposed it; absent when it was asked for by hand." }
        learning_id: { type: string, description: "The learning that proposed it (with `origin` `learned`)." }
        model: { type: string, description: "The model the person chose to write it; absent when the routing's own was used. A retry keeps it." }
        provider: { type: string, description: "The saved provider the person chose to write it instead of the routing; absent when the routing's own was used. A retry keeps it." }
        replaces: { type: string, description: "The name of the part whose text the assistant is changing (a draft asked for with `request`, `manifest` and `fragment`); that name may be kept." }
        reference_id: { type: string, description: "The reference whose video inspired it (it may have been deleted since)." }
        video_title: { type: string, description: "The title of that reference." }
        video: { type: string, description: "The address of that video." }
    PartDraftReview:
      type: object
      description: "The grade of a draft by the vision model against the scene rubric (`docs/MUSIC_MODE_MOTION.md` prints it; the writer reads the same one). The score is worked out from a 0 to 2 score for each of six criteria, not taken from the model."
      properties:
        score: { type: integer, minimum: 0, maximum: 10 }
        verdict: { type: string, enum: [pass, weak, fail], description: "`pass` from 7, `weak` 5 and 6, `fail` under 5; absent when `error` is set." }
        notes: { type: array, maxItems: 5, items: { type: string, maxLength: 200 }, description: "Concrete fixes, up to five." }
        model: { type: string }
        attempts:
          type: array
          description: "Every version that was reviewed, in order, when the draft was rewritten from its review: the climb. The version left `ready` is the best one."
          items:
            type: object
            properties:
              score: { type: integer }
              verdict: { type: string }
              notes: { type: array, items: { type: string } }
        error: { type: string, description: "Why there is no grade (no vision model, it failed or answered nothing readable); the draft is still `ready`." }
    PartDraftRequest:
      type: object
      properties:
        request: { type: string, description: "Between 1 and 500 characters. Required, except with `scene` (then optional: it is the idea when there is no `scene.brief`)." }
        review:
          description: "Asks for the draft to be graded by the vision model of the `check` task after its previews are drawn: `true` (a review), `false` (none, even if the setting `music_motion.review_drafts` is on) or `{min, attempts}`: with `min` (1 to 10) a draft that scores under it is rewritten with the reviewer's notes as the problem, up to `attempts` times (2 by default, at most 3); the best version is left `ready`. A form field `review` (and `review_min`, `review_attempts`) in multipart. Without a vision model, a consent or a provider problem on the `check` route it is refused before anything is created (`503`, `400 consent_required`...); `422` for `min` or `attempts` out of range."
          oneOf:
            - { type: boolean }
            - type: object
              properties:
                min: { type: integer, minimum: 0, maximum: 10 }
                attempts: { type: integer, minimum: 0, maximum: 3 }
        scene:
          type: object
          required: [piece, script_piece]
          description: "Asks for a scene written for one script piece of one piece (JSON body only): the server builds the input from the saved piece."
          properties:
            piece: { type: string, description: "A music-motion piece id." }
            script_piece: { type: string, description: "The id of a script piece of that piece's script (ids are kept when the script is saved)." }
            brief: { type: string, maxLength: 500, description: "The idea or metaphor to draw; empty lets the writer choose." }
        reference_id: { type: string, description: "A reference from the library, to use one of its frames." }
        frame: { type: string, description: "One of that reference's `analysis.frames`." }
        manifest: { type: string, description: "With `fragment`, instead of `request`: makes the draft from these files with no assistant." }
        fragment: { type: string }
        model: { type: string, description: "An installed model (see `GET /api/assist/models`) that writes the part; `422` if it is not installed. Without it, the routing's own." }
        provider: { type: string, description: "The id of a saved provider (`GET /api/providers`) that writes the part instead of the routing, for this draft only; `model` then names one of its models. `400 consent_required` if it is remote and not consented, `400` if unknown." }
    PartDraftPut:
      type: object
      required: [manifest, fragment]
      properties:
        manifest: { type: string }
        fragment: { type: string }
    MotionColour:
      type: object
      required: [hex, share]
      properties:
        hex: { type: string, description: "Color as #rrggbb." }
        share: { type: number, description: "Share of the pixels it covers, 0 to 1." }
    MotionAnalysis:
      type: object
      required: [duration, fps, width, height, frames, colours, thirds, cuts, mean_shot]
      properties:
        duration: { type: number, description: "Seconds." }
        fps: { type: number }
        width: { type: integer }
        height: { type: integer }
        frames: { type: array, items: { type: string }, description: "Names of the key frames (between 12 and 24 when possible), in order." }
        colours: { type: array, items: { $ref: "#/components/schemas/MotionColour" }, description: "The five dominant colors of the whole video." }
        thirds: { type: array, items: { type: array, items: { $ref: "#/components/schemas/MotionColour" } }, description: "Those of each third of the video." }
        cuts: { type: integer, description: "Shot changes." }
        mean_shot: { type: number, description: "Mean duration of a shot, in seconds." }
        tempo: { type: number, description: "Estimated tempo of the audio (bpm); absent without sound or without a clear beat." }
        key: { type: string, description: "Estimated key of the audio; absent without sound or without a clear key." }
        description: { type: string, description: "The look of the video, written by the vision model; absent if there is no model." }
        description_note: { type: string, description: "Why there is no description." }
    MotionReference:
      type: object
      required: [id, title, tags, state, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
        source: { type: string, description: "The YouTube address; absent on an uploaded video." }
        state: { type: string, enum: [analysing, ready, failed] }
        error: { type: string, description: "The reason when `state` is `failed`." }
        created_at: { type: string, format: date-time }
        analysis: { $ref: "#/components/schemas/MotionAnalysis" }
    MotionReferenceRequest:
      type: object
      properties:
        url: { type: string, description: "Address of a YouTube video." }
        title: { type: string, description: "Up to 120 characters; by default the video's title." }
        notes: { type: string, description: "Up to 2000 characters." }
        tags: { type: array, items: { type: string }, description: "Up to 10 tags of up to 40 characters." }
    MotionReferencePatch:
      type: object
      properties:
        title: { type: string }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
    MotionPreset:
      type: object
      required: [id, name, created_at, design, rhythm, parts, adjustments]
      properties:
        id: { type: string }
        name: { type: string }
        reference_id: { type: string, description: "The reference it came from (it may no longer exist)." }
        created_at: { type: string, format: date-time }
        design: { $ref: "#/components/schemas/MusicDesign" }
        rhythm: { type: number, description: "How long a script piece lasts, in seconds (between 2 and 15)." }
        parts: { type: array, items: { type: string }, description: "Catalog parts that suit it; empty means all the usual ones." }
        adjustments: { type: array, items: { type: string }, description: "What had to be changed in the video's colors for the design to be valid." }
        origin: { type: string, enum: [learned], description: "`learned` when a learning from a reference kept it; absent when it was made by hand." }
    LearnRequest:
      type: object
      properties:
        strictness: { type: string, enum: [low, normal, high], description: "How far from what exists a proposal has to be to count as new. `normal` by default." }
    Learning:
      type: object
      required: [id, reference_id, state, strictness, created_at, styles, part_drafts, discarded, skipped]
      properties:
        id: { type: string }
        reference_id: { type: string }
        state: { type: string, enum: [running, ready, failed] }
        reason: { type: string, description: "Why it is `failed`." }
        strictness: { type: string, enum: [low, normal, high] }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        styles: { type: array, items: { $ref: "#/components/schemas/LearnedItem" }, description: "The styles it kept (they are in `GET /api/music-motion/presets`)." }
        part_drafts: { type: array, items: { $ref: "#/components/schemas/LearnedItem" }, description: "The drafts of parts it made (they are in `GET /api/music-motion/part-drafts` until approved)." }
        discarded: { type: array, items: { $ref: "#/components/schemas/LearnDiscarded" }, description: "What it did not make because it is too similar to what exists." }
        skipped: { type: array, items: { $ref: "#/components/schemas/LearnSkipped" }, description: "What it could not do and why (what is missing)." }
    LearnedItem:
      type: object
      required: [id, name, novel, state]
      properties:
        id: { type: string, description: "The id of the style or of the draft." }
        name: { type: string }
        novel: { type: boolean }
        similar_to: { $ref: "#/components/schemas/LearnSimilar" }
        state: { type: string, description: "`ready` for a style; the state of the draft (`writing`, `ready`, `failed`) for a part; `gone` when it no longer exists." }
        reason: { type: string, description: "Why a draft is `failed`." }
    LearnSimilar:
      type: object
      required: [kind, name, distance, reason]
      properties:
        kind: { type: string, enum: [style, part, draft], description: "A style, a part of the catalog or a draft." }
        id: { type: string }
        name: { type: string }
        distance: { type: number, description: "From 0 (the same) to 1 (nothing in common)." }
        reason: { type: string }
    LearnDiscarded:
      type: object
      required: [kind, name, novel, similar_to, reason]
      properties:
        kind: { type: string, enum: [style, part] }
        name: { type: string }
        idea: { type: string, description: "The sentence of a part idea." }
        novel: { type: boolean, description: "Always false here." }
        similar_to: { $ref: "#/components/schemas/LearnSimilar" }
        reason: { type: string }
    LearnSkipped:
      type: object
      required: [what, reason]
      properties:
        what: { type: string, description: "`style`, `parts` or `part <name>`." }
        reason: { type: string }
    MotionPresetRequest:
      type: object
      properties:
        reference_id: { type: string }
        name: { type: string, description: "By default, the reference's title." }
        provider: { type: string, description: "Changes, for this call only, the assistant provider that chooses the parts." }
        design: { $ref: "#/components/schemas/MusicDesign", description: "Without `reference_id`: the design of the style (validated as a whole design)." }
        rhythm: { type: number, description: "Without `reference_id`: how long a piece lasts, in seconds (2 to 15)." }
        parts: { type: array, items: { type: string }, description: "Without `reference_id`: catalog parts, without repeats, at most 8." }
    MotionPresetPut:
      type: object
      required: [name, design, rhythm, parts]
      properties:
        name: { type: string }
        design: { $ref: "#/components/schemas/MusicDesign" }
        rhythm: { type: number }
        parts: { type: array, items: { type: string } }
    MusicPiece:
      type: object
      required: [id, state, progress, source, style, level, fps, width, height, client, created_at, size_bytes]
      properties:
        id: { type: string }
        state: { type: string, enum: [draft, queued, running, done, failed] }
        progress: { type: integer, description: "0 to 100." }
        title: { type: string }
        source:
          type: object
          required: [project, track_id, variant]
          properties:
            project: { type: string }
            track_id: { type: string }
            variant: { type: integer }
        style: { type: string }
        level: { type: string }
        fps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        client: { type: string }
        created_at: { type: string, format: date-time }
        run_id: { type: string }
        estimate: { $ref: "#/components/schemas/MusicEstimate" }
        video: { type: string, description: "The video's address, when done." }
        error: { type: string }
        size_bytes: { type: integer, format: int64 }
        design: { $ref: "#/components/schemas/MusicDesignStored" }
        script: { $ref: "#/components/schemas/MusicScript" }
        preset: { type: string, description: "The style the piece started from, if it was made with one (later changes to the style do not touch it)." }
        script_source: { type: string, enum: [assistant, fallback, user] }
        prompt: { type: string, description: "The direction the proposals read when they send none." }
        proposal: { $ref: "#/components/schemas/MusicProposal" }
        scenes: { $ref: "#/components/schemas/MusicSceneBatch" }
        review: { $ref: "#/components/schemas/MusicPieceReview" }
        song_map: { $ref: "#/components/schemas/SongMap" }
        words_note: { type: string, description: "Why the words were not heard when they were requested (only in the response that causes it)." }
        script_warning: { type: string, description: "The user edited the script and it was kept, but it may need adjusting to the new sections (only in the `transcribe` response)." }
    MusicProposal:
      type: object
      required: [state, what, started_at]
      description: "The last proposal written in the background (`what: all` or `async: true`). One that was running when the server stopped reads as `failed`."
      properties:
        state: { type: string, enum: [waiting, writing, done, failed], description: "`waiting` while a run is queued or active and the assistant needs its memory (up to 15 minutes, then it falls back with the reason); `writing`; `done`; `failed`." }
        what: { type: string, enum: [design, script, all] }
        model: { type: string }
        provider: { type: string, description: "The provider asked for on the request; absent when the routing's own wrote." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        design_source: { type: string, enum: [assistant, fallback] }
        design_fallback_reason: { type: string }
        script_source: { type: string, enum: [assistant, fallback] }
        script_fallback_reason: { type: string }
        error: { type: string }
    MusicEstimate:
      type: object
      required: [seconds, estimate, frames, corrected, factor]
      properties:
        seconds: { type: number, description: "Forecast of how long the drawing takes on this machine." }
        estimate: { type: boolean, description: "Always `true`: it is a forecast, not a promise." }
        frames: { type: integer }
        corrected: { type: boolean, description: "Whether it was scaled with how long the previous drawings took." }
        factor: { type: number }
    MusicDesign:
      type: object
      required: [dark, light, accent, display, body, default_mode, concept]
      properties:
        dark: { type: string, description: "Dark hexadecimal color: the background of a dark section and the text of a light one." }
        light: { type: string, description: "Light hexadecimal color." }
        accent: { type: string, description: "Paints each verse's keyword; minimum 3:1 contrast with the background of the modes used." }
        display: { type: string, description: "Typeface of the large words (one of the catalog's `fonts`)." }
        body: { type: string }
        default_mode: { type: string, enum: [dark, light] }
        modes: { type: object, additionalProperties: { type: string, enum: [dark, light] }, description: "The mode of each section tag, in lowercase." }
        concept: { type: string, description: "The visual idea each scene returns to (up to 200 characters)." }
        verse_style: { type: string, enum: [plain, highlight, karaoke, glow], description: "How the verse is marked as it is sung: `plain` (the default and if missing: the words appear and the key one is in the accent color), `highlight` (the word being sung gets a background in the accent color and stays marked), `karaoke` (those already sung switch to the accent color) or `glow` (each word in the text color with a soft glow and a halo, no background)." }
        hit_style: { type: string, enum: [plain, metal, glow], description: "What the word hit looks like: `plain` (the default and if missing), `metal` (metallic letters with a shine that crosses them) or `glow` (letters in the accent color with light around them); in `metal` and `glow` the letters enter one after another." }
        theme:
          $ref: "#/components/schemas/MusicTheme"
        transition_seconds: { type: number, minimum: 0, maximum: 2, description: "The crossfade between the pieces of the script, in seconds (0, the default and if missing: hard cuts). A script piece may set its own (`MusicScriptPiece.transition_seconds`, the join into that piece). The video dissolves for that long on every join and each piece is drawn that long more, so the pieces still land on the song; the pages are not affected. Advice: 0 on a piece that lands on a word hit, 0.2 to 0.4 elsewhere." }
    MusicTheme:
      type: object
      description: "What a piece shares across its pages (`design.theme`, a server that has it lists `theme` in the catalog's `features`). It is injected in every page of the render and of the preview, so both draw the same."
      properties:
        css: { type: string, maxLength: 20480, description: "A stylesheet injected after the page's own one: it may restyle `#verse` and `#hit`, define the glow and the type scale and add `@font-face` from `data:` URLs. Refused with `422 design.theme.css: ...` when it has `@import`, a `url(` that is not `data:`, `expression(`, `behavior:`, `javascript:` or `<`." }
        assets:
          type: object
          maxProperties: 5
          additionalProperties: { type: string, maxLength: 51200 }
          description: "Small SVG drawings by name (`^[a-z][a-z0-9_]{0,31}$`; no script, foreignObject, event handler or outside reference). A part reads `window.__theme.assets[name]` or places one with the slot `{{asset:name}}` in its fragment (an unknown name leaves the slot empty and a draft warns of it)."
        hud:
          type: object
          description: "Four corner labels (up to 40 characters each) the `hud-chrome` part draws; a script piece's design override may replace them (`MusicDesignOverride.hud`)."
          properties:
            tl: { type: string, maxLength: 40 }
            tr: { type: string, maxLength: 40 }
            bl: { type: string, maxLength: 40 }
            br: { type: string, maxLength: 40 }
    MusicThemeHud:
      type: object
      properties:
        tl: { type: string, maxLength: 40 }
        tr: { type: string, maxLength: 40 }
        bl: { type: string, maxLength: 40 }
        br: { type: string, maxLength: 40 }
    MusicDesignStored:
      type: object
      required: [design, source, edited]
      properties:
        design: { $ref: "#/components/schemas/MusicDesign" }
        source: { type: string, enum: [assistant, fallback, user] }
        fallback_reason: { type: string, description: "Why the design is a fallback; absent otherwise." }
        edited: { type: boolean, description: "Whether the user set it: a new proposal does not overwrite it unless asked to." }
    MusicScript:
      type: object
      required: [version, pieces]
      properties:
        version: { type: integer, enum: [1] }
        pieces: { type: array, items: { $ref: "#/components/schemas/MusicScriptPiece" } }
        layers:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/MusicLayer" }
          description: |
            Lanes of parts drawn over the sequence of pieces, in this order (the last on top, over the parts of the pieces and under the verse and the word hit).
            Each item is drawn in the page of every piece its range touches, and is visible only between its `start` and `end`. A part reads its time as
            seconds from the item's `start`, so one that draws from `t` carries on across the cuts (the beat clock of a part is still the piece's own).
            Refused with `422`, naming the layer and the item, for a part that is not in the catalog, bad parameters, an empty range or one outside the song,
            items of one lane that overlap (they follow one another, in order), a repeated layer id, more than 4 layers or 32 items in a layer, and a piece whose
            page would draw the same part twice (as its main part, an extra or another item) or more than 8 parts. A script without `layers` is drawn as always.
    MusicLayer:
      type: object
      required: [id, items]
      properties:
        id: { type: string, description: "Lower case letters, digits and dashes, up to 24 characters; unique in the script." }
        items: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/MusicLayerItem" } }
    MusicLayerItem:
      type: object
      required: [part, start, end]
      properties:
        part: { type: string }
        params: { type: object, additionalProperties: true }
        start: { type: number, description: "Song seconds." }
        end: { type: number, description: "Song seconds, after `start` and not after the end of the song." }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
    MusicScriptPiece:
      type: object
      required: [id, start, end, part]
      properties:
        id: { type: string }
        start: { type: number }
        end: { type: number }
        section: { type: string }
        part: { type: string }
        params: { type: object, additionalProperties: true }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
        mode: { type: string, enum: [dark, light] }
        transition_seconds: { type: number, minimum: 0, maximum: 2, description: "The crossfade into this piece from the one before (0 is a cut); without it, the design's `transition_seconds`. Ignored on the first piece." }
        lines: { type: array, items: { $ref: "#/components/schemas/MusicScriptLine" } }
        hit: { $ref: "#/components/schemas/MusicScriptHit" }
        stage: { $ref: "#/components/schemas/MusicStage" }
        with:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/MusicPartRef" }
          description: "Extra parts drawn alongside the main one, on top and in this order (up to three, without repeating any part of the piece): for example a year bar that stays while the main screen changes."
        design: { $ref: "#/components/schemas/MusicDesignOverride" }
    MusicPartRef:
      type: object
      required: [part]
      properties:
        part: { type: string }
        params: { type: object, additionalProperties: true }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
    MusicKeyframe:
      type: object
      required: [t, value]
      properties:
        t: { type: number, description: "Seconds from the start of the piece." }
        value: { description: "A value the parameter accepts as a static one." }
        ease: { type: string, enum: [linear, in, out, in-out, step], default: linear, description: "How the value travels from this keyframe to the next." }
    MusicAnimate:
      type: object
      description: |
        Parameters that change over the piece: a parameter name (of a part whose manifest marks it `animatable`) to its keyframes, with `t` strictly
        increasing inside the piece. Between two keyframes a number is interpolated with the ease of the earlier one (`linear`; `in` and `out` are
        cubic; `in-out`; `step` holds), integer parameters are rounded; any value that is not a number is held until the next keyframe. Before the
        first keyframe and after the last the value is the nearest one. Refused with `422`, naming the piece and the parameter, for a parameter that
        is not animatable, no keyframe, `t` outside the piece or not increasing, an unknown ease, or a value outside the parameter's limits.
      additionalProperties: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MusicKeyframe" } }
    MusicDesignOverride:
      type: object
      description: "Design fields that this piece overrides for itself (another palette for an era). The result is validated as a whole design and, if it is not valid, the script is rejected naming the piece and the field. Without it, the piece uses the song's design."
      properties:
        dark: { type: string }
        light: { type: string }
        accent: { type: string }
        display: { type: string }
        body: { type: string }
        verse_style: { type: string, enum: [plain, highlight, karaoke, glow] }
        hit_style: { type: string, enum: [plain, metal, glow] }
        hud: { $ref: "#/components/schemas/MusicThemeHud", description: "Replaces the theme's HUD texts for this piece alone." }
    MusicScriptLine:
      type: object
      properties:
        line: { type: integer, description: "The verse number among the map's words; with it the text and timings come from the map." }
        text: { type: string }
        start: { type: number }
        end: { type: number }
        keyword: { type: string, description: "A word of the verse." }
    MusicScriptHit:
      type: object
      required: [word, at, length]
      properties:
        word: { type: string }
        at: { type: number, description: "Second of the song." }
        length: { type: number }
    MusicStage:
      type: object
      properties:
        background: { type: string }
        characters: { type: array, items: { $ref: "#/components/schemas/MusicStageCharacter" } }
    MusicStageCharacter:
      type: object
      required: [character, x, y, size]
      properties:
        character: { type: string }
        pose: { type: string }
        expression: { type: string }
        action: { type: string }
        x: { type: number, description: "Percentage of the frame width where the anchor goes." }
        y: { type: number, description: "Percentage of the height, counted from the top." }
        size: { type: number, description: "Character height as a percentage of the frame height." }
    SongMap:
      type: object
      required: [version, duration, bpm, beats, beat_base, grid_anchored, sections, words, loudness_hop, loudness]
      properties:
        version: { type: integer }
        audio_key: { type: string }
        duration: { type: number }
        bpm: { type: number }
        beats: { type: array, items: { type: number } }
        beat_base: { type: integer }
        grid_anchored: { type: boolean, description: "Whether it was found where the beat falls; if not, the grid starts at 0." }
        sections:
          type: array
          items:
            type: object
            required: [tag, start, end]
            properties:
              tag: { type: string }
              start: { type: number }
              end: { type: number }
        words:
          type: array
          items:
            type: object
            required: [text, start, end, line]
            properties:
              text: { type: string }
              start: { type: number }
              end: { type: number }
              line: { type: integer }
        words_estimated: { type: boolean, description: "The word timings were distributed across the sections instead of being heard." }
        loudness_hop: { type: number }
        loudness: { type: array, items: { type: number } }
    MusicProposeRequest:
      type: object
      required: [what]
      properties:
        what: { type: string, enum: [design, script, all], description: "`all` writes the design and then the script, from the same prompt and model, in the background (`202`)." }
        provider: { type: string, description: "The id of a saved provider (`GET /api/providers`) that writes this proposal instead of the `motion_graphics` routing, for this call only (the routing is not written); `model` then names a model of that provider. A remote one needs consent (`400 consent_required`, until `POST /api/providers/{id}/acknowledge`); an unknown one is `400` naming it. An asked-for provider that cannot be used is refused, never replaced by the fixed rule; one that is reachable at the start but fails while writing falls back with a `fallback_reason`." }
        prompt: { type: string, maxLength: 2000, description: "The person's direction for the video, free text: the assistant reads it for the design and for the script. It replaces the one kept with the piece; without it the kept one (if any) is used. `422` above 2000 characters." }
        model: { type: string, description: "An installed model of the assistant (`GET /api/assist/models`); `422` naming it when a local Ollama does not have it. Without it the routing decides." }
        async: { type: boolean, description: "Answer `202` and work in the background; `what: all` always does. Follow it in `proposal` of `GET /api/music-motion/pieces/{id}`." }
    MusicProposeAnswer:
      type: object
      required: [what, source]
      properties:
        what: { type: string, enum: [design, script] }
        source: { type: string, enum: [assistant, fallback] }
        fallback_reason: { type: string, description: "Why the fixed rule wrote it (present only when `source` is `fallback`): there is no assistant, a run holds the memory, the assistant failed, its last answer was refused, or the wait timed out. It says that the fixed rule does not read the prompt when one was sent." }
        model: { type: string, description: "The model that wrote it, or the one asked for when it failed." }
        provider: { type: string, description: "The provider asked for on the request; absent when the routing's own wrote." }
        design: { $ref: "#/components/schemas/MusicDesignStored" }
        script: { $ref: "#/components/schemas/MusicScript" }
        replacements:
          type: array
          items:
            type: object
            required: [piece, from, to]
            properties:
              piece: { type: string }
              from: { type: string }
              to: { type: string }
    MusicRenderAnswer:
      type: object
      required: [run_id, estimate]
      properties:
        run_id: { type: string }
        estimate: { $ref: "#/components/schemas/MusicEstimate" }
    DurationRange:
      type: object
      required: [min, max, default]
      properties:
        min: { type: number }
        max: { type: number }
        default: { type: number }
    VideoOption:
      type: object
      required: [id, name, description, engine, available, clip_seconds, duration, audio, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        engine: { type: string, enum: [wan, animatediff, minimax-h3, ltx-2.3] }
        available: { type: boolean }
        reason: { type: string, description: "What is missing or why it does not fit, when it is not available." }
        clip_seconds: { type: number }
        duration: { $ref: "#/components/schemas/DurationRange" }
        audio: { type: boolean, description: "Whether the engine can write the sound." }
        estimate: { type: integer, description: "Seconds of a generation at the best quality, 16:9 and with no start image." }
        default: { type: boolean }
        inputs: { $ref: "#/components/schemas/GenerationInputs" }
    GenerationInputs:
      type: object
      required: [start_image, end_image]
      description: "What the option accepts besides the text, with its limits. What is absent is not accepted. The reference limits are those measured for the memory of the card the server would use."
      properties:
        start_image: { type: boolean, description: "Accepts the start image (`image`)." }
        end_image: { type: boolean, description: "Accepts an end image (`end_image`): MiniMax H3 with its first-and-last-frame package, and LTX 2.3." }
        reference_images: { $ref: "#/components/schemas/InputLimit" }
        reference_videos: { $ref: "#/components/schemas/InputLimit" }
        reference_audios: { $ref: "#/components/schemas/InputLimit" }
    InputLimit:
      type: object
      required: [max]
      properties:
        min: { type: integer, description: "Minimum (reference images require at least one)." }
        max: { type: integer }
        max_seconds: { type: number, description: "Maximum duration of each video or audio." }
    ImageModel:
      type: object
      required: [id, name, description, kind, available, strength, negative_prompt, max_variants, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [img2img, instruction], description: "`img2img` starts from the image with a strength; `instruction` is an editing model that changes the image according to the text." }
        available: { type: boolean }
        reason: { type: string }
        strength: { type: boolean, description: "Whether it accepts `strength`." }
        negative_prompt: { type: boolean, description: "Whether it accepts `negative_prompt`." }
        max_variants: { type: integer }
        default: { type: boolean }
    GenerationOptions:
      type: object
      required: [video, image_models, aspect_ratios, qualities]
      properties:
        video:
          type: array
          items: { $ref: "#/components/schemas/VideoOption" }
        image_models:
          type: array
          items: { $ref: "#/components/schemas/ImageModel" }
        aspect_ratios:
          type: array
          items: { type: string }
        qualities:
          type: array
          items: { type: string }
    ImageEditRequest:
      type: object
      description: "`prompt` is required; without `model` the default from `GET /api/generation/options` is used; without `variants`, 1."
      properties:
        model: { type: string, description: "Identifier from `image_models`." }
        prompt: { type: string }
        negative_prompt: { type: string, description: "Only `img2img` models take it." }
        strength: { type: number, description: "How far it departs from the image, greater than 0 and at most 1; only `img2img` models take it." }
        variants: { type: integer, description: "From 1 to the model's `max_variants`." }
        adult: { type: boolean, description: "The label the client puts on the retouch." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, its own (for example `video-studio`): 1 to 32 lowercase letters, digits or hyphens. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created. It is saved in the project's `scenes.yaml` and in the run, and is used to group in the statistics and the metrics." }
    ImageEditResult:
      type: object
      required: [variant, seed, image]
      properties:
        variant: { type: integer, description: "From 1." }
        seed: { type: integer, format: int64 }
        image: { type: string, description: "Address of the image." }
    ImageEdit:
      type: object
      required: [id, state, progress, request, client, run_id, created_at, size_bytes]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none or if it predates this field)." }
        state: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer }
        request: { $ref: "#/components/schemas/ImageEditRequest" }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk." }
        results:
          type: array
          items: { $ref: "#/components/schemas/ImageEditResult" }
        error: { type: string }
    VideoEditSetting:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [choice, number, integer, boolean, string, color] }
        values: { type: array, items: {}, description: "The accepted values when `kind` is `choice`." }
        min: { type: number }
        max: { type: number }
        default: { description: "The value used if it is not sent." }
        required: { type: boolean, description: "It must be sent and cannot be blank." }
        description: { type: string }
    VideoEditTool:
      type: object
      required: [id, name, description, available, needs_image, settings]
      properties:
        id: { type: string, enum: [scale, interpolate, reframe, remove-background, depth, extend, motion-control] }
        name: { type: string }
        description: { type: string }
        available: { type: boolean }
        reason: { type: string, description: "Why it is not available (only with `available: false`): a file, a binary, the vision service or card memory is missing." }
        needs_image: { type: boolean, description: "Whether it needs a reference image." }
        accepts_motion: { type: boolean, description: "Whether it can take a motion from the library instead of a video (`motion-control`)." }
        notes: { type: array, items: { type: string }, description: "Limits the client should show (for example «human silhouettes only», «33 frames», «quality drops with each extension»)." }
        settings:
          type: array
          items: { $ref: "#/components/schemas/VideoEditSetting" }
    VideoEditOptions:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/VideoEditTool" }
    VideoEditRequest:
      type: object
      required: [tool]
      description: >-
        `settings` carries the tool's settings, with the names from `GET /api/video-edits/options`:
        `scale` {factor: 2|4, engine: fast|quality}; `interpolate` {fps: 24|30|60}; `reframe` {aspect_ratio: 16:9|9:16|1:1|4:5,
        mode: crop|pad, color}; `remove-background` {background (color, default #00ff00), alpha}; `depth` with no settings;
        `extend` {seconds: 2 to 10, prompt (required), engine: minimax-h3|ltx}; `motion-control` {prompt, strength: 0.2 to 1 (default 0.6), guidance: 1 to 10 (default 6; lower burns the highlights less but follows the prompt less),
        start (seconds, default 0, only with `motion`)}.
      properties:
        tool: { type: string, enum: [scale, interpolate, reframe, remove-background, depth, extend, motion-control] }
        settings: { type: object, additionalProperties: true }
        motion: { type: string, description: "`motion-control` only: the identifier of a `ready` motion from the library, instead of the `video` part." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, as in `POST /api/generations`. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created." }
    VideoEditResult:
      type: object
      required: [video, format, has_audio]
      properties:
        video: { type: string, description: "The video's address (a read-only artifact)." }
        format: { type: string, enum: [mp4, webm], description: "MP4 (H.264, yuv420p), or WebM with alpha in `remove-background` with `alpha`." }
        has_audio: { type: boolean, description: "The original's sound is kept in `scale`, `reframe` and `remove-background`; not in the other tools." }
        width: { type: integer }
        height: { type: integer }
        fps: { type: number }
        duration: { type: number, description: "Seconds." }
        engine: { type: string, description: "What it was made with, when there are alternatives (`fast`/`quality`, the interpolation network or the fallback filter)." }
        notes: { type: array, items: { type: string }, description: "Run warnings, for example that the fallback filter was used or that nobody was found." }
        extended_times: { type: integer, description: "`extend` only: how many times the video has been extended since its original." }
    VideoEdit:
      type: object
      required: [id, tool, state, progress, request, client, run_id, created_at, size_bytes]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none)." }
        tool: { type: string }
        state: { type: string, enum: [queued, running, done, failed, cancelled] }
        progress: { type: integer }
        request: { $ref: "#/components/schemas/VideoEditRequest" }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk." }
        result: { $ref: "#/components/schemas/VideoEditResult" }
        error: { type: string }
    MotionRequest:
      type: object
      description: "All fields are optional; the `video` or `source` part is required."
      properties:
        title: { type: string }
        tags: { type: array, items: { type: string } }
        source: { type: string, description: "The address of a video the server can already read, instead of the `video` part." }
    Motion:
      type: object
      required: [id, title, tags, duration, people, state, preview]
      properties:
        id: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        duration: { type: number, description: "Seconds, at most 30." }
        people: { type: integer }
        state: { type: string, enum: [processing, ready, failed] }
        preview: { type: string, description: "Address of the preview (`GET /api/motions/{id}/preview`)." }
        source: { type: string, description: "The YouTube address the video was taken from; absent when it was uploaded as a file. The video itself is never kept." }
        error: { type: string }
    PhaseDuration:
      type: object
      required: [phase, model, resolution, gpu, executions, min_executions, enough, period_days]
      properties:
        phase: { type: string, enum: [render, animate] }
        model: { type: string }
        resolution: { type: string }
        gpu: { type: string }
        steps: { type: integer }
        frames: { type: integer }
        executions: { type: integer, description: "Executions that meet all of the above." }
        min_executions: { type: integer, description: "How many are needed to trust the history." }
        enough: { type: boolean }
        median_seconds: { type: number, description: "Only with enough history." }
        p95_seconds: { type: number, description: "Only with enough history." }
        period_days: { type: integer, description: "How many days back the history counts." }
    EstimateRequest:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string, description: "The scenes.yaml to estimate (a draft or a project's)." }
        project: { type: string, description: "A server project whose cache is read: what it will reuse adds nothing." }
        gpu: { type: string, description: "Index of the card; without it, the one the server would choose." }
    Estimate:
      type: object
      required: [seconds, source, history_phases, table_phases, cached_phases]
      properties:
        seconds: { type: integer }
        source: { type: string, enum: [history, table, mixed], description: "Where the figure for the image and animation phases comes from." }
        executions: { type: integer, description: "The executions of the history figure that has the fewest; only if there is a history part." }
        history_phases: { type: integer, description: "Parts whose time comes from this machine's history: each image or animation phase and, as one more, the rest (narration, clip and join) when there is history for both." }
        table_phases: { type: integer, description: "Parts whose time comes from the table." }
        cached_phases: { type: integer, description: "Phases the cache will reuse that add nothing." }
        gpu: { type: string, description: "The card the calculation was made with." }
    ProjectSummary:
      type: object
      required: [id, name, mode, scene_count, client]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [video, images, music, ""], description: "Empty when the project cannot be read (`invalid`); in that case `name` is also empty and `scene_count` is 0." }
        scene_count: { type: integer, description: "Scenes of the project; 0 for a music one and for one that cannot be read." }
        track_count: { type: integer, description: Number of tracks of a music project. }
        adult: { type: boolean, description: "Project label: `true` for over-18s, `false` reviewed and suitable for everyone; absent, not reviewed." }
        invalid: { type: boolean }
        error: { type: string }
        client: { type: string, description: "Who made the project: its `client:` (a client name), `embedded` (a normal project without it) or `unknown` (a generation API one without it)." }
        kind: { type: string, enum: [generation, image_edit, video_edit], description: "Only on a generation API project (with `managed=include`)." }
    Run:
      type: object
      description: A run from the history.
      required: [id, project, state, gpu, keep_tmp, force, vram_warn_mb, created_at, result_available]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted] }
        result_available: { type: boolean, description: "`false` when the run's project or its files no longer exist: the run stays in the history and the statistics, but there is no result to link to." }
        server: { type: string, description: "The server that made the run, for a history that several share (empty if not recorded)." }
        gpu: { type: string, description: "Card or cards requested (empty: the one the server chooses)." }
        keep_tmp: { type: boolean }
        force: { type: boolean }
        only: { type: string, description: "Scene the run was limited to." }
        vram_warn_mb: { type: integer }
        overlap: { type: integer, description: "Lookahead scenes requested (only appears if greater than 0)." }
        mode: { type: string, description: "Output mode requested for this run; empty: the project's." }
        client: { type: string, description: "The dashboard that requested the run through the generation API (copied from its project's `scenes.yaml`); empty in normal projects and in anything predating the field." }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        artifact: { type: string }
        error: { type: string }
    Download:
      type: object
      required: [id, state, kind, name, files, source, bytes, created_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        kind: { type: string }
        name: { type: string }
        files: { type: array, items: { type: string } }
        source: { type: string }
        bytes: { type: integer }
        total: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ContainerState:
      type: object
      description: Lifecycle of a music generator's local service (the field is called `container` for compatibility).
      required: [state]
      properties:
        state: { type: string, enum: [stopped, starting, running] }
        gpu: { type: integer, description: Card it runs on. }
        port: { type: integer, description: Port on 127.0.0.1 where the service is published. }
        since: { type: string, description: "When it started (RFC 3339)." }
        memory_mb: { type: integer, description: "RAM it uses (only with ?stats=1)." }
        error: { type: string, description: "Why the last start failed." }
    BinaryStatus:
      type: object
      required: [name, required, present]
      properties:
        name: { type: string }
        required: { type: boolean, description: "Without it some mode cannot run (optional ones, like the music engine, do not require it)." }
        present: { type: boolean }
        path: { type: string }
        version: { type: string }
        fix: { type: string, description: "How to install it, if missing (or why it is no good: Blender too old)." }
        devices: { type: array, items: { type: string }, description: "Devices it renders on, if it has several (Blender: those of Cycles, e.g. \"OPTIX NVIDIA GeForce RTX 4070\")." }
    AssetEntry:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer, format: int64, description: "Bytes (the sum of its files, for an adapter folder)." }
        speakers:
          type: array
          description: The speakers of a Piper voice that has several (omitted on the usual single-speaker one).
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
    GpuStatus:
      type: object
      required: [index, name, free_vram_mb]
      properties:
        index: { type: integer }
        name: { type: string }
        free_vram_mb: { type: integer }
        total_vram_mb: { type: integer, description: The card's memory. }
        ollama_mb: { type: integer, description: What an Ollama process holds on this GPU. }
        speed_factor: { type: number, description: "How many times slower than the reference machine (an RTX 5060 Ti) it has been in its runs; below 1 it is faster. Appears when there are enough samples." }
        speed_samples: { type: integer }
        low_vram: { type: boolean, description: Little free memory is left for a render. }
        warnings: { type: array, items: { type: string } }
    ModelsDirectory:
      type: object
      description: "Only if the server has a models folder (`--models-dir`, `MODELS_DIR` or `~/.config/mediaorquestator/models-dir`). The repository's `models/` is a link to it, so models are installed and read there. If the disk is not mounted `available` is false and nothing is installed (nothing is written to the local disk); it is not the same as having no models."
      required: [dir, available, linked]
      properties:
        dir: { type: string, description: "Absolute path of the models folder, as the server sees it." }
        available: { type: boolean, description: The folder exists and is writable. }
        linked: { type: boolean, description: "The repository's `models/` leads to this folder. If false and `available` is true, `orchestrator models migrate` needs to be run." }
        reason: { type: string, description: "Why it is not available, or what is missing." }
        disk: { $ref: "#/components/schemas/DiskReport" }
    DiskReport:
      type: object
      required: [free_bytes, total_bytes, warn_below_bytes, low]
      properties:
        free_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        warn_below_bytes: { type: integer, format: int64 }
        low: { type: boolean }
    EngineAvailability:
      type: object
      description: Whether an optional music engine (HeartMuLa, DiffRhythm2) can be used now and, if not, why.
      required: [available]
      properties:
        available: { type: boolean }
        mode: { type: string, enum: [local, external] }
        reason: { type: string }
        detail: { type: string }
        missing: { type: array, items: { type: string } }
        version: { type: string }
        container: { $ref: "#/components/schemas/ContainerState" }
    EnvironmentReport:
      type: object
      required: [edition, content_mode, binaries, models, retouch, voices, loras, music, music_adapters, transcription, dictation, gpus, ollama, tokens, token_sources]
      properties:
        edition: { type: string, enum: [private, public] }
        content_mode: { type: string, enum: [censored, strict, all] }
        models_dir: { $ref: "#/components/schemas/ModelsDirectory" }
        binaries: { type: array, items: { $ref: "#/components/schemas/BinaryStatus" } }
        models: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The image models. }
        retouch: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The files used only by the retouch models. }
        voices: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        loras: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        music: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        music_adapters: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        transcription: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The Whisper models. }
        dictation:
          type: object
          description: Whether a spoken request can be transcribed here and, if not, why.
          required: [available]
          properties:
            available: { type: boolean }
            reason: { type: string }
        gpus: { type: array, items: { $ref: "#/components/schemas/GpuStatus" } }
        gpu_error: { type: string }
        ollama:
          type: object
          required: [host, source, remote]
          properties:
            host: { type: string }
            source: { type: string, enum: [setting, env, default] }
            remote: { type: boolean }
        tokens:
          type: object
          description: Whether there is a download key per service (never the value).
          required: [huggingface, civitai]
          properties:
            huggingface: { type: boolean }
            civitai: { type: boolean }
        token_sources:
          type: object
          description: Where the key in use comes from; the service does not appear if it has none.
          properties:
            huggingface: { type: string, enum: [env, file] }
            civitai: { type: string, enum: [env, file] }
        disk: { $ref: "#/components/schemas/DiskReport" }
        ram:
          type: object
          required: [total_bytes, available_bytes]
          properties:
            total_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
        heartmula: { $ref: "#/components/schemas/EngineAvailability" }
        diffrhythm2: { $ref: "#/components/schemas/EngineAvailability" }
    StatsGroup:
      type: object
      required: [name, runs, seconds]
      properties:
        name: { type: string, description: "The project id, the GPU index or the type; empty in runs with no fixed GPU or of a project that no longer exists." }
        runs: { type: integer }
        seconds: { type: number }
        success_rate: { type: number }
        peak_vram_pct: { type: number, description: "GPU rows only." }
        mean_peak_vram_pct: { type: number }
        sampled_runs: { type: integer }
    StatsRunPoint:
      type: object
      required: [id, project, state, created_at, seconds, result_available]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted] }
        created_at: { type: string }
        seconds: { type: number }
        mode: { type: string, enum: [video, images, music], description: "Absent if the project no longer exists." }
        result_available: { type: boolean }
    StatsResult:
      type: object
      required: [period, totals, duration, by_day, phases, cache, by_project, by_gpu, by_mode, by_client, run_durations, slowest]
      properties:
        period:
          type: object
          required: [since, until]
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        project: { type: string, description: "The filter they were computed with, if any." }
        mode: { type: string }
        totals:
          type: object
          required: [runs, by_state, total_seconds]
          properties:
            runs: { type: integer }
            by_state: { type: object, additionalProperties: { type: integer } }
            success_rate: { type: number, description: Successfully finished out of finished. }
            total_seconds: { type: number }
            queue_wait_mean_seconds: { type: number }
        duration:
          type: object
          required: [runs, total_seconds]
          properties:
            runs: { type: integer, description: The successful runs that have a duration. }
            mean_seconds: { type: number }
            median_seconds: { type: number }
            p95_seconds: { type: number }
            total_seconds: { type: number }
        by_day:
          type: array
          items:
            type: object
            required: [date, succeeded, failed, other, seconds]
            properties:
              date: { type: string }
              succeeded: { type: integer }
              failed: { type: integer }
              other: { type: integer }
              seconds: { type: number }
        phases:
          type: array
          items:
            type: object
            required: [phase, executions, reused, total_seconds]
            properties:
              phase: { type: string }
              executions: { type: integer }
              reused: { type: integer }
              total_seconds: { type: number }
              mean_seconds: { type: number }
              p95_seconds: { type: number }
        cache:
          type: object
          required: [executed, reused]
          properties:
            executed: { type: integer }
            reused: { type: integer }
            reuse_share: { type: number }
        by_project: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_gpu: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_mode: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_client: { type: array, items: { $ref: "#/components/schemas/StatsGroup" }, description: "One group per requester of the runs: the name of each generation API dashboard, `unknown` (unnamed or predating the field) and `embedded` (the normal projects)." }
        run_durations: { type: array, items: { $ref: "#/components/schemas/StatsRunPoint" } }
        slowest: { type: array, items: { $ref: "#/components/schemas/StatsRunPoint" } }
    ResourcePoint:
      type: object
      required: [t_ms, used_mb]
      properties:
        t_ms: { type: integer, format: int64, description: Milliseconds since the start of the run. }
        used_mb: { type: integer }
        util_pct: { type: integer, description: GPU utilization; RAM does not carry it. }
    RunResources:
      type: object
      required: [interval_ms, truncated, gpus, ram, peaks]
      properties:
        interval_ms: { type: integer, format: int64 }
        truncated: { type: boolean, description: There were more samples than are returned. }
        gpus:
          type: array
          items:
            type: object
            required: [index, total_mb, samples]
            properties:
              index: { type: integer }
              total_mb: { type: integer }
              samples: { type: array, items: { $ref: "#/components/schemas/ResourcePoint" } }
        ram:
          type: object
          required: [total_mb, samples]
          properties:
            total_mb: { type: integer }
            samples: { type: array, items: { $ref: "#/components/schemas/ResourcePoint" } }
        peaks:
          type: object
          required: [vram, ram]
          properties:
            vram:
              type: array
              items:
                type: object
                required: [gpu, mb, pct]
                properties:
                  gpu: { type: integer }
                  mb: { type: integer }
                  pct: { type: number }
            ram:
              type: object
              nullable: true
              required: [mb, pct]
              properties:
                mb: { type: integer }
                pct: { type: number }
  responses:
    CreatedId:
      description: Created.
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string }
    BadRequest:
      description: Malformed request (`invalid_request`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: The token is missing or invalid (`unauthorized`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Does not exist (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with the current state (`conflict`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Fails validation (`validation_failed`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
