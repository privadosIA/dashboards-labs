  /api/music-motion/pieces/{id}/review:
    post:
      tags: [Music motion]
      summary: Grades the whole piece with the vision model, scene by scene and as a whole
      description: >-
        In the background (`202`): for each script piece three frames of its page (near the start, at its first word, near the end) are
        graded against the scene rubric by the vision model of the `check` task, then one frame of each scene is tiled into a contact sheet
        and graded for consistency of type, palette and frame and for scenes that repeat a metaphor. Read it on the piece as `review`
        (`state` `running`, then `done` or `failed`). `409` while a proposal, a render, a batch of scenes or another review of this piece
        runs, or a run holds the memory a local vision model needs; `422` without a script; `503` without Chrome or a vision model. A server with
        it lists `review` in the `features` of `GET /api/music-motion/catalog`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The review has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPieceReview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "Chrome or the vision model is missing." }

  /api/music-motion/pieces/{id}/scenes:
    post:
      tags: [Music motion]
      summary: Writes a scene for every script piece, in the background
      description: >-
        One draft per script piece (or the ones in `script_pieces`), written one after the other with the same engine as
        `POST /part-drafts` with `scene` (so each has its previews and problems) and reported in the piece's `scenes`
        (`done` rises to `total`). `brief_mode` is `metaphor` (the default: the writer chooses the visual metaphor for what each verse
        means) or `literal` (it draws what the words say). `model`/`provider` as in the drafts. Nothing is approved: each draft is
        approved like any draft, or all at once with `POST /scenes/approve`. `202` with the batch. `409` while a proposal, a render
        or another batch of this piece runs, or a run holds the memory a local model needs; `422` without a script; `404` for a
        `script_pieces` id that is not in the script; `503` without Chrome or assistant. Listed as `scene` in the catalog's `features`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                script_pieces: { type: array, items: { type: string }, description: "Script piece ids; empty writes every piece." }
                only: { type: string, enum: [failed], description: "`failed` writes again just the script pieces that kept their earlier scene because no answer passed the checks (in the last batch or in an earlier one that this piece's batches did not write again), the ones in `script_pieces` among them when it is given. `422` when none kept one." }
                brief_mode: { type: string, enum: [metaphor, literal], default: metaphor }
                model: { type: string }
                provider: { type: string }
                review: { description: "As `review` in `POST /part-drafts`, passed to every draft of the batch.", oneOf: [{ type: boolean }, { type: object, properties: { min: { type: integer }, attempts: { type: integer } } }] }
      responses:
        "202":
          description: The batch has started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSceneBatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "Chrome or the assistant is missing." }
    delete:
      tags: [Music motion]
      summary: Stops the batch after the draft it is writing
      description: Answers `202` with the batch (`cancelled` once the current draft is finished); `404` when the piece has no batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: The batch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicSceneBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/music-motion/pieces/{id}/scenes/approve:
    post:
      tags: [Music motion]
      summary: Approves every ready scene of the batch and puts it in the script
      description: >-
        Each `ready` draft of the batch is approved (it becomes a scene part, `scene-<short>-<n>`) and becomes the `part` of its script
        piece (its `params` and `animate` are cleared); the script is validated and saved as `PUT /script` does. Answers `200` with
        `approved` (script piece, part, draft), `not_approved` (the drafts that were not ready or failed the checks, with their state and
        reason; their script pieces keep their parts) and the saved `script`. `422` naming the script piece when the script changed since the
        batch started (a script piece is not the one its scene was written for, or is gone); `409` while the batch is still writing;
        `404` without a batch.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: What was approved.
          content:
            application/json:
              schema:
                type: object
                required: [approved, not_approved, script]
                properties:
                  approved:
                    type: array
                    items:
                      type: object
                      properties:
                        script_piece: { type: string }
                        part: { type: string }
                        draft_id: { type: string }
                  not_approved:
                    type: array
                    items:
                      type: object
                      properties:
                        script_piece: { type: string }
                        draft_id: { type: string }
                        state: { type: string }
                        error: { type: string }
                  script: { $ref: "#/components/schemas/MusicScript" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/propose:
    post:
      tags: [Music motion]
      summary: Asks the assistant for a new design or script
      description: >-
        With `what: design` it proposes a design from the style and the lyrics; with `what: script`, a script from the
        song map, the design, the level and the catalog. The assistant's answer is validated and, if it is not valid, it is
        asked again with the reason, up to 3 times; without an assistant, or if all 3 fail, the result comes from a fixed
        rule and `source` is `fallback` (it is not an error). Parts the level does not support are replaced by
        simpler ones and are reported in `replacements`. What is proposed is saved and replaces what was there.
        Every `fallback` carries its `fallback_reason`, and the answer names the `model`. `what: all`, and any proposal with
        `async: true`, answers `202` with the state and works in the background: read `proposal` in the piece until it is `done`
        or `failed`; while a run is queued or active it is `waiting` instead of falling back at once. A synchronous proposal
        falls back at once when a run holds the memory. The fixed rule does not read the `prompt`. `409` while another
        proposal of the piece is being written, and for an edit of the piece meanwhile.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicProposeRequest" }
      responses:
        "200":
          description: What was proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicProposeAnswer" }
        "202":
          description: Accepted; it is written in the background (`proposal` in the piece).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicProposal" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/music-motion/pieces/{id}/render:
    post:
      tags: [Music motion]
      summary: Draws the piece
      description: >-
        Validates the script, writes the piece's project (one scene per script piece, with its page and its song
        map, and the song as the soundtrack), launches its run on the usual queue and answers `202` with the
        run identifier and the time forecast. Scenes whose piece has not changed come from the cache. `409`
        if it is already being drawn; `503` if there is no Chrome or Chromium.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Drawing started.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicRenderAnswer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: There is no browser to draw with (`unavailable`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/music-motion/pieces/{id}/transcribe:
    post:
      tags: [Music motion]
      summary: Hears when each word of the piece's song is sung
      description: >-
        Reads the song with Whisper word by word (on the CPU: about a third of the song's duration; the time of each word is the one Whisper
        computes for its tokens, with the confidence it has in it) and rebuilds the song map: each word of the written lyrics carries the time
        at which it is heard (the lyrics do not change: what is heard only sets the times; a word that Whisper hears differently or does not
        hear takes a time between its neighbours, inside the time where the voice is heard when the voice was separated), the verses keep their
        number and each section starts where its first word is sung; a heard word that starts within 60 ms of a beat is moved onto it.
        `song_map.words_estimated` becomes `false` and `song_map.words_source` says `heard` or, with the voice separated first, `heard-voice`.
        With the voice separator installed the voice is separated first (`separate`, `auto` by default: see `MusicSeparate`), and a kept stem is
        reused. If the user did not edit the script, it is rebuilt with the fixed rule; if they edited it, it is kept and `script_warning` says
        how many of its pieces end up more than a second from a boundary of the new sections. It does not change the design, the level, the
        style or the frames. Without words heard it returns the piece as it was, with `words_note`. `409` if a run is in progress (also the
        piece's own: Whisper and the separator need memory), `503` with the reason if Whisper is not installed or does not fit in memory (or,
        with `separate: true`, the separator), `404` if the piece does not exist, `422` for a `separate` that is not valid.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                separate: { $ref: "#/components/schemas/MusicSeparate" }
      responses:
        "200":
          description: The piece with the rebuilt map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiece" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "502": { description: Whisper failed to read the song (`internal`). , content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503":
          description: Whisper is not installed or does not fit in memory, or the separator was required and cannot be used (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/music-motion/pieces/{id}/words:
    patch:
      tags: [Music motion]
      summary: Moves words of the song map by hand
      description: >-
        Moves the named words to the given times (seconds of the song; `index` is the position in `song_map.words`; a missing `end` keeps the
        word's length). Words are moved, never reordered: `422` for an unknown index, a word named twice, a time outside the song, a word that
        would last less than 0.05 s or one that would start before the word that precedes it or after the one that follows it (the moves of the
        same call count); nothing changes then. On success `song_map.words_source` is `edited`, the moved words say `heard: false` and
        `confidence: 0`, the sections start again where their first word is sung and the script follows the same rule as after hearing the
        words: one the user did not edit is proposed again from the new map, one they edited is kept and `script_warning` says how many of its
        pieces may need adjusting. The design, the level, the style and the frame rate do not change. The same body sent twice gives the same
        map. `409` while the piece is being drawn or a proposal is being written, `404` for an unknown piece.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MusicWordsRequest" }
      responses:
        "200":
          description: The piece with the moved words.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicPiece" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/image-edits:
    get:
      tags: [Generation]
      summary: Lists the picture edits, most recent first
      description: >-
        Each as `GET /api/image-edits/{id}` answers it. The list can be paged (`limit`, `offset`, `sort`) and kept to some clients (`client`); with
        no parameter it answers every picture edit. `400` for a value that is not valid.
      parameters:
        - { name: client, in: query, required: false, description: "Only the calls made by these clients (comma separated: names, `embedded` or `unknown`).", schema: { type: string } }
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { name: sort, in: query, required: false, description: "`created_at` (newest first by default); a `-` before it reverses the order.", schema: { type: string } }
      responses:
        "200":
          description: The picture edits. With a page parameter the headers `X-Total-Count` and `Link` say how many there are and where the other pages are.
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ImageEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Retouches an image in a single call
      description: >-
        Takes an image (the `image` part of a `multipart/form-data` request), a model, a prompt, an optional negative
        prompt, an optional strength and a number of variants; creates the retouch as a project of its own
        (hidden, like the generations), launches its run on the usual queue and answers `202`. An `img2img` model
        starts from the image with `strength` (default 0.6) and makes up to `max_variants` variants; an `instruction` one
        changes the image according to the text («put a red cap on the man»), keeping the image's shape, and does not accept
        `strength` or `negative_prompt`. `422` with the reason if the model does not accept the request (blank prompt,
        `strength` outside (0, 1], variants outside 1 up to what the model makes, a setting it does not take) and
        `503` if the model cannot be run now; in both cases nothing is created.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request, image]
              properties:
                request: { type: string, description: "The request JSON (`ImageEditRequest`)." }
                image: { type: string, format: binary, description: "The image to retouch: png, jpg, jpeg or webp." }
      responses:
        "202":
          description: Retouch accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The model cannot be run now (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/image-edits/{id}:
    get:
      tags: [Generation]
      summary: State, progress and results of a retouch
      description: >-
        When done, `results` carries one image per variant with the seed that recreates it and its address
        (a read-only artifact).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The retouch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImageEdit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Cancels and deletes a retouch with its files and its run history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/video-edits/options:
    get:
      tags: [Generation]
      summary: Which tools can edit a video on this machine
      description: >-
        Lists the tools in stable order (`scale`, `interpolate`, `reframe`, `remove-background`, `depth`,
        `extend`, `motion-control`), each with its identifier, name, description, `available`, the reason if it is not
        available, the settings it accepts (name, type, limits, default value) and whether it needs a reference image.
        A tool that lacks files, binaries or the vision service comes with `available: false` and
        the reason; the list never fails.
      responses:
        "200":
          description: The tools.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEditOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/video-edits:
    get:
      tags: [Generation]
      summary: Lists the video edits, most recent first
      description: >-
        Edits do not appear in `GET /api/projects`, nor in the storage or in the per-project statistics. The list can be paged (`limit`,
        `offset`, `sort`) and kept to some clients (`client`); with no parameter it answers every edit. `400` for a value that is not valid.
      parameters:
        - { name: client, in: query, required: false, description: "Only the calls made by these clients (comma separated: names, `embedded` or `unknown`).", schema: { type: string } }
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { name: sort, in: query, required: false, description: "`created_at` (newest first by default); a `-` before it reverses the order.", schema: { type: string } }
      responses:
        "200":
          description: The edits. With a page parameter the headers `X-Total-Count` and `Link` say how many there are and where the other pages are.
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VideoEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Edits a video in a single call
      description: >-
        Takes a video (the `video` part), a tool with its settings, a reference image if the
        tool takes one (the `image` part) and an optional `client`; creates the edit as a project of its own
        (hidden), launches its run on the usual queue and answers `202` with the edit's identifier and the
        run's. `motion-control` can take, instead of `video`, the identifier of a motion from the
        library (`motion` in `request`); with both, with neither, with a motion that does not exist or is not
        `ready`, or with a `start` that leaves fewer than 33 frames, it is `422`. `422` also for a setting the
        tool does not accept (it says which), a file that is not a readable video, an image that is missing or
        extra; `503` with the reason if the tool cannot be run now. In no case is anything created.
        If another heavy process is running, the response carries the same warning as any run and the edit waits its turn.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: "The request JSON (`VideoEditRequest`)." }
                video: { type: string, format: binary, description: "The video: mp4, mov, webm or mkv. Required except in `motion-control` with `motion`." }
                image: { type: string, format: binary, description: "The reference image: png, jpg, jpeg or webp. Only if the tool takes one (`motion-control`), and then required." }
      responses:
        "202":
          description: Edit accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEdit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The tool cannot be run now (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/video-edits/{id}:
    get:
      tags: [Generation]
      summary: State, progress and result of a video edit
      description: >-
        When done, `result` carries the video's address (a read-only artifact) and what it has.
        If it failed, `error` says why and no partial result is offered.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The edit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoEdit" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Cancels, if running, and deletes an edit with its files and its project
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/motions:
    get:
      tags: [Generation]
      summary: Lists the motion library
      description: >-
        Short videos of people moving that `motion-control` can apply to any image. The library
        starts empty: the server ships no videos. The record of each motion is a row of the database; its control frames and its preview are files.
        The list can be paged and searched: `limit` and `offset`, `sort` = `created_at` (the default, the most recent first) or `title` (with a `-` for
        descending order), `q` in the title and the tags, and `state`; with a page parameter `X-Total-Count` and `Link` say how many there are in all.
        With none of them it answers every motion.
      parameters:
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { name: sort, in: query, required: false, description: "`created_at` (the default, newest first) or `title`; a `-` before it reverses the order.", schema: { type: string, example: "-title" } }
        - { $ref: "#/components/parameters/ListQuery" }
        - { name: state, in: query, required: false, schema: { type: string, enum: [processing, ready, failed] } }
      responses:
        "200":
          description: The motions. With a page parameter the headers `X-Total-Count` and `Link` say how many there are and where the other pages are.
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Motion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Generation]
      summary: Adds a motion from a video
      description: >-
        Takes a video (`multipart/form-data`: the `request` part with optional `title` and `tags` and the
        `video` part, or in `request` the `source` address of a YouTube video (an `https` address, the only kind the sources of a
        project take too; anything else is `422`)), answers `202` with the motion in the `processing` state and prepares it in the background:
        its control frames (people's depth with the background in black, at 16 fps and 832x480) and its
        preview. It lasts at most 30 seconds and has at least one person; otherwise, `422` with the reason and nothing is saved.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request: { type: string, description: "The request JSON (`MotionRequest`)." }
                video: { type: string, format: binary, description: "The video; not needed if `request` carries `source`." }
      responses:
        "202":
          description: Motion accepted, being prepared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Motion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503":
          description: The vision service is not available (`unavailable`, with the reason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/motions/{id}:
    patch:
      tags: [Generation]
      summary: Changes the title and the tags of a motion
      description: >-
        Changes the `title` and the `tags` that are sent, with the limits they have when a motion is added (a title of up to 120 characters, up to 10 tags
        of up to 40); what is not sent stays. Any other field is `400`. It can be done while the motion is being prepared: the title and tags are kept.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 120 }
                tags: { type: array, maxItems: 10, items: { type: string, maxLength: 40 } }
      responses:
        "200":
          description: The motion after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Motion" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Generation]
      summary: A motion from the library
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The motion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Motion" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Generation]
      summary: Removes a motion from the library
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/motions/{id}/preview:
    get:
      tags: [Generation]
      security:
        - bearer: []
        - ticket: []
      summary: A motion's preview
      description: >-
        Accepts `?ticket=` in place of the Authorization header, so a `<video>` element can play it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: A small video with the source image.
          content:
            video/mp4:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models/availability:
    get:
      tags: [Settings]
      summary: Which model tasks can run now
      description: >-
        For each routed task (`assistant`, `describe_image`, `describe_video`, `quality`, `motion_graphics`) it resolves the
        provider and says whether it can be used now: `{available, provider: {id, name, type}, reason?}`.
        `reason`: `unreachable` (no answer in 3 s), `no_models` (an Ollama with no chat model; embedding
        and reranker models do not count), `no_vision_model` (no model that reads images), `no_model` (an OpenAI-compatible
        provider without the task's model), `no_consent` (remote not accepted: it is not
        contacted) or `key_rejected` (its model list answers 401 or 403). It sends nothing from the user and
        loads no model. It is cached for 30 s on the server and discarded when settings, providers,
        keys or routing change. The interface hides the controls of an unavailable task.
      responses:
        "200":
          description: Availability per task.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        available: { type: boolean }
                        provider:
                          type: object
                          properties:
                            id: { type: string }
                            name: { type: string }
                            type: { type: string, enum: [ollama, openai] }
                        reason: { type: string, enum: [unreachable, no_models, no_vision_model, no_model, no_consent, key_rejected] }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/describe:
    post:
      tags: [Assistant]
      summary: Describes an image or a video uploaded to `sources/` and returns the prompt that would draw it
      description: >-
        Reads the file with a local Ollama vision model (nothing leaves the machine) and writes a
        prompt in English. For a video, 4 to 8 frames are extracted, described and merged into an
        image prompt and a motion prompt. The file is only read: it reaches no generator.
        Before returning anything the age of each person is checked (every frame, in a video): if
        anyone is or looks under 18, or it cannot be confirmed, the response is `describe_minor`, there is no
        prompt and the file is deleted from `sources/`. The application adds no further filters: if it is the
        model itself that refuses or does not describe, the response is `describe_refused` and the message
        names the other installed vision models. It is rejected while an execution is queued
        or active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project, source]
              properties:
                project: { type: string }
                source: { type: string, description: "Name of an image (png, jpg, webp) or a video (mp4, mov, webm, mkv, avi) among the project's sources." }
                model: { type: string, description: "An installed vision model (see `GET /api/describe/models`); empty = `gemma4:26b`, or the first installed." }
                detail: { type: boolean, description: "Without `model`: use the most detailed model, if there is one (only the private edition has one; it is ignored in the public one)." }
                split: { type: boolean, description: "Videos only: describe one shot per scene (`shots`) instead of a single prompt. Cuts are found with ffmpeg; shots shorter than 1.5 s are merged with the previous one and there are at most 12. An image ignores it." }
                provider: { type: string, description: "A provider that replaces the task's routing for this call only (the retry after a refusal); if remote it requires consent. There is never an automatic switch." }
      responses:
        "200":
          description: Description.
          content:
            application/json:
              schema:
                type: object
                properties:
                  prompt: { type: string }
                  motion: { type: string, description: "Videos only: motion prompt of about 25 words (may be missing)." }
                  model: { type: string, description: The model that described. }
                  kind: { type: string, enum: [image, video] }
                  frames: { type: integer }
                  provider: { type: string, description: The id of the provider that described. }
                  shots:
                    type: array
                    description: "Only with `split` on a video: one element per shot, in order (a video without cuts gives one that covers everything). `prompt` is the first one's."
                    items:
                      type: object
                      properties:
                        start: { type: number, description: Second at which the shot starts. }
                        end: { type: number }
                        prompt: { type: string }
                        motion: { type: string, description: "Motion of about 25 words (may be missing)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: >-
            `describe_refused` (the model refused or did not describe; the error body adds `provider` and `alternatives: [{provider, name, model}]` with other models of the same provider and the other providers with a vision model, to retry with `provider`) or `describe_minor` (a person is or
            looks under 18, or their age could not be confirmed; the file was deleted).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { description: "Ollama is not responding, the model is not installed or there is not enough memory." }

  /api/describe/models:
    get:
      tags: [Assistant]
      summary: Vision models installed in Ollama that the describe step can use
      description: >-
        `default` is the one used without `model` (`gemma4:26b`, or the first installed); `detail` is the
        most detailed model if installed (private edition only), empty if not. `fits` says whether it passes the memory rule
        (its size times 1.3 plus 4 GiB) with the memory free now.
      responses:
        "200":
          description: Vision models, from smallest to largest.
          content:
            application/json:
              schema:
                type: object
                properties:
                  default: { type: string }
                  detail: { type: string }
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        size_bytes: { type: integer, format: int64 }
                        fits: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: Ollama is not responding. }

  /api/assets:
    get:
      tags: [Models]
      summary: Installed files by type (models, voices, LoRA, video, music, adapters)
      description: >-
        The `adapter` type (music LoRA adapters, in `models/music/adapters/`) lists
        each adapter once, whether it is a `.safetensors` file or a folder with
        `adapter_model.safetensors` and `adapter_config.json`, with the total size of its files.
      responses:
        "200":
          description: Inventory.
          content:
            application/json:
              schema:
                type: object
                properties:
                  kinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
                        dir: { type: string }
                        extensions: { type: array, items: { type: string } }
                        note: { type: string }
                        assets:
                          type: array
                          items:
                            type: object
                            properties:
                              name: { type: string }
                              size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assets/catalog:
    get:
      tags: [Models]
      summary: Recommended catalog, with whether each entry is installed
      description: >-
        Adapter entries (`kind: adapter`) name their files as `<folder>/<file>` (a single level). Music entries (`kind: music`) are packages of four files with `role` `lm`, `text_encoder`, `dit` and `vae` that are installed in `models/music/`; the supporting ones are shared between packages.
      responses:
        "200":
          description: Catalog entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/assets/{kind}/{name}:
    delete:
      tags: [Models]
      summary: Deletes an installed file
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [model, voice, lora, video, music, adapter] }
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/civitai/resolve:
    get:
      tags: [Models]
      summary: Files of a Civitai model version
      description: Only the private edition has Civitai downloads; the public edition answers `404` here.
      parameters:
        - name: ref
          in: query
          required: true
          description: URL of the model on Civitai.
          schema: { type: string }
      responses:
        "200":
          description: Model, version and available files.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/tokens/{service}:
    put:
      tags: [Models]
      summary: Saves the download key for Hugging Face or Civitai
      description: The key is never returned in any response. The `civitai` service exists only in the private edition; the public edition answers `404` for it.
      parameters: [{ $ref: "#/components/parameters/TokenService" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204": { description: Saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Models]
      summary: Deletes the saved key
      description: "409 if there is no file and the key comes from an environment variable."
      parameters: [{ $ref: "#/components/parameters/TokenService" }]
      responses:
        "204": { description: Deleted (also if there was none). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/models3d/packs:
    get:
      tags: [Models 3D]
      summary: The packs of 3D models the server knows and the ones a person imported
      description: >-
        The list that ships with the server (only CC0 packs, each with the hash of the version that was checked) and the packs imported by the person, with their
        `state` (`available`, `installing`, `installed`, `failed` with its `error`), their size and, when installed, how many models they have. A pack that is being
        installed has its `progress`.
      responses:
        "200":
          description: The packs.
          content:
            application/json:
              schema:
                type: object
                required: [packs]
                properties:
                  packs: { type: array, items: { $ref: "#/components/schemas/ModelPack" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/models3d/packs/import:
    post:
      tags: [Models 3D]
      summary: Imports a pack from a zip the person has
      description: >-
        The body is the zip (`application/zip`, up to 200 MB). It is unpacked with the safety rules of an install (no links, no paths that leave the folder, at most
        5,000 entries and 1 GB unpacked) and keeps only what a library uses. `licence` says what the pack allows and is required: the server keeps it and shows it with
        each model, and does not judge it. A pack with no `.glb` is a `422`; an `id` already in use is a `409`.
      parameters:
        - { name: id, in: query, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,47}$" } }
        - { name: licence, in: query, required: true, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: author, in: query, schema: { type: string } }
        - { name: source_url, in: query, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/zip: { schema: { type: string, format: binary } }
      responses:
        "201":
          description: Installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPack" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { description: The zip is larger than 200 MB. }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/models3d/packs/{id}:
    get:
      tags: [Models 3D]
      summary: One pack
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Models 3D]
      summary: Removes an installed or imported pack
      description: Its files and its models leave the library; a pack of the list goes back to `available`. A project or piece that copied one of its models keeps it. `409` while it is being installed (cancel it first).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/models3d/packs/{id}/install:
    post:
      tags: [Models 3D]
      summary: Installs a pack of the list
      description: >-
        Queues the download from the host of the pack's page only, checks the SHA-256 of the zip and the words of its licence text against the version that was checked,
        unpacks it safely and indexes its models. Answers `202` with the pack in state `installing`; ask `GET /api/models3d/packs/{id}` for its `progress`. A pack that
        changed, a page that no longer gives its download or a failure ends the pack in state `failed` with the reason and no file left behind. `409` for a pack that is
        installed or being installed; `404` for one that is not in the list.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/models3d/packs/{id}/cancel:
    post:
      tags: [Models 3D]
      summary: Cancels the install of a pack
      description: The pack goes back to `available` and nothing is left behind. `409` when it is not being installed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/models3d/models:
    get:
      tags: [Models 3D]
      summary: The models of the installed packs
      description: >-
        Each with its `clips`, `triangles` and `needs` (read from the file), the `tags` of its pack and of the words of its name, the `licence` and `author` of its pack and
        whether the licence asks for `attribution`. `q` is searched in the name and the tags without regard to case; `has_clips=true` leaves out the ones with no animation;
        `limit` and `offset` take a page (`X-Total-Count` and `Link` say where the others are). Add one to a project with `POST /api/projects/{id}/sources/model` or to a piece with
        `POST /api/music-motion/pieces/{id}/models`.
      parameters:
        - { name: pack, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: has_clips, in: query, schema: { type: boolean } }
        - { name: source, in: query, description: "Where the model comes from: `catalog` (a pack of the catalog), `user` (an imported one) or `generated` (made by an engine here).", schema: { type: string, enum: [catalog, user, generated] } }
        - { name: engine, in: query, description: "Only the generated models made by this engine.", schema: { type: string, enum: [triposr, sf3d] } }
        - { name: project, in: query, description: "Only the generated models that this project (or generation) made.", schema: { type: string } }
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
      responses:
        "200":
          description: The models. A model marked `adult` is left out by a server that does not show content for adults (its detail and thumbnail are `404` there).
          content:
            application/json:
              schema:
                type: object
                required: [models, total]
                properties:
                  models: { type: array, items: { $ref: "#/components/schemas/LibraryModel" } }
                  total: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/models3d/models/{pack}/{name}:
    get:
      tags: [Models 3D]
      summary: One model of the library
      parameters:
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryModel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models3d/models/{pack}/{name}/thumbnail:
    get:
      tags: [Models 3D]
      security:
        - bearer: []
        - ticket: []
      summary: A small picture of a model
      description: The pack's own preview picture when it has one; otherwise one 256-pixel frame drawn by Blender on the CPU and kept, so it is drawn once. `503` with how to install Blender when the pack has no preview and Blender is missing. For an `<img>`, which cannot send headers, `?ticket=` is accepted (see `POST /api/auth/ticket`).
      parameters:
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: The picture.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { description: The model has no preview picture and Blender is not installed. }

  /api/models3d/models/{pack}/{name}/file:
    get:
      tags: [Models 3D]
      security:
        - bearer: []
        - ticket: []
      summary: The binary glTF of a model
      description: >-
        The `.glb` of a model of the library as it is stored, for a viewer or a download (the library refuses a `.glb` that is not a usable binary glTF; the pictures a model
        `needs` are not part of the answer). The answer carries an `ETag` and `Cache-Control: private`; `If-None-Match` is answered with `304` and a `Range` with `206`.
        `404` for a model that is not in the library (or is for adults on a server that does not show them). For a viewer in a plain tag or an `<a download>`, which cannot send headers,
        `?ticket=` is accepted (see `POST /api/auth/ticket`).
      parameters:
        - { name: pack, in: path, required: true, schema: { type: string } }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: The model.
          headers:
            ETag: { schema: { type: string } }
          content:
            model/gltf-binary: { schema: { type: string, format: binary } }
        "206": { description: The part of the file the `Range` asked for. }
        "304": { description: The model has not changed since the `ETag` the caller has. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models3d/engines:
    get:
      tags: [Models 3D]
      summary: The engines that make a 3D model from a picture and whether each can be used now
      description: >-
        `triposr` (TripoSR, MIT licence; the default) and `sf3d` (Stable Fast 3D, Stability AI Community License), run by an optional service: its own .NET service (the default) or the one container of
        `docker/model3d` (`model3d_backend`), or one that `MODEL3D_HOST` names. Each is `available`, or has a `reason` and a `detail`: `no_service`, `no_docker`, `no_image`, `no_gpu_runtime`,
        `no_weights`, `no_gpu`, `not_running` (everything is there but the service or container is stopped), `unreachable`, `not_built` (the image was built without that
        engine), and for `sf3d` also `key_missing` (no Hugging Face key is saved), `key_rejected` (Hugging Face does not know the saved key) and
        `licence_not_accepted` (Hugging Face refuses the key for the repository: the detail names it and says its licence has to be accepted there with the
        account of the key). It starts nothing. `503` when this server has no 3D service. The server never accepts a licence, creates an account or asks for a
        key on anyone's behalf: it only says what is missing.
      responses:
        "200":
          description: Each engine.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: object
                    additionalProperties: { $ref: "#/components/schemas/EngineAvailability" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "This server has no 3D service set up.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/models3d/engines/{engine}/start:
    post:
      tags: [Models 3D]
      summary: Start the service of a 3D engine (its .NET service or the container)
      description: >-
        Starts the engine's service (the .NET service on a free port of loopback, or the container when `model3d_backend` is `docker`, where the two engines are the one container) on the card with most free memory and waits in the background for it to be ready (watch `GET /api/models3d/engines`). `200` with its state (also when it already runs); `409` with the `reason` of the engine when it cannot be used yet
        (anything but `not_running`), and when the service is an external one (`MODEL3D_HOST`), which is managed where it runs; `404` for an unknown engine.
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string, enum: [triposr, sf3d] } }
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/ContainerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: "This server has no 3D service set up.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/models3d/engines/{engine}/stop:
    post:
      tags: [Models 3D]
      summary: Stop the service of a 3D engine (its .NET service or the container)
      description: Stops the engine's service, or removes the container on the `docker` backend (not an error when there is none). `409` for an external service and while a run is making 3D models; `404` for an unknown engine.
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string, enum: [triposr, sf3d] } }
      responses:
        "200":
          description: The container.
          content:
            application/json:
              schema:
                type: object
                properties:
                  container: { $ref: "#/components/schemas/ContainerState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: "This server has no 3D service set up.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/models3d/engines/{engine}/install:
    post:
      tags: [Models 3D]
      summary: Plan or start the install of what an engine lacks, for one backend
      description: >-
        What an engine needs depends on how it runs (`model3d_backend`): the `dotnet` backend (the default) is the **service** (`scripts/get-services.sh --only <engine>`)
        and the **weights**, downloaded by this server with no Docker (`sf3d` adds `sf3d/160_tets.npz`, which only its service reads, and uses the saved Hugging Face key for its two gated files); the `docker` backend (the optional fallback) is the **image**
        (`docker build` of `docker/model3d`, TripoSR only) and the **weights**, fetched by `fetch.py` inside the image (`sf3d`'s use the saved Hugging Face key, handed to
        the container by its environment and never in an argument). `backend` names the one to install for, so the container can be installed before it is chosen
        (default: the one in use); `parts` picks among `service`, `image` and `weights` (empty: everything missing, in that order).
        **Without `confirm`** it answers the plan (`200`): the backend, the parts it would run, the weight files that are missing, their approximate size, the licence
        they come under, whether they are `gated` and the room on the disk. It changes nothing. **With `confirm: true`** it starts a job (`202`); follow it at
        `GET /api/models3d/installs/{id}`. `409` when nothing is missing, while another install runs, and for an external service; `422` with the `reason` when it
        cannot be done that way (`no_service` without .NET, `no_docker`, `no_gpu_runtime`, `not_built`, an image of `sf3d` that is not built, a part the backend does
        not have, and `key_missing`, `key_rejected` or `licence_not_accepted` for `sf3d`) or `no_disk`.
      parameters:
        - { name: engine, in: path, required: true, schema: { type: string, enum: [triposr, sf3d] } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                backend: { type: string, enum: [dotnet, docker], description: "The way to install for (default: the one the engine runs on now)." }
                parts: { type: array, items: { type: string, enum: [service, image, weights] }, description: "Only these parts (default: all that are missing)." }
                confirm: { type: boolean, description: "The person read the plan, including the licence: start the job." }
      responses:
        "200":
          description: The plan (no `confirm`).
          content:
            application/json:
              schema:
                type: object
                required: [plan]
                properties:
                  plan: { $ref: "#/components/schemas/Model3DInstallPlan" }
        "202":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                required: [install]
                properties:
                  install: { $ref: "#/components/schemas/Model3DInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { description: "The engine cannot be installed now (`reason`) or the disk has no room (`no_disk`).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "This server has no 3D service set up.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/models3d/installs/{id}:
    get:
      tags: [Models 3D]
      summary: One download of weights
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job, with the last lines of what it printed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model3DInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models3d/installs/{id}/cancel:
    post:
      tags: [Models 3D]
      summary: Cancel a download of weights
      description: "`409` when it is not running."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The job, `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Model3DInstall" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/models3d/generations:
    get:
      tags: [Models 3D]
      summary: Lists the generations of 3D models, most recent first
      description: >-
        A generation is a hidden project (`api-m3d-…`, kind `model_generation`) in the mode `models3d` with one entry. It does not appear in `GET /api/projects` without
        `managed=include`. The list can be paged (`limit`, `offset`, `sort` = `created_at`, newest first by default) and kept to some clients (`client`); with no parameter it answers
        every generation. `400` for a value that is not valid.
      parameters:
        - { name: client, in: query, required: false, description: "Only the calls made by these clients (comma separated: names, `embedded` or `unknown`).", schema: { type: string } }
        - { $ref: "#/components/parameters/ListLimit" }
        - { $ref: "#/components/parameters/ListOffset" }
        - { name: sort, in: query, required: false, description: "`created_at` (newest first by default); a `-` before it reverses the order.", schema: { type: string } }
      responses:
        "200":
          description: The generations. With a page parameter the headers `X-Total-Count` and `Link` say how many there are and where the other pages are.
          headers:
            X-Total-Count: { $ref: "#/components/headers/XTotalCount" }
            Link: { $ref: "#/components/headers/Link" }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModelGeneration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Models 3D]
      summary: Makes a 3D model in a single call
      description: >-
        Takes a `prompt` (the server draws the picture with the best image model installed here and makes the model from it) or a picture (`multipart/form-data` with the `image` part:
        `.png`, `.jpg`, `.jpeg` or `.webp`, up to 20 MB, and the other fields as text), with the optional `engine` (`triposr`, the default, or `sf3d`), `detail` (`low`, `normal`,
        `high`), `name` (a plain lower-case name; one is made from the prompt when it is absent), `client` and `adult`. It makes the project of the generation, launches its run on the
        usual queue and answers `202` at once; the model is added to the pack `generated` of the library when the run ends. `400` naming the field for a prompt and a picture together,
        neither, an empty or longer than 1000 characters prompt, an unknown engine or detail, a name or a client that is not valid; `413` for a picture over 20 MB; `422` with
        `content_not_allowed` for `adult: true` on a server that does not keep content for adults; `503` (`unavailable`, with the engine's `reason`) when the engine cannot be used now
        (`not_running`, `no_weights`, `key_missing`, ...) or, for a prompt, when no image model is installed (`no_image_model`). In no case is anything created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelGenerationRequest" }
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary, description: "The picture the model is made from; then no `prompt`." }
                prompt: { type: string }
                engine: { type: string, enum: [triposr, sf3d] }
                detail: { type: string, enum: [low, normal, high] }
                name: { type: string }
                client: { type: string }
                adult: { type: string, enum: ["true", "false"] }
      responses:
        "202":
          description: Generation accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGeneration" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { description: "The picture is larger than 20 MB.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { description: "The engine, or the image model of a prompt, cannot be used now (`unavailable`, with the reason).", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/models3d/generations/{id}:
    get:
      tags: [Models 3D]
      summary: State, step and model of a generation
      description: >-
        `state` is `queued`, `running`, `done`, `failed` or `cancelled`; while it runs `step` says `picture` (the picture of the prompt) or `model`; when `done`, `model` is the
        `<pack>/<name>` in the library (see `GET /api/models3d/models/{pack}/{name}`). If it failed, `error` says why.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The generation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGeneration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Models 3D]
      summary: Deletes a generation with its project, not the model it made
      description: "Cancels the run if it is going. The model stays in the library: remove it there."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/models3d/generations/{id}/cancel:
    post:
      tags: [Models 3D]
      summary: Stops a generation that is queued or running
      description: "`409` when it is already `done`, `failed` or `cancelled`."
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The generation, `cancelled`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModelGeneration" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/projects/{id}/sources/model:
    post:
      tags: [Projects]
      summary: Adds a model of the library to a project's sources
      description: >-
        Copies the model `from` (`<pack>/<model>`) as `<model>.glb` (or `name`) and the pictures it needs as `<pack>--<picture>`, with the addresses inside the copy rewritten
        to match, so that two packs that call their texture the same never collide. What is already there with the same content is reused (`200` when nothing was written);
        another file of the same name is a `409` and nothing is written. `from` that is not `<pack>/<model>` is a `400`; a pack that is not installed, or a model it does not have, is a `404`. From then on it is an ordinary source (`kind: model`), independent of the library.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from]
              properties:
                from: { type: string, description: "`<pack>/<model>` of the library." }
                name: { type: string, description: "A plain file name ending in `.glb`; the model's own by default." }
      responses:
        "200": { description: It was already there., content: { application/json: { schema: { $ref: "#/components/schemas/ModelCopy" } } } }
        "201": { description: Copied., content: { application/json: { schema: { $ref: "#/components/schemas/ModelCopy" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Another file has that name, or a run is queued or active. }

  /api/downloads:
    get:
      tags: [Downloads]
      summary: Recent downloads, newest first
      responses:
        "200":
          description: List of downloads.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloads:
                    type: array
                    items: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Downloads]
      summary: Queues a download (direct URL, Hugging Face or catalog entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [model, voice, lora, video, music, adapter] }
                url: { type: string }
                repo: { type: string }
                file: { type: string }
                revision: { type: string, default: main }
                id: { type: string, description: Id of a catalog entry. }
                name: { type: string }
                overwrite: { type: boolean }
      responses:
        "202":
          description: Download queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }

  /api/downloads/{id}:
    get:
      tags: [Downloads]
      summary: A download
      parameters: [{ $ref: "#/components/parameters/DownloadId" }]
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/downloads/{id}/cancel:
    post:
      tags: [Downloads]
      summary: Cancels a queued or in-progress download
      parameters: [{ $ref: "#/components/parameters/DownloadId" }]
      responses:
        "200":
          description: Download cancelled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download: { $ref: "#/components/schemas/Download" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/downloads/{id}/events:
    get:
      tags: [Downloads]
      security:
        - bearer: []
        - ticket: []
      summary: Live download progress (SSE)
      description: |
        For `EventSource`, not for a one-off request. Events
        `download-state`, `progress` and `stream-end`. With a token use `?ticket=`.
      parameters:
        - { $ref: "#/components/parameters/DownloadId" }
        - { $ref: "#/components/parameters/Ticket" }
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Token configured when the server starts (`VERITMO_TOKEN`).
    ticket:
      type: apiKey
      in: query
      name: ticket
      description: Short-lived ticket from `POST /api/auth/ticket`, accepted instead of the token only on the seven read-only routes that list it (event streams and files shown by the browser in an image, a video or an EventSource).
  parameters:
    ManagedInclude:
      name: managed
      in: query
      required: false
      description: "`include` also lists the generation API projects (`api-gen-`, `api-edit-`, `api-vid-`) as ordinary projects, with their `client` and `kind`. Without it they are not listed. Any other value is a 400. Music motion animations (`api-mm-`) never appear."
      schema: { type: string, enum: [include] }
    ClientFilter:
      name: client
      in: query
      required: false
      description: "Comma-separated list of clients (client names, `embedded` or `unknown`): only the items of those clients appear. A name that is not valid is a 400."
      schema: { type: string, example: "my-dashboard,embedded" }
    ProjectId:
      name: id
      in: path
      required: true
      description: Project identifier.
      schema: { type: string }
    SceneId:
      name: scene
      in: path
      required: true
      description: Scene identifier.
      schema: { type: string }
    RunId:
      name: id
      in: path
      required: true
      description: Run identifier.
      schema: { type: string }
    ReviewId:
      name: rid
      in: path
      required: true
      description: Review identifier.
      schema: { type: string }
    FindingId:
      name: fid
      in: path
      required: true
      description: Finding identifier.
      schema: { type: string }
    DownloadId:
      name: id
      in: path
      required: true
      description: Download identifier.
      schema: { type: string }
    TokenService:
      name: service
      in: path
      required: true
      schema: { type: string, enum: [huggingface, civitai] }
    Ticket:
      name: ticket
      in: query
      description: Ticket from `POST /api/auth/ticket`, for clients that cannot send headers.
      schema: { type: string }
    ListLimit:
      name: limit
      in: query
      required: false
      description: "A page of at most this many items (1 to 500). Without it, and without `offset`, `sort` and `q`, the list answers all its items as it always did. `offset` alone uses a limit of 100. The answer carries `X-Total-Count` and `Link`."
      schema: { type: integer, minimum: 1, maximum: 500 }
    ListOffset:
      name: offset
      in: query
      required: false
      description: "How many items to skip (0 or more). Beyond the end the answer is an empty list with the total."
      schema: { type: integer, minimum: 0 }
    LibrarySongKey:
      name: key
      in: path
      required: true
      description: "The key of a song, `project/track/seed`, with its slashes sent as `%2F`."
      schema: { type: string, example: "songs%2Fballad%2F7" }
    LibraryPlaylistId:
      name: id
      in: path
      required: true
      description: The id of a playlist.
      schema: { type: string }
    ListSort:
      name: sort
      in: query
      required: false
      description: "The field to sort by, with a `-` before it for descending order. Each list names the fields it accepts; any other is a 400 that names them. Without it the list keeps the order it has."
      schema: { type: string, example: "-created_at" }
    ListQuery:
      name: q
      in: query
      required: false
      description: "A text searched, without regard to case, in the text fields the list names. It combines with the filters the list has."
      schema: { type: string }
  headers:
    XTotalCount:
      description: "How many items match in all, whatever the page. Sent by a list asked with `limit`, `offset`, `sort` or `q`."
      schema: { type: integer }
    Link:
      description: "The next and the previous page as `<url>; rel=\"next\"` and `<url>; rel=\"prev\"`, when there are such pages. Sent by a list asked with `limit` or `offset`."
      schema: { type: string }
  schemas:
    DataStatus:
      type: object
      required: [engine, migrations, tables, imports, legacy_files]
      properties:
        engine: { type: string, enum: [sqlite, mysql, postgres] }
        migrations:
          type: object
          required: [applied, pending]
          properties:
            applied: { type: array, items: { $ref: "#/components/schemas/DataMigration" } }
            pending: { type: array, items: { type: string }, description: "The migrations this program has and the database has not applied." }
        tables:
          type: array
          items: { $ref: "#/components/schemas/DataTableRows" }
        imports: { type: array, items: { $ref: "#/components/schemas/DataImportRecord" } }
        legacy_files: { type: array, items: { $ref: "#/components/schemas/DataLegacyFiles" } }
    DataMigration:
      type: object
      required: [id, applied_at]
      properties:
        id: { type: string, example: 202611181200_history }
        applied_at: { type: string, format: date-time }
    DataTableRows:
      type: object
      required: [name, rows]
      properties:
        name: { type: string }
        rows: { type: integer, format: int64 }
    DataImportRecord:
      type: object
      required: [entity, state, created, existing, skipped, started_at]
      properties:
        entity: { type: string, example: music-motion/parts }
        state: { type: string, enum: [done, failed] }
        created: { type: integer, description: Rows created from files. }
        existing: { type: integer, description: Rows that were already there and were left as they are. }
        skipped:
          type: array
          items:
            type: object
            required: [path, reason]
            properties:
              path: { type: string }
              reason: { type: string }
        error: { type: string, description: Why a failed import failed; the transaction was undone. }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DataLegacyFiles:
      type: object
      required: [entity, files, bytes]
      properties:
        entity: { type: string }
        files: { type: integer }
        bytes: { type: integer, format: int64 }
    DataImportRequest:
      type: object
      properties:
        entity: { type: string, description: "The entity to import again. Without it, every entity that has not been imported." }
    DataImportAnswer:
      type: object
      required: [imports]
      properties:
        imports: { type: array, items: { $ref: "#/components/schemas/DataImportRecord" } }
    DataCleanRequest:
      type: object
      required: [entities]
      properties:
        entities: { type: array, minItems: 1, items: { type: string } }
    DataCleanAnswer:
      type: object
      required: [cleaned]
      properties:
        cleaned:
          type: array
          items:
            type: object
            required: [entity, deleted, bytes]
            properties:
              entity: { type: string }
              deleted: { type: integer }
              bytes: { type: integer, format: int64 }
    PromptPreset:
      type: object
      required: [kind, prompt]
      properties:
        id: { type: string, description: "Given by the server." }
        kind: { type: string, enum: [image, video, motion, music, animation, model3d] }
        title: { type: string }
        prompt: { type: string, maxLength: 2000 }
        negative: { type: string }
        tags: { type: array, items: { type: string }, description: "Lower case, at most 20." }
        engine: { type: string }
        language: { type: string }
        source: { type: string, description: "Where it comes from; required in a bundle (`user` for the person's own)." }
        source_id: { type: string, description: "Its id at the source; with `kind` and `source` it says a preset was already imported." }
        licence: { type: string, description: "Required in a bundle." }
        nsfw: { type: boolean }
        own: { type: boolean, description: "The person's own; only these can be deleted." }
        created_at: { type: string, format: date-time }
    MonitoringRequest:
      type: object
      description: >-
        All fields are optional. An empty body, or an empty `address`, removes the tool (and its key). Without `user`, no
        user is saved. With `secret` absent the saved key is kept if the address and the user do not change; with `secret` (even
        if empty) what arrives is saved.
      properties:
        address: { type: string }
        user: { type: string }
        secret: { type: string, description: "Omit to keep the saved one." }
    MonitoringTools:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items:
            type: object
            required: [id, secret_set, source]
            properties:
              id: { type: string, enum: [grafana, prometheus, loki, redis] }
              address: { type: string }
              user: { type: string }
              secret_set: { type: boolean }
              source: { type: string, enum: [setting, env, default], description: "Where the tool comes from: saved here, the `MONITORING_<TOOL>_ADDRESS|USER|SECRET` variables (the default while nothing is saved for it) or none." }
    DatabaseRequest:
      type: object
      required: [driver]
      properties:
        driver: { type: string, enum: [sqlite, mysql, postgres] }
        host: { type: string }
        port: { type: integer }
        name: { type: string }
        user: { type: string }
        password: { type: string, description: "Omit to keep the saved one." }
        server_name: { type: string, description: "Name of this server in the history (empty: the machine's own). PUT only." }
    DatabaseView:
      type: object
      required: [driver, password_set]
      properties:
        driver: { type: string }
        host: { type: string }
        port: { type: integer }
        name: { type: string }
        user: { type: string }
        password_set: { type: boolean }
    DatabaseSettings:
      type: object
      required: [saved, active, restart_required, source, server_name, servers]
      properties:
        saved: { $ref: "#/components/schemas/DatabaseView" }
        active: { $ref: "#/components/schemas/DatabaseView" }
        restart_required: { type: boolean }
        source: { type: string, enum: [setting, env, default], description: "Where `saved` comes from: the settings file, the `VERITMO_DB_*` variables of the environment (the default while nothing is saved) or the SQLite file." }
        server_name: { type: string }
        servers: { type: array, items: { type: string } }
    SoundTag:
      type: object
      required: [tag, score]
      properties:
        tag: { type: string }
        score: { type: number, description: "Cosine similarity with the sound (not a probability)." }
    LibraryPlaylist:
      type: object
      required: [id, name, songs]
      properties:
        id: { type: string, example: for-running, description: "Lowercase letters, digits and hyphens." }
        name: { type: string, maxLength: 80 }
        songs:
          type: array
          description: Song keys (`project/track/seed`) in order.
          items: { type: string }
    LibrarySong:
      type: object
      description: A song of the library, as `GET /api/library` lists it, with its stars.
      required: [key, project, track_id, variant, seed, title, file, generator, client]
      properties:
        key: { type: string, example: songs/ballad/7 }
        project: { type: string }
        track_id: { type: string }
        variant: { type: integer }
        seed: { type: integer }
        title: { type: string }
        caption: { type: string }
        lyrics: { type: string }
        instrumental: { type: boolean }
        bpm: { type: integer }
        keyscale: { type: string }
        vocal_language: { type: string }
        audio_seconds: { type: number }
        duration: { type: number, description: "The length of the audio as the song map reads it, to the millisecond. Absent when it cannot be measured." }
        file: { type: string }
        cover: { type: string }
        favorite: { type: boolean }
        generator: { type: string, enum: [ace-step, heartmula, diffrhythm2] }
        generated_at: { type: string }
        client: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5, description: "Its stars; absent when it has none." }
    Fix:
      type: object
      required: [kind]
      description: How a finding is fixed. `trim` requires `seconds`, `reseed` requires `seed`, `motion_prompt` requires `motion_prompt` and `prompt` requires `prompt`.
      properties:
        kind: { type: string, enum: [trim, reseed, motion_prompt, prompt] }
        params: { type: object, additionalProperties: true }
    Review:
      type: object
      required: [id, project, state, total, done, created_at]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [analyzing, ready, failed] }
        model: { type: string, description: Vision model used; empty if it was only measured. }
        total: { type: integer, description: Clips being analysed. }
        done: { type: integer, description: Clips already analysed. }
        notes: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ReviewSummary:
      allOf:
        - { $ref: "#/components/schemas/Review" }
        - type: object
          properties:
            findings: { type: integer }
            pending: { type: integer }
    Finding:
      type: object
      required: [id, review_id, scene, kind, source, from_seconds, severity, description, has_frame, fix, status, created_at]
      properties:
        id: { type: string }
        review_id: { type: string }
        scene: { type: string }
        kind: { type: string, description: "deformation, color_drift, blur or observation (the user's own)." }
        source: { type: string, enum: [auto, manual] }
        from_seconds: { type: number }
        severity: { type: integer }
        description: { type: string }
        has_frame: { type: boolean }
        fix: { $ref: "#/components/schemas/Fix" }
        status: { type: string, enum: [pending, running, done, failed, skipped] }
        run_id: { type: string }
        message: { type: string }
        created_at: { type: string, format: date-time }
    Provider:
      type: object
      required: [id, name, type, base_url, text_model, vision_model, builtin, remote, key_set, lists_models]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [ollama, openai] }
        base_url: { type: string }
        text_model: { type: string }
        vision_model: { type: string }
        builtin: { type: boolean }
        remote: { type: boolean }
        key_set: { type: boolean, description: "Whether a key is saved; the key is never returned." }
        blocked: { type: boolean, description: "`true` when this edition does not use the provider's address (another edition saved it): no task runs on it." }
        preset: { type: string, description: "The preset it was created from (`GET /api/providers/presets`); absent when the address was edited by hand." }
        lists_models: { type: boolean, description: "Whether its model list is asked for when testing it (`false` for a preset that does not serve it)." }
        tested_at: { type: string, format: date-time, description: "When it was last tested; absent when never tested or when its key or address changed since." }
        test_ok: { type: boolean, description: "Whether that test succeeded (a chat answered)." }
    ProviderPreset:
      type: object
      required: [id, name, base_url, lists_models, text_models, vision_models, key_hint, notes]
      properties:
        id: { type: string, enum: [anthropic, gemini, openrouter, openai] }
        name: { type: string }
        base_url: { type: string }
        lists_models: { type: boolean }
        text_models: { type: array, items: { type: string }, description: "Suggested names, the first is the default; the person edits them." }
        vision_models: { type: array, items: { type: string } }
        key_hint: { type: string, description: "Where the key comes from." }
        notes: { type: string, description: "The caveats of the provider's compatibility layer." }
    ProviderInput:
      type: object
      required: []
      properties:
        preset: { type: string, enum: [anthropic, gemini, openrouter, openai], description: "On create only: fills `type`, `base_url`, `name`, `text_model` and `vision_model` from the preset when absent; anything given wins. Unknown: `400` naming the known ids. Without a preset, `name`, `type` and `base_url` are required." }
        id: { type: string, description: "On create only; lowercase letters, digits and hyphens, up to 40. Without it, it is derived from the name." }
        name: { type: string, maxLength: 60 }
        type: { type: string, enum: [ollama, openai] }
        base_url: { type: string }
        text_model: { type: string, maxLength: 200 }
        vision_model: { type: string, maxLength: 200 }
        key: { type: string, description: "API key (up to 500 characters, no spaces). Absent: unchanged; empty: remove it." }
    Routing:
      type: object
      required: [routing, max_calls]
      properties:
        suggested:
          type: object
          description: "Present only when a saved provider created from a preset has been tested with success: for `motion_graphics` and `quality` (the frame review), the external provider that fits them. Nothing is routed by it; `PUT /api/routing` does that, with the consent rules of remote providers."
          additionalProperties:
            type: object
            required: [provider_id, name, reason]
            properties:
              provider_id: { type: string }
              name: { type: string }
              reason: { type: string }
        routing:
          type: object
          additionalProperties:
            type: object
            required: [provider, name, remote, consented, model]
            properties:
              provider: { type: string }
              name: { type: string }
              remote: { type: boolean }
              consented: { type: boolean }
              model: { type: string }
        max_calls: { type: integer }
    SettingsResponse:
      type: object
      description: The server settings in use. All the blocks always arrive.
      required: [ollama, heartmula, diffrhythm2, remote, browser, motion_model, music_motion, model3d]
      properties:
        ollama: { $ref: "#/components/schemas/OllamaSetting" }
        heartmula: { $ref: "#/components/schemas/MusicServiceSetting" }
        diffrhythm2: { $ref: "#/components/schemas/MusicServiceSetting" }
        model3d:
          type: object
          description: "How the 3D generator (both engines) runs on this machine."
          required: [backend, backend_source]
          properties:
            backend: { type: string, enum: [dotnet, docker], description: "`dotnet` (the `triposr` and `stable-fast-3d` services of `bin/services`) or `docker` (the container of `docker/model3d`)." }
            backend_source: { type: string, enum: [setting, default], description: "`setting` when `PUT /api/settings {model3d_backend}` saved it, `default` otherwise (the .NET service)." }
        remote:
          type: object
          description: Remote model provider.
          required: [max_calls]
          properties:
            max_calls: { type: integer, description: Cap on calls to a remote provider. }
        browser: { $ref: "#/components/schemas/BrowserSetting" }
        motion_model: { $ref: "#/components/schemas/MotionModelSetting" }
        music_motion:
          type: object
          description: "The settings of the music-motion pieces."
          required: [review_drafts]
          properties:
            review_drafts: { type: boolean, description: "When true every part draft is graded by the vision model of the `check` task after its previews are drawn (a request's own `review` wins). Off by default. Saved with `PUT /api/settings {music_motion: {review_drafts}}`." }
    OllamaSetting:
      type: object
      required: [host, source, remote, saved]
      properties:
        host: { type: string, description: The address in use. }
        source: { type: string, enum: [setting, env, default] }
        remote: { type: boolean, description: "`true` when the address is not this machine." }
        saved: { type: string, description: "The saved value, or empty." }
    MusicServiceSetting:
      type: object
      description: >-
        Optional external music service (HeartMuLa or DiffRhythm2). The token is never returned:
        it only says whether there is one.
      required: [saved, token_set, remote, consented, source, backend, backend_source]
      properties:
        saved: { type: string, description: "The address in use (the saved one, else the one of the environment), or empty." }
        token_set: { type: boolean, description: "A token is set: the saved one, or the environment's when the address is the environment's." }
        remote: { type: boolean, description: "`true` when the address is not this machine: the lyrics and tags leave this computer." }
        consented: { type: boolean, description: "The person agreed to send them to that address (always `true` if it is this machine, and when the address is the one the environment gives)." }
        source: { type: string, enum: [setting, env, default], description: "Where the address comes from: saved here, the `HEARTMULA_HOST` / `DIFFRHYTHM2_HOST` variable (the default while nothing is saved) or none." }
        backend:
          type: string
          enum: [dotnet, docker]
          description: >-
            How the generator runs on THIS machine: `dotnet` (the .NET service, the default) or `docker` (its Python container, started and stopped by
            `/api/music/engines/{engine}/start` and `/stop` like the service). An address in `saved` wins over it: the generator is then an external service
            and `/start` and `/stop` answer `409`.
        backend_source: { type: string, enum: [setting, default], description: "Where `backend` comes from: saved here, or the default (`dotnet`). There is no environment variable for it." }
    BrowserSetting:
      type: object
      description: The browser that draws the motion graphics.
      required: [saved, found]
      properties:
        saved: { type: string, description: "The saved path, or empty (it is looked up in the PATH)." }
        found: { type: boolean, description: There is a browser that can be used now. }
        path: { type: string }
        version: { type: string }
        error: { type: string, description: "Why none can be used, and how to fix it." }
    MotionModelSetting:
      type: object
      description: The model that writes the pages of the motion graphics.
      required: [saved, default]
      properties:
        saved: { type: string, description: "The saved model, or empty." }
        default: { type: string, description: The one used if none is saved. }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, validation_failed, not_found, conflict, forbidden, internal_error, method_not_allowed, unauthorized, engine_not_running, content_not_allowed, describe_refused, describe_minor, unavailable, assist_refused, consent_required, no_model, model_not_allowed, too_many_calls, queue_full, too_many_attempts]
            message: { type: string }
            reason: { type: string }
            provider: { type: string, description: "Who refused the request (with `describe_refused`)." }
            alternatives:
              type: array
              description: "What it can be retried with (with `describe_refused`): other vision models of the same provider and other providers that have one."
              items:
                type: object
                required: [provider, name, model]
                properties:
                  provider: { type: string }
                  name: { type: string }
                  model: { type: string }
    GenerationRequest:
      type: object
      description: >-
        What is asked for. All fields are optional except that a `prompt` or a start image is needed.
        Without `option` the default is used; without `duration`, 5 s; without `aspect_ratio`, 16:9; without `quality`, `high`.
      properties:
        prompt: { type: string, description: "The text (up to 2000 characters). With a start image it describes the motion." }
        option: { type: string, description: "Identifier from `GET /api/generation/options`." }
        duration: { type: number, description: "Seconds of the scene (each option gives the range)." }
        aspect_ratio: { type: string, enum: ["16:9", "9:16", "1:1", "4:3", "3:4"] }
        quality: { type: string, enum: [draft, normal, high], description: "Scales the sides of the image and the clip: half, three quarters, full." }
        audio: { type: boolean, description: "Have the model write the sound (MiniMax H3 and LTX 2.3 only)." }
        adult: { type: boolean, description: "The label the client puts on the generation (like `adult` in a scenes.yaml). With `true` a server that hides adult content rejects it." }
        reuse_inputs_of: { type: string, description: "The identifier of another generation of the API whose input files (start image, end image, references, or the 3D scene of the option `blender`) are used without sending them again. `422` if input parts are also sent, if it does not exist or if it kept none; a `blender.description` sent with it takes the place of the reused scene." }
        blender:
          type: object
          description: "The 3D scene of the option `blender`: `description` is the JSON of a scene, checked like a hand-written one for the request's `duration` (`422` naming each fault by its place). Only that option takes it. A generation reports `blender: {}`: the description is one of its `inputs` (`kind: scene`)."
          properties:
            description: { type: object, additionalProperties: true }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, its own (for example `my-dashboard`): 1 to 32 lowercase letters, digits or hyphens. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created. It is saved in the project's `scenes.yaml` and in the run, and is used to group in the statistics and the metrics." }
    Generation:
      type: object
      required: [id, state, progress, request, client, run_id, clip_seconds, created_at, size_bytes, inputs]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none or if it predates this field)." }
        state: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer, description: "0 to 100." }
        request: { $ref: "#/components/schemas/GenerationRequest" }
        run_id: { type: string }
        clip_seconds: { type: number, description: "How long the clip the engine makes lasts; a longer duration repeats it." }
        estimate: { type: integer, description: "Seconds it takes on this machine." }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk (counted here and not in the per-project storage)." }
        video: { type: string, description: "The video's address, when done." }
        error: { type: string, description: "Why it failed." }
        inputs:
          type: array
          items: { $ref: "#/components/schemas/GenerationInput" }
          description: "The files it used, in the order they were sent: the start image first and then the others. A generation that predates the inputs gives only its start image; with none, the list is empty."
    GenerationInput:
      type: object
      required: [kind, name, address]
      properties:
        kind: { type: string, enum: [start_image, end_image, reference_image, reference_video, reference_audio, scene] }
        name: { type: string, description: "Its name in the generation project's `sources/`." }
        address: { type: string, description: "Read-only address it is downloaded from (a project artifact, with the same access as the video)." }
    MusicMotionCatalog:
      type: object
      required: [parts, characters, backgrounds, levels, styles, frame_rates, actions, fonts, font_stacks, font_files, modes, features]
      properties:
        parts: { type: array, items: { $ref: "#/components/schemas/MusicPart" } }
        characters: { type: array, items: { $ref: "#/components/schemas/MusicCharacter" } }
        backgrounds: { type: array, items: { $ref: "#/components/schemas/MusicBackground" } }
        levels: { type: array, items: { type: string }, description: "`simple`, `medium`, `advanced`." }
        styles: { type: array, items: { type: string }, description: "`typographic`, `illustrated`." }
        frame_rates: { type: array, items: { type: integer } }
        actions: { type: array, items: { type: string }, description: "A character's actions, in time with the beat." }
        fonts: { type: array, items: { type: string }, description: "The typefaces a design can use." }
        font_stacks: { type: object, additionalProperties: { type: string }, description: "The CSS font stack of each name in `fonts`, as the page of a piece sets it." }
        font_files:
          type: object
          description: "Which names in `fonts` are embedded in the pages as `data:` fonts: the six of the free pack (`inter`, `space-grotesk`, `jetbrains-mono`, `playfair-display`, `bebas-neue`, `fraunces`) and the old names that map to it (`grotesk` to Inter, `mono` to JetBrains Mono, `serif` to Fraunces, `heavy` to Bebas Neue; their old system stack stays as the fallback). `rounded` and `condensed` stay system stacks and are not here."
          additionalProperties:
            type: object
            properties:
              family: { type: string }
              weights: { type: array, items: { type: integer } }
              licence: { type: string, description: "`OFL-1.1` for the whole pack." }
        modes: { type: array, items: { type: string }, description: "`dark`, `light`." }
        features: { type: array, items: { type: string }, description: "What this server's scripts support beyond the base format: `animate` (keyframes on a parameter, see `MusicScriptPiece.animate`) and `layers` (lanes of parts over the pieces, see `MusicScript.layers`). A dashboard checks it before it saves a script that needs it. `svg` is not about scripts: it says `POST /api/assist/svg` exists. `review` says part drafts and pieces can be graded by the vision model (`review` on `POST /part-drafts` and `/scenes`, `POST /pieces/{id}/review`, the setting `music_motion.review_drafts`). `theme` says a design may carry `theme` and `transition_seconds`, the pack of fonts is embedded and the built-in `hud-chrome` and `grain` parts exist. `blender-motion` says a piece of a script can be a 3D scene (`MusicScriptPiece.blender`) with `POST /pieces/{id}/script/{piece}/blender`; `blender-models` says such a piece can place the 3D models (`.glb`) of its piece (`PUT|GET|DELETE /pieces/{id}/models`); `blender` is a different entry: it says the datasets can have 3D scenes. `scene` says scenes written for the verses of a piece exist: `scene` on `POST /part-drafts`, `verse: own`/`hit: own` in a part's manifest, `POST /pieces/{id}/scenes` and `include=scene`/`piece=` on the catalog." }
    MusicSceneBatch:
      type: object
      required: [state, done, total, drafts, brief_mode, started_at]
      description: "The last batch of scenes written for the script of a piece (`POST /pieces/{id}/scenes`)."
      properties:
        state: { type: string, enum: [writing, done, cancelled, failed] }
        done: { type: integer, description: "Drafts finished (ready or failed) so far." }
        total: { type: integer }
        drafts:
          type: array
          items:
            type: object
            required: [script_piece, state]
            properties:
              script_piece: { type: string }
              draft_id: { type: string, description: "The part draft (`GET /part-drafts/{id}`, with its preview); empty while pending." }
              state: { type: string, enum: [pending, writing, ready, failed, approved], description: "The draft's own state; `approved` when the draft is gone because it became a part." }
              error: { type: string }
              kept_previous: { type: boolean, description: "True when no answer passed the checks: the script piece keeps the scene it had; `problems` are the last ones the checks found." }
              repairs: { type: array, items: { $ref: "#/components/schemas/MusicDraftRepair" }, description: "What the program repaired in the draft's last answer before the checks." }
              problems: { type: array, items: { type: string } }
        earlier:
          type: array
          description: "Script pieces that kept their scene in an earlier batch and were not part of this one (same fields as `drafts`), so the piece still knows which scenes are older than the batches. A piece review names them first."
          items: { type: object, properties: { script_piece: { type: string }, draft_id: { type: string }, state: { type: string }, error: { type: string }, kept_previous: { type: boolean }, problems: { type: array, items: { type: string } }, repairs: { type: array, items: { $ref: "#/components/schemas/MusicDraftRepair" } } } }
        model: { type: string }
        provider: { type: string }
        brief_mode: { type: string, enum: [metaphor, literal] }
        review:
          type: object
          description: "What every draft of the batch was asked to be reviewed with."
          properties:
            min: { type: integer }
            attempts: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error: { type: string }
    MusicPieceReview:
      type: object
      required: [state, started_at, scenes]
      description: "The last review of a whole piece (`POST /pieces/{id}/review`)."
      properties:
        state: { type: string, enum: [running, done, failed] }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        model: { type: string }
        skipped: { type: array, items: { type: string }, description: "The script pieces the review left out because Blender draws them (a 3D scene is not a page to grade). `422` when every piece is one." }
        scenes:
          type: array
          items:
            type: object
            required: [script_piece, score, notes]
            properties:
              script_piece: { type: string }
              score: { type: integer }
              verdict: { type: string, enum: [pass, weak, fail] }
              notes: { type: array, items: { type: string } }
              error: { type: string }
        overall:
          type: object
          description: "The piece as a whole, from a contact sheet of one frame per scene: whether type, palette and frame are consistent and whether scenes repeat a metaphor."
          properties:
            score: { type: integer }
            notes: { type: array, items: { type: string } }
            repeated: { type: array, items: { type: array, items: { type: string } }, description: "Groups of script pieces that use the same metaphor." }
            pictures_alone: { type: string, enum: ["yes", "no"], description: "With every word covered, do the frames still tell a story a stranger can follow? Absent when the reviewer did not answer." }
            causes_next: { type: string, enum: ["yes", "no"], description: "Does each frame cause the next? Absent when the reviewer did not answer." }
            error: { type: string }
        error: { type: string }
    MusicPiecePreview:
      type: object
      required: [width, height, fps, scenes, replacements]
      properties:
        width: { type: integer }
        height: { type: integer }
        fps: { type: integer }
        scenes:
          type: array
          items:
            type: object
            required: [id, start, end, html, song]
            properties:
              id: { type: string }
              start: { type: number }
              end: { type: number }
              html: { type: string, description: "The page of the piece, wrapped for a sandboxed frame. Empty for a 3D piece." }
              song: { type: object, description: "The song map cut to the piece, as the renderer gives it to the page. `{}` for a 3D piece." }
              blender: { type: boolean, description: "The piece is a 3D scene drawn by Blender: it has no page. Ask for its frames with `GET /pieces/{id}/frame?t=` or `POST /pieces/{id}/script/{piece}/blender/frame`." }
        replacements:
          type: array
          items:
            type: object
            required: [piece, from, to]
            properties:
              piece: { type: string }
              from: { type: string }
              to: { type: string }
        notes: { type: array, items: { type: string }, description: "What the proposal did not use of what it was given: a reference with no rhythm sheet (analysed before shots existed: run its breakdown) or one that is no longer in the library." }
    ModelPack:
      type: object
      required: [id, name, author, licence, attribution, source, size_bytes, tags, state, models]
      properties:
        id: { type: string }
        name: { type: string }
        author: { type: string }
        licence: { type: string, description: "`CC0` for every pack of the list; for a pack the person imported, the text they gave." }
        attribution: { type: boolean, description: "Whether the licence asks for the author to be named." }
        source: { type: string, enum: [catalog, user, generated], description: "`generated` is the pack of the models that an engine made (`GET /api/models3d/engines`): created with the first one, removable like any pack, and an import over its id is `409`." }
        page: { type: string }
        version: { type: string }
        size_bytes: { type: integer }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        state: { type: string, enum: [available, installing, installed, failed] }
        error: { type: string, description: "Why a pack is `failed`." }
        progress:
          type: object
          description: "Only while the pack is `installing`: `done` is the bytes of the zip downloaded and `total` its size in bytes (the size the host announces, or the one in the list); it is not a count of files."
          properties: { done: { type: integer }, total: { type: integer } }
        models: { type: integer, description: "How many models it has when installed." }
        skipped:
          type: array
          description: "Files of the pack that were left out of the catalog and why."
          items:
            type: object
            properties: { file: { type: string }, reason: { type: string } }
    LibraryModel:
      type: object
      required: [id, pack, name, tags, clips, triangles, needs, licence, author, attribution]
      properties:
        id: { type: string, description: "`<pack>/<name>`, what `from` takes." }
        pack: { type: string }
        name: { type: string }
        tags: { type: array, items: { type: string } }
        clips: { type: array, items: { type: string }, description: "The animations the file has (possibly none)." }
        triangles: { type: integer }
        needs: { type: array, items: { type: string }, description: "The pictures the file refers to; the copy of a model brings them." }
        licence: { type: string, description: "For a generated model, its engine's." }
        author: { type: string }
        attribution: { type: boolean }
        prompt: { type: string, description: "Only for a generated model: the text it was made from (or the name of the picture)." }
        engine: { type: string, description: "Only for a generated model: `triposr` or `sf3d`." }
        engine_version: { type: string, description: "Only for a generated model: the engine's version (`triposr@<commit>`, or `triposr-net@<version>` / `sf3d-net@<version>` from the .NET services)." }
        generated_at: { type: string, format: date-time, description: "Only for a generated model." }
        source: { type: string, enum: [catalog, user, generated], description: "Where it comes from." }
        project: { type: string, description: "Only for a generated model made by a project or a generation: which one." }
        entry: { type: string, description: "Only with `project`: the name the entry gave the model (`-<n>` after the first variant)." }
        adult: { type: boolean, description: "Only for a generated model that was asked for as adult content." }
    ModelGenerationRequest:
      type: object
      description: "A prompt or a picture (the picture goes in a multipart request, as the `image` part), never both."
      properties:
        prompt: { type: string, maxLength: 1000 }
        engine: { type: string, enum: [triposr, sf3d], default: triposr }
        detail: { type: string, enum: [low, normal, high], default: normal }
        name: { type: string, description: "A plain lower-case name (letters, digits, `.`, `_`, `-`); made from the prompt when it is absent." }
        client: { type: string, description: "The dashboard that asks (see `client` in the generation API)." }
        adult: { type: boolean, description: "Marks the model as for people of 18 or older; `422` on a server that does not keep that content." }
    ModelGeneration:
      type: object
      required: [id, client, state, engine, detail, name, created_at, run]
      properties:
        id: { type: string, description: "`api-m3d-…`" }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none)." }
        state: { type: string, enum: [queued, running, done, failed, cancelled] }
        step: { type: string, enum: [picture, model], description: "Only while it runs." }
        prompt: { type: string, description: "Absent when the call brought a picture." }
        engine: { type: string, enum: [triposr, sf3d] }
        detail: { type: string, enum: [low, normal, high] }
        name: { type: string }
        model: { type: string, description: "`<pack>/<name>` of the model in the library, once it is `done`." }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        run: { type: string, description: "The run that makes it (`GET /api/runs/{id}`, `mode=models3d`)." }
    Model3DInstallPlan:
      type: object
      required: [engine, backend, parts, missing, bytes, licence, gated, path, free_bytes]
      properties:
        engine: { type: string }
        backend: { type: string, enum: [dotnet, docker], description: "The way the engine runs that the install is for." }
        parts: { type: array, items: { type: string, enum: [service, image, weights] }, description: "What the job would run, in order." }
        missing: { type: array, items: { type: string }, description: "Files of the weights folder that are not there." }
        bytes: { type: integer, format: int64, description: "About how much they take (0 when it was never measured)." }
        licence: { type: string, description: "The engine's licence, which the weights come under." }
        gated: { type: boolean, description: "The weights come from a repository whose licence the person's own Hugging Face account has to accept." }
        path: { type: string, description: "The weights folder." }
        free_bytes: { type: integer, format: int64 }
    Model3DInstall:
      type: object
      required: [id, engine, backend, parts, state, log, created_at]
      properties:
        id: { type: string }
        engine: { type: string }
        backend: { type: string, enum: [dotnet, docker] }
        parts: { type: array, items: { type: string, enum: [service, image, weights] } }
        part: { type: string, description: "The part that runs now." }
        state: { type: string, enum: [running, done, failed, cancelled] }
        error: { type: string, description: "The part that failed and the last lines of what it printed." }
        log: { type: array, items: { type: string }, description: "What the download printed (up to 200 lines), one per step." }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ModelCopy:
      type: object
      required: [name, pictures]
      properties:
        name: { type: string, description: "The `.glb` in the sources." }
        pictures: { type: array, items: { type: string }, description: "The pictures it needs, which are there too (`<pack>--<name>`)." }
    MusicLibraryCharacter:
      type: object
      required: [name, width, height, anchor, default_pose, default_expression, expressions, poses, source]
      properties:
        name: { type: string }
        width: { type: integer }
        height: { type: integer }
        anchor:
          type: object
          required: [x, y]
          properties: { x: { type: number }, y: { type: number } }
        default_pose: { type: string }
        default_expression: { type: string }
        expressions: { type: array, items: { type: string } }
        poses: { type: object, additionalProperties: { type: string }, description: "Pose name to its SVG." }
        source: { type: string, enum: [builtin, user] }
    MusicLibraryBackground:
      type: object
      required: [name, svg, source]
      properties:
        name: { type: string }
        svg: { type: string }
        source: { type: string, enum: [builtin, user] }
    HFBlock:
      type: object
      required: [name, title, width, height, duration, state, origin, thumbnail]
      properties:
        name: { type: string }
        title: { type: string }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        license: { type: string, description: "As the registry gives it (for example `Apache-2.0 AND MIT`); the licence files travel with the block." }
        width: { type: integer }
        height: { type: integer }
        duration: { type: number, description: "Seconds." }
        state: { type: string, enum: [ok, needs-files, needs-gpu, failed, unchecked] }
        problems: { type: array, items: { type: string }, description: "What the last run of the checks found." }
        edited: { type: boolean }
        kind: { type: string, enum: [component], description: "`component` for a component of the registry (a mountable piece drawn through its demo); absent for a block." }
        family: { type: string, description: "A component's family in the registry (`pointers`, `text-effects`, `transitions`...)." }
        profile: { type: string }
        runtime: { type: string, enum: [upstream, builtin], description: "What drew it in its last checks." }
        origin: { $ref: "#/components/schemas/HFOrigin" }
        thumbnail: { type: string, description: "Address of the thumbnail." }
    HFOrigin:
      type: object
      required: [url]
      properties:
        url: { type: string }
        version: { type: string }
        commit: { type: string }
        poster: { type: string, description: "The registry's own preview picture; an address kept as a reference, never fetched." }
        video: { type: string, description: "The registry's own preview video; kept as a reference, never fetched." }
    HFBlockList:
      type: object
      required: [blocks, total, states, libs_installed]
      properties:
        blocks: { type: array, items: { $ref: "#/components/schemas/HFBlock" } }
        total: { type: integer }
        states: { type: object, additionalProperties: { type: integer }, description: "How many of the blocks listed are in each state." }
        libs_installed: { type: boolean }
        fix: { type: string }
    HFBlockDetail:
      allOf:
        - { $ref: "#/components/schemas/HFBlock" }
        - type: object
          required: [html, files]
          properties:
            html: { type: string, description: "The main file of the block." }
            files: { type: array, items: { type: string } }
            licenses:
              type: array
              description: "The licence files that came with the block (a name with LICENSE, LICENCE or OFL in it), each cut at 64 KB. With `license` and `origin` they are the notice a screen shows next to the block."
              items:
                type: object
                required: [file, text]
                properties:
                  file: { type: string }
                  text: { type: string }
            variables: { type: array, items: { type: object }, description: "The variables the block declares, as the registry gives them (id, type, label, description, default, min, max, step...). `render` takes values for them by id." }
    HFPutBody:
      type: object
      required: [html]
      properties:
        html: { type: string, description: "The new main file." }
    HFPreviewBody:
      type: object
      required: [html]
      properties:
        html: { type: string }
        t: { type: number, minimum: 0 }
    HFImportBody:
      type: object
      required: [dir]
      properties:
        dir: { type: string, description: "Absolute path, on the server, of the registry/blocks folder of a HyperFrames clone." }
        components_dir: { type: string, description: "Absolute path of the registry/components folder of the same clone; when given the components are imported too (as `kind: component`)." }
        only: { type: array, items: { type: string }, description: "Only these blocks." }
        force: { type: boolean }
        check: { type: boolean, description: "Run the minimum checks on what is imported (default true)." }
    HFImportAnswer:
      type: object
      required: [imported]
      properties:
        imported:
          type: array
          items:
            type: object
            required: [name, written]
            properties:
              name: { type: string }
              written: { type: boolean }
              skipped: { type: string }
              error: { type: string }
        report:
          type: object
          properties:
            total: { type: integer }
            by_state: { type: object, additionalProperties: { type: integer } }
            lines:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  state: { type: string }
                  problems: { type: array, items: { type: string } }
    HFCheckAnswer:
      type: object
      required: [block, checks]
      properties:
        block: { $ref: "#/components/schemas/HFBlock" }
        checks:
          type: object
          required: [ok, at]
          properties:
            ok: { type: boolean }
            problems: { type: array, items: { type: string } }
            warnings: { type: array, items: { type: string } }
            at: { type: string, format: date-time }
            needs_gpu: { type: boolean }
            missing_files: { type: array, items: { type: string } }
    HFRenderBody:
      type: object
      properties:
        duration: { type: number, exclusiveMinimum: 0, maximum: 60, description: "Seconds; the block's own by default." }
        fps: { type: integer, minimum: 1, maximum: 60, description: "30 by default." }
        variables: { type: object, description: "Values for the variables the block declares, by id." }
    HFClip:
      type: object
      required: [block, file, path, url, seconds, fps, frames, width, height]
      properties:
        block: { type: string }
        file: { type: string }
        path: { type: string, description: "Where the file is on the server." }
        url: { type: string }
        seconds: { type: number }
        fps: { type: integer }
        frames: { type: integer }
        width: { type: integer }
        height: { type: integer }
        problems: { type: array, items: { type: string }, description: "What the page reported while it was drawn; the video is written even then." }
    MusicUserPart:
      type: object
      required: [name, source, manifest, fragment]
      description: "A part of the catalog as it is carried to another server or drawn in a browser."
      properties:
        name: { type: string }
        source: { type: string, enum: [user, builtin] }
        origin: { $ref: "#/components/schemas/MusicPartOrigin" }
        manifest: { type: object, description: "The content of manifest.json (name, description, version, levels, cost_ms, manual, params, and `verse`, `hit` and `scene` when it has them)." }
        fragment: { type: string, description: "The content of part.html." }
    MusicDraftRepair:
      type: object
      required: [kind, count]
      properties:
        kind: { type: string, enum: [colour, font, clock, typo, size, cut, overlap], description: "What was repaired: a colour literal turned into the design's variables, a font of its own turned into var(--display), Math.random() turned into a seeded generator." }
        count: { type: integer, description: "In how many places." }
    MusicPart:
      type: object
      required: [name, description, levels, cost_ms, source, params]
      properties:
        name: { type: string }
        description: { type: string }
        levels: { type: array, items: { type: string } }
        cost_ms: { type: integer, description: "Milliseconds it costs to draw a frame at 1280x720 (measured)." }
        manual: { type: boolean, description: "Only used if the script names it (the fixed rule does not choose it)." }
        fixed_copy: { type: boolean, description: "The part draws example text of its own (a name, a button label, a title): the fixed rule of the script and the level substitution do not choose it. Worked out from a text parameter with a default or a block converted from HyperFrames, unless the manifest sets `fixed_copy` itself." }
        source: { type: string, enum: [builtin, user] }
        origin: { $ref: "#/components/schemas/MusicPartOrigin" }
        verse: { type: string, enum: [page, own], description: "Who draws the lyric when this is the main part of a piece: `page` (the default, also when absent) is the page's own layer, `own` is the part itself, which reads `window.__scene.lines`; the page then leaves `#verse` out." }
        hit: { type: string, enum: [page, own], description: "The same for the word hit (`#hit`/`#hitbg`). An extra part cannot declare `own` for either (`PUT /script` refuses it)." }
        timeline: { type: boolean, description: "True when the part animates with a registered GSAP timeline (`window.__timelines`). The server draws it with the GSAP file installed by `scripts/get-gsap.sh`; a dashboard that cannot run a timeline previews it from the server (`previewPages`)." }
        pictures: { type: integer, description: "How many pictures of an imported HyperFrames block the part carries inside (`data:` URLs); they keep their own colours and the design does not recolour them. Absent when none." }
        scene:
          type: object
          description: "Set on a scene written for one script piece of one piece; such parts are listed only with `include=scene` or `piece=`, read back with `GET /parts/{name}`, deleted with their piece and refused as the part of a script piece of another piece (`422`)."
          properties:
            piece: { type: string }
            script_piece: { type: string }
        params: { type: array, items: { $ref: "#/components/schemas/MusicParam" } }
    MusicPartOrigin:
      type: object
      description: "Where a part of the user came from: the reference video that inspired it, or the HyperFrames block it was converted from (`source`). Kept in `origin.json` beside the part when its draft is approved; absent for the parts that come with the program and for the ones written by hand."
      required: [approved_at]
      properties:
        reference_id: { type: string, description: "The reference of the library (it may have been deleted since)." }
        title: { type: string, description: "The title of the reference." }
        video: { type: string, description: "The address of the video." }
        frame: { type: string, description: "The key frame the draft was inspired by, when it was." }
        learned: { type: boolean, description: "True when a learning from a reference proposed the part." }
        learning_id: { type: string }
        approved_at: { type: string, format: date-time }
        source: { type: string, description: "`hyperframes` when the part is a block of HyperFrames converted by `veritmo parts import-hyperframes` (the part is named `hf-<block>`); absent otherwise." }
        block: { type: string, description: "The name of the block it was made from." }
        version: { type: string, description: "The version of HyperFrames the block came from, when it is known." }
        licence: { type: string, description: "The licence of the block (`Apache-2.0` for HyperFrames)." }
        url: { type: string, description: "Where the block comes from." }
        files:
          type: array
          description: "The pictures of the block embedded in the part as `data:` URLs (the block's `assets/`), when it has any."
          items:
            type: object
            required: [name, kind, bytes]
            properties:
              name: { type: string }
              kind: { type: string, enum: [svg, png, jpeg, webp] }
              bytes: { type: integer }
    MusicParam:
      type: object
      required: [name, type, default]
      properties:
        name: { type: string }
        type: { type: string, enum: [string, int, number, bool, enum] }
        description: { type: string }
        default: { type: string, description: "The default value written as text (`3`, `true`, `allow`); `type` says how to read it." }
        min: { type: number }
        max: { type: number }
        max_length: { type: integer }
        options: { type: array, items: { type: string } }
        animatable: { type: boolean, description: "A script may change this parameter over a piece with `animate`. The part reads it on every frame; a parameter written into the page as text is never animatable." }
    MusicCharacter:
      type: object
      required: [name, description, poses, expressions, source]
      properties:
        name: { type: string }
        description: { type: string }
        poses: { type: array, items: { type: string } }
        expressions: { type: array, items: { type: string } }
        source: { type: string, enum: [builtin, user] }
    MusicBackground:
      type: object
      required: [name, description, source]
      properties:
        name: { type: string }
        description: { type: string }
        source: { type: string, enum: [builtin, user] }
    MusicLibraryItemPut:
      type: object
      required: [manifest]
      description: A character or a background of the user's.
      properties:
        manifest: { type: object, description: "The manifest as the library reads it from a folder (name, description, version and, for a character, width, height, anchor, poses, expressions and the defaults; for a background, file)." }
        files: { type: object, description: "The text of each drawing by file name; every file must be named by the manifest.", additionalProperties: { type: string } }
    MusicPiecePatch:
      type: object
      description: The details of a piece that can be changed; every field is optional.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        client: { type: string, nullable: true }
        prompt: { type: string, nullable: true, maxLength: 2000 }
        world: { type: string, nullable: true }
        device: { type: string, nullable: true }
        hook: { type: string, nullable: true }
    MusicPieceRequest:
      type: object
      required: [project, track_id, variant]
      properties:
        project: { type: string, description: "The music project that has the song." }
        track_id: { type: string }
        variant: { type: integer, description: "The song's version (from 0)." }
        style: { type: string, enum: [typographic, illustrated] }
        level: { type: string, enum: [simple, medium, advanced] }
        fps: { type: integer, enum: [24, 30, 60] }
        resolution: { type: string, description: "For example `1280x720`." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request (as in `GenerationRequest`)." }
        design: { $ref: "#/components/schemas/MusicDesign" }
        preset: { type: string, description: "Identifier of a style (`/api/music-motion/presets`): the piece's design starts as the style's (that of `design`, if sent, takes precedence) and the fixed rule uses its parts and its rhythm. `422` if the style does not exist (nothing is created). Without `preset` the piece is made as usual." }
        prompt: { type: string, maxLength: 2000, description: "The person's direction for the video: it is kept with the piece and read by the proposals that send no prompt of their own. `422` above 2000 characters." }
        transcribe: { type: boolean, description: "Hear when each word is sung (Whisper, on the CPU) instead of distributing the lyrics across the sections; `false` by default. If it cannot be done (no Whisper, no memory, a run in progress) the piece is created anyway with estimated timings and `words_note` says why." }
        world: { type: string, maxLength: 300, description: "The storyline of a plan (`POST /api/assist/plan` answers `world`, `device` and `hook`): where the video happens, one line. Kept with the piece; the design proposal and the scene writer read it so that the scenes belong to one film." }
        device: { type: string, description: "The storyline's device: one of `type carries the argument`, `a character does the work`, `one object across the song`, `life before and after`, `a number lands`, `the result first`, `a question the song answers`. `422` for any other. Kept with the piece and read by the design and script proposals and the scene writer." }
        hook: { type: string, maxLength: 300, description: "The storyline's hook, what the first two seconds show: read by the script proposal and by the scene writer for the first piece." }
        reference: { type: string, description: "The id of a `ready` reference of the library (`/api/music-motion/references`): its rhythm sheet reaches the design and the script proposals (the fixed rule aims the pieces of each third of the song at its median shot of that third), and its shots reach the scene writer. It is kept with the piece. `422` unless it exists and is ready (nothing is created)." }
        separate: { $ref: "#/components/schemas/MusicSeparate" }
    MusicSeparate:
      description: >-
        Only with `transcribe`: whether the voice is separated from the song before its words are heard. `"auto"` (the default) separates it when the voice
        separator (`demucs`, installed with `bash scripts/get-demucs.sh --build`) is installed and fits in memory, and hears the mix, saying why in
        `words_note`, when it is not; `true` always separates it and answers `503` with the reason when it cannot (nothing is created); `false` never
        uses it. Measured on ten distinct songs, separating the voice and moving the heard words onto its attacks lifted the words within 50 ms of an
        attack by 33.7 points on the median song at 1.22 times the length of the song (see `docs/MUSIC_MODE_MOTION.md`, "Timing the words"). The
        separated voice (16 kHz, mono) is kept with the piece as `vocals-16k.wav` and used again when the words are heard again; a voice that is heard
        in less than 5 % of the song counts as none and the mix is heard instead. Any other value is `422`.
      oneOf:
        - { type: boolean }
        - { type: string, enum: ["auto", "true", "false"] }
    MusicWordsRequest:
      type: object
      required: [words]
      properties:
        words:
          type: array
          minItems: 1
          items:
            type: object
            required: [index, start]
            properties:
              index: { type: integer, description: "The position of the word in `song_map.words`." }
              start: { type: number, description: "Where the word starts, in seconds of the song." }
              end: { type: number, description: "Where it ends; without it the word keeps its length." }
    PartDraft:
      type: object
      required: [id, state, request, with_picture, attempts, problems, created_at, preview]
      properties:
        id: { type: string }
        state: { type: string, enum: [writing, ready, failed] }
        request: { type: string, description: "What the part has to do." }
        with_picture: { type: boolean, description: "Whether it was requested with an image." }
        source: { type: string, description: "Where the image came from: `upload` or `reference:<id>/<frame>`; absent without an image." }
        description: { type: string, description: "The look of the image, written by the vision model." }
        attempts: { type: integer, description: "Attempts the assistant made on this job (up to 3)." }
        repairs: { type: array, items: { $ref: "#/components/schemas/MusicDraftRepair" }, description: "A scene draft: what the program repaired in the last answer before the checks (colour literals, a font of its own, Math.random()). Absent when nothing was repaired." }
        name: { type: string, description: "The part's name, when it is `ready` (for a scene, decided by the server as soon as it starts)." }
        scene:
          type: object
          description: "Set on a draft asked for with `scene`."
          properties:
            piece: { type: string }
            script_piece: { type: string }
        brief: { type: string, description: "The idea the scene was asked for with." }
        review_ask:
          type: object
          description: "What the request asked of the review (absent: none); a retry keeps it."
          properties:
            min: { type: integer }
            attempts: { type: integer }
        review: { $ref: "#/components/schemas/PartDraftReview" }
        problems: { type: array, items: { type: string }, description: "What failed on the last attempt." }
        warnings: { type: array, items: { type: string }, description: "What the checks let pass but the person should know, on a `ready` draft: an `{{asset:name}}` slot the theme of the design has no drawing for (the slot is empty)." }
        error: { type: string, description: "Why it is `failed`." }
        created_at: { type: string, format: date-time }
        preview: { type: array, items: { type: string }, description: "Names of the preview frames." }
        manifest: { type: string, description: "The text of manifest.json (in the read of one)." }
        fragment: { type: string, description: "The text of part.html (in the read of one)." }
        origin: { type: string, enum: [learned], description: "`learned` when a learning from a reference proposed it; absent when it was asked for by hand." }
        learning_id: { type: string, description: "The learning that proposed it (with `origin` `learned`)." }
        model: { type: string, description: "The model the person chose to write it; absent when the routing's own was used. A retry keeps it." }
        provider: { type: string, description: "The saved provider the person chose to write it instead of the routing; absent when the routing's own was used. A retry keeps it." }
        replaces: { type: string, description: "The name of the part whose text the assistant is changing (a draft asked for with `request`, `manifest` and `fragment`); that name may be kept." }
        reference_id: { type: string, description: "The reference whose video inspired it (it may have been deleted since)." }
        video_title: { type: string, description: "The title of that reference." }
        video: { type: string, description: "The address of that video." }
    PartDraftReview:
      type: object
      description: "The grade of a draft by the vision model against the scene rubric (`docs/MUSIC_MODE_MOTION.md` prints it; the writer reads the same one). The model sees the draft's frames tiled in one picture and answers, in one call, a 0 to 3 score and a note for each of the six criteria; the score is their sum scaled to 10 and rounded, not taken from the model. Reviews made before 2026-11-15 scored each criterion from 0 to 2."
      properties:
        score: { type: integer, minimum: 0, maximum: 10 }
        frames: { type: array, items: { type: string }, description: "The sentences the reviewer wrote first, one per frame, as a stranger would say what is there, naming every object. Absent when the reviewer gave none." }
        criteria:
          type: array
          description: "What the reviewer said of each criterion of the rubric. The metaphor's score is at most 1 when a frame's sentence says the object could not be told (the whole word shape, shapes, bars, blob, abstract or unclear) and the world of the video does not name it."
          items:
            type: object
            required: [id, score]
            properties:
              id: { type: string, enum: [metaphor, lyric, accent, motion, frame, people] }
              score: { type: integer, minimum: 0, maximum: 3 }
              note: { type: string }
        verdict: { type: string, enum: [pass, weak, fail], description: "`pass` from 7, `weak` 5 and 6, `fail` under 5; absent when `error` is set." }
        notes: { type: array, maxItems: 5, items: { type: string, maxLength: 200 }, description: "Concrete fixes, up to five." }
        model: { type: string }
        attempts:
          type: array
          description: "Every version that was reviewed, in order, when the draft was rewritten from its review: the climb. The version left `ready` is the best one."
          items:
            type: object
            properties:
              score: { type: integer }
              verdict: { type: string }
              notes: { type: array, items: { type: string } }
        error: { type: string, description: "Why there is no grade (no vision model, it failed or answered nothing readable); the draft is still `ready`." }
    PartDraftRequest:
      type: object
      properties:
        request: { type: string, description: "Between 1 and 500 characters. Required, except with `scene` (then optional: it is the idea when there is no `scene.brief`)." }
        review:
          description: "Asks for the draft to be graded by the vision model of the `check` task after its previews are drawn: `true` (a review), `false` (none, even if the setting `music_motion.review_drafts` is on) or `{min, attempts}`: with `min` (1 to 10) a draft that scores under it is rewritten with the reviewer's notes as the problem, up to `attempts` times (2 by default, at most 3); the best version is left `ready`. A form field `review` (and `review_min`, `review_attempts`) in multipart. Without a vision model, a consent or a provider problem on the `check` route it is refused before anything is created (`503`, `400 consent_required`...); `422` for `min` or `attempts` out of range."
          oneOf:
            - { type: boolean }
            - type: object
              properties:
                min: { type: integer, minimum: 0, maximum: 10 }
                attempts: { type: integer, minimum: 0, maximum: 3 }
        scene:
          type: object
          required: [piece, script_piece]
          description: "Asks for a scene written for one script piece of one piece (JSON body only): the server builds the input from the saved piece."
          properties:
            piece: { type: string, description: "A music-motion piece id." }
            script_piece: { type: string, description: "The id of a script piece of that piece's script (ids are kept when the script is saved)." }
            brief: { type: string, maxLength: 500, description: "The idea or metaphor to draw; empty lets the writer choose." }
        reference_id: { type: string, description: "A reference from the library, to use one of its frames." }
        frame: { type: string, description: "One of that reference's `analysis.frames`." }
        manifest: { type: string, description: "With `fragment`, instead of `request`: makes the draft from these files with no assistant." }
        fragment: { type: string }
        model: { type: string, description: "An installed model (see `GET /api/assist/models`) that writes the part; `422` if it is not installed. Without it, the routing's own." }
        provider: { type: string, description: "The id of a saved provider (`GET /api/providers`) that writes the part instead of the routing, for this draft only; `model` then names one of its models. `400 consent_required` if it is remote and not consented, `400` if unknown." }
    PartDraftPut:
      type: object
      required: [manifest, fragment]
      properties:
        manifest: { type: string }
        fragment: { type: string }
    MotionColour:
      type: object
      required: [hex, share]
      properties:
        hex: { type: string, description: "Color as #rrggbb." }
        share: { type: number, description: "Share of the pixels it covers, 0 to 1." }
    MotionAnalysis:
      type: object
      required: [duration, fps, width, height, frames, colours, thirds, cuts, mean_shot]
      properties:
        duration: { type: number, description: "Seconds." }
        fps: { type: number }
        width: { type: integer }
        height: { type: integer }
        frames: { type: array, items: { type: string }, description: "Names of the key frames (between 12 and 24 when possible), in order." }
        colours: { type: array, items: { $ref: "#/components/schemas/MotionColour" }, description: "The five dominant colors of the whole video." }
        thirds: { type: array, items: { type: array, items: { $ref: "#/components/schemas/MotionColour" } }, description: "Those of each third of the video." }
        cuts: { type: integer, description: "Shot changes." }
        mean_shot: { type: number, description: "Mean duration of a shot, in seconds." }
        tempo: { type: number, description: "Estimated tempo of the audio (bpm); absent without sound or without a clear beat." }
        key: { type: string, description: "Estimated key of the audio; absent without sound or without a clear key." }
        description: { type: string, description: "The look of the video, written by the vision model; absent if there is no model." }
        description_note: { type: string, description: "Why there is no description." }
        shots: { type: array, items: { $ref: "#/components/schemas/MotionShot" }, description: "The shots of the video: their boundaries are the hard cuts found with a scene-change filter and the content changes found by comparing small grey pictures twice a second (a word swapped on the same background), shots under 0.4 s merged into the one before, at most 600. Absent on a reference analysed before shots existed, until its breakdown is run." }
        rhythm: { $ref: "#/components/schemas/MotionRhythm" }
        rhythm_text: { type: string, description: "The rhythm sheet as one short paragraph, the same text for the same sheet; it is what the proposals read." }
        breakdown_state: { type: string, enum: [pending, reading, done, skipped, failed], description: "Where the reading of the shots by the vision model is. `skipped` (with the reason in `breakdown_note`) when no model is available, `failed` when a minor appeared, the model declined or something broke." }
        breakdown_note: { type: string, description: "Why the reading was skipped or failed." }
    MotionShot:
      type: object
      required: [index, start, end, motion]
      properties:
        index: { type: integer }
        start: { type: number, description: "Seconds from the start of the video." }
        end: { type: number }
        motion: { type: number, description: "How much the picture moves in the shot, from 0 (still) to 1; under 0.02 counts as static." }
        kind: { type: string, enum: [cut, change], description: "How the shot starts: `cut` (a hard cut) or `change` (the picture changed without a cut, a word swapped on the same ground). Absent for the first shot and on shots measured before the kinds existed (read as `cut`)." }
        colour: { type: string, description: "Its dominant colour (#rrggbb)." }
        beat_cut: { type: boolean, description: "Whether the boundary that starts the shot falls within 60 ms of a beat of the grid at the sheet's `beat_phase`; absent for the first shot and when the audio has no clear tempo." }
        read: { $ref: "#/components/schemas/MotionShotReading" }
    MotionShotReading:
      type: object
      required: [subject, text, text_size, entrance, camera]
      description: "What the vision model saw in a shot (up to 40 shots are read). `subject` is `unknown` when it could not say."
      properties:
        subject: { type: string, enum: [typography, figure, chart, ui, photo, abstract, empty, unknown] }
        text: { type: string, enum: [none, word, line, block, unknown] }
        text_size: { type: string, enum: [small, medium, huge, unknown] }
        entrance: { type: string, enum: [cut, fade, slide, scale, letter, word, unknown] }
        camera: { type: string, enum: [static, zoom, pan, shake, unknown] }
        note: { type: string, description: "Why the reading is unknown." }
    MotionRhythm:
      type: object
      required: [cuts_per_minute, longest_shot, median_shot, median_shot_by_third, static_share]
      description: "The sheet made from the shots."
      properties:
        cuts_per_minute: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: "Shot boundaries (hard cuts and content changes) per minute in each third of the video." }
        changes_per_minute: { type: array, minItems: 3, maxItems: 3, items: { type: number }, description: "How many of those boundaries are content changes, per minute in each third." }
        hard_cut_share: { type: number, description: "The share of the boundaries that are hard cuts: low for a typographic video, high for a live-action one." }
        first_cut: { type: number, description: "Seconds; absent when the video has no cut." }
        burst: { $ref: "#/components/schemas/MotionBurst" }
        hold: { $ref: "#/components/schemas/MotionHold" }
        longest_shot: { type: number }
        median_shot: { type: number }
        median_shot_by_third: { type: array, minItems: 3, maxItems: 3, items: { type: number } }
        beat_cut_share: { type: number, description: "The share of the boundaries on the beat, among those whose beat is known; absent without a tempo. Chance is about 0.3." }
        beat_phase: { type: number, enum: [0.25, 0.5, 0.75], description: "How far, in beats, the grid `beat_cut_share` is measured against sits from the tracked one: chosen among 0, a quarter, a half and three quarters as the one that puts most boundaries on the beat, only with at least 8 boundaries in the tracked span. Absent when it is the tracked grid." }
        static_share: { type: number }
        text_led_share: { type: number, description: "Only when the shots were read: the share of the read shots made of text filling the frame." }
        entrances: { type: object, additionalProperties: { type: integer }, description: "Only when read: how many shots had the text enter each way." }
        subjects: { type: object, additionalProperties: { type: integer }, description: "Only when read: how many shots showed each subject." }
    MotionBurst:
      type: object
      required: [start, end, cuts]
      description: "The window of 10 seconds with most cuts; absent with fewer than two cuts."
      properties:
        start: { type: number }
        end: { type: number }
        cuts: { type: integer }
    MotionHold:
      type: object
      required: [start, end]
      description: "The longest shot after the first third."
      properties:
        start: { type: number }
        end: { type: number }
    MotionBreakdownRequest:
      type: object
      properties:
        read: { type: boolean, description: "Whether the vision model reads the shots after they are found; `true` by default." }
    MotionReference:
      type: object
      required: [id, title, tags, state, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
        source: { type: string, description: "The YouTube address; absent on an uploaded video." }
        state: { type: string, enum: [analysing, ready, failed] }
        error: { type: string, description: "The reason when `state` is `failed`." }
        created_at: { type: string, format: date-time }
        analysis: { $ref: "#/components/schemas/MotionAnalysis" }
    MotionReferenceRequest:
      type: object
      properties:
        url: { type: string, description: "Address of a YouTube video." }
        title: { type: string, description: "Up to 120 characters; by default the video's title." }
        notes: { type: string, description: "Up to 2000 characters." }
        tags: { type: array, items: { type: string }, description: "Up to 10 tags of up to 40 characters." }
    MotionReferencePatch:
      type: object
      properties:
        title: { type: string }
        notes: { type: string }
        tags: { type: array, items: { type: string } }
    MotionPreset:
      type: object
      required: [id, name, created_at, design, rhythm, parts, adjustments]
      properties:
        id: { type: string }
        name: { type: string }
        reference_id: { type: string, description: "The reference it came from (it may no longer exist)." }
        created_at: { type: string, format: date-time }
        design: { $ref: "#/components/schemas/MusicDesign" }
        rhythm: { type: number, description: "How long a script piece lasts, in seconds (between 2 and 15)." }
        parts: { type: array, items: { type: string }, description: "Catalog parts that suit it; empty means all the usual ones." }
        adjustments: { type: array, items: { type: string }, description: "What had to be changed in the video's colors for the design to be valid." }
        origin: { type: string, enum: [learned], description: "`learned` when a learning from a reference kept it; absent when it was made by hand." }
    LearnRequest:
      type: object
      properties:
        strictness: { type: string, enum: [low, normal, high], description: "How far from what exists a proposal has to be to count as new. `normal` by default." }
    Learning:
      type: object
      required: [id, reference_id, state, strictness, created_at, styles, part_drafts, discarded, skipped]
      properties:
        id: { type: string }
        reference_id: { type: string }
        state: { type: string, enum: [running, ready, failed] }
        reason: { type: string, description: "Why it is `failed`." }
        strictness: { type: string, enum: [low, normal, high] }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        styles: { type: array, items: { $ref: "#/components/schemas/LearnedItem" }, description: "The styles it kept (they are in `GET /api/music-motion/presets`)." }
        part_drafts: { type: array, items: { $ref: "#/components/schemas/LearnedItem" }, description: "The drafts of parts it made (they are in `GET /api/music-motion/part-drafts` until approved)." }
        discarded: { type: array, items: { $ref: "#/components/schemas/LearnDiscarded" }, description: "What it did not make because it is too similar to what exists." }
        skipped: { type: array, items: { $ref: "#/components/schemas/LearnSkipped" }, description: "What it could not do and why (what is missing)." }
    LearnedItem:
      type: object
      required: [id, name, novel, state]
      properties:
        id: { type: string, description: "The id of the style or of the draft." }
        name: { type: string }
        novel: { type: boolean }
        similar_to: { $ref: "#/components/schemas/LearnSimilar" }
        state: { type: string, description: "`ready` for a style; the state of the draft (`writing`, `ready`, `failed`) for a part; `gone` when it no longer exists." }
        reason: { type: string, description: "Why a draft is `failed`." }
    LearnSimilar:
      type: object
      required: [kind, name, distance, reason]
      properties:
        kind: { type: string, enum: [style, part, draft], description: "A style, a part of the catalog or a draft." }
        id: { type: string }
        name: { type: string }
        distance: { type: number, description: "From 0 (the same) to 1 (nothing in common)." }
        reason: { type: string }
    LearnDiscarded:
      type: object
      required: [kind, name, novel, similar_to, reason]
      properties:
        kind: { type: string, enum: [style, part] }
        name: { type: string }
        idea: { type: string, description: "The sentence of a part idea." }
        novel: { type: boolean, description: "Always false here." }
        similar_to: { $ref: "#/components/schemas/LearnSimilar" }
        reason: { type: string }
    LearnSkipped:
      type: object
      required: [what, reason]
      properties:
        what: { type: string, description: "`style`, `parts` or `part <name>`." }
        reason: { type: string }
    MotionPresetRequest:
      type: object
      properties:
        reference_id: { type: string }
        name: { type: string, description: "By default, the reference's title." }
        provider: { type: string, description: "Changes, for this call only, the assistant provider that chooses the parts." }
        design: { $ref: "#/components/schemas/MusicDesign", description: "Without `reference_id`: the design of the style (validated as a whole design)." }
        rhythm: { type: number, description: "Without `reference_id`: how long a piece lasts, in seconds (2 to 15)." }
        parts: { type: array, items: { type: string }, description: "Without `reference_id`: catalog parts, without repeats, at most 8." }
    MotionPresetPut:
      type: object
      required: [name, design, rhythm, parts]
      properties:
        name: { type: string }
        design: { $ref: "#/components/schemas/MusicDesign" }
        rhythm: { type: number }
        parts: { type: array, items: { type: string } }
    MusicPiece:
      type: object
      required: [id, state, progress, source, style, level, fps, width, height, client, created_at, size_bytes]
      properties:
        id: { type: string }
        state: { type: string, enum: [draft, queued, running, done, failed] }
        progress: { type: integer, description: "0 to 100." }
        title: { type: string }
        source:
          type: object
          required: [project, track_id, variant]
          properties:
            project: { type: string }
            track_id: { type: string }
            variant: { type: integer }
        style: { type: string }
        level: { type: string }
        fps: { type: integer }
        width: { type: integer }
        height: { type: integer }
        client: { type: string }
        created_at: { type: string, format: date-time }
        run_id: { type: string }
        estimate: { $ref: "#/components/schemas/MusicEstimate" }
        video: { type: string, description: "The video's address, when done." }
        error: { type: string }
        size_bytes: { type: integer, format: int64 }
        design: { $ref: "#/components/schemas/MusicDesignStored" }
        script: { $ref: "#/components/schemas/MusicScript" }
        preset: { type: string, description: "The style the piece started from, if it was made with one (later changes to the style do not touch it)." }
        script_source: { type: string, enum: [assistant, fallback, user] }
        fallback_pieces: { type: array, items: { type: string }, description: "For a fallback script: the pieces that still use a part the fixed rule chose (no scene of their own). Absent for any other script." }
        prompt: { type: string, description: "The direction the proposals read when they send none." }
        world: { type: string, description: "The storyline of the plan the piece was made from: where the video happens (absent for a piece made without a plan; the first scene written for it may fill it)." }
        device: { type: string, description: "The storyline's device (absent without a plan)." }
        hook: { type: string, description: "The storyline's hook (absent without a plan)." }
        reference: { type: string, description: "The reference the piece follows the rhythm of, when it names one." }
        proposal: { $ref: "#/components/schemas/MusicProposal" }
        scenes: { $ref: "#/components/schemas/MusicSceneBatch" }
        review: { $ref: "#/components/schemas/MusicPieceReview" }
        song_map: { $ref: "#/components/schemas/SongMap" }
        words_note: { type: string, description: "Why the words were not heard when they were requested, how they were timed when it was not by token (a model with no timestamp preset), and why the voice was not separated or a kept stem was not used, and, when the separated voice matched fewer than 75 % of the written words and the mix was kept because it matched more, both counts (only in the response that causes it)." }
        script_warning: { type: string, description: "The user edited the script and it was kept, but it may need adjusting to the new sections (only in the `transcribe` response)." }
    MusicProposal:
      type: object
      required: [state, what, started_at]
      description: "The last proposal written in the background (`what: all` or `async: true`). One that was running when the server stopped reads as `failed`."
      properties:
        state: { type: string, enum: [waiting, writing, done, failed], description: "`waiting` while a run is queued or active and the assistant needs its memory (up to 15 minutes, then it falls back with the reason); `writing`; `done`; `failed`." }
        what: { type: string, enum: [design, script, all] }
        model: { type: string }
        provider: { type: string, description: "The provider asked for on the request; absent when the routing's own wrote." }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        design_source: { type: string, enum: [assistant, fallback] }
        design_fallback_reason: { type: string }
        design_note: { type: string, description: "What the program changed in the assistant's design: when the assistant's second answer is refused only for the accent's contrast, the accent's lightness is moved (hue and chroma kept) to reach 3:1 on every mode in use instead of asking a third time, e.g. `accent #d48806 adjusted to #8f5a00 for 3:1 contrast on the light mode`. Absent for nothing changed." }
        script_source: { type: string, enum: [assistant, fallback] }
        script_fallback_reason: { type: string }
        script_fallback_pieces: { type: array, items: { type: string }, description: "The pieces of a fallback script, all of them." }
        notes: { type: array, items: { type: string }, description: "As in the synchronous answer." }
        error: { type: string }
    MusicEstimate:
      type: object
      required: [seconds, estimate, frames, corrected, factor]
      properties:
        seconds: { type: number, description: "Forecast of how long the drawing takes on this machine." }
        estimate: { type: boolean, description: "Always `true`: it is a forecast, not a promise." }
        frames: { type: integer }
        corrected: { type: boolean, description: "Whether it was scaled with how long the previous drawings took." }
        factor: { type: number }
    MusicDesign:
      type: object
      required: [dark, light, accent, display, body, default_mode, concept]
      properties:
        dark: { type: string, description: "Dark hexadecimal color: the background of a dark section and the text of a light one." }
        light: { type: string, description: "Light hexadecimal color." }
        accent: { type: string, description: "Paints each verse's keyword; minimum 3:1 contrast with the background of the modes used." }
        display: { type: string, description: "Typeface of the large words (one of the catalog's `fonts`)." }
        body: { type: string }
        default_mode: { type: string, enum: [dark, light] }
        modes: { type: object, additionalProperties: { type: string, enum: [dark, light] }, description: "The mode of each section tag, in lowercase." }
        concept: { type: string, description: "The visual idea each scene returns to (up to 200 characters)." }
        verse_groups: { type: boolean, description: "`false` shows every line of the verse whole. By default a line of more than six timed words is shown in groups, one at a time: 2 to 3 words in a section of the top third of energy, 3 to 5 in the middle third, 4 to 6 in the bottom third, breaking at punctuation or at a pause of 150 ms or more; a group opens 0.2 s before its first word and is removed 0.12 s after its last, or when the next opens." }
        verse_style: { type: string, enum: [plain, highlight, karaoke, glow], description: "How the verse is marked as it is sung: `plain` (the default and if missing: the words appear and the key one is in the accent color), `highlight` (the word being sung gets a background in the accent color and stays marked), `karaoke` (those already sung switch to the accent color) or `glow` (each word in the text color with a soft glow and a halo, no background)." }
        hit_style: { type: string, enum: [plain, metal, glow], description: "What the word hit looks like: `plain` (the default and if missing), `metal` (metallic letters with a shine that crosses them) or `glow` (letters in the accent color with light around them); in `metal` and `glow` the letters enter one after another." }
        theme:
          $ref: "#/components/schemas/MusicTheme"
        transition_seconds: { type: number, minimum: 0, maximum: 2, description: "The crossfade between the pieces of the script, in seconds (0, the default and if missing: hard cuts). A script piece may set its own (`MusicScriptPiece.transition_seconds`, the join into that piece). The video dissolves for that long on every join and each piece is drawn that long more, so the pieces still land on the song; the pages are not affected. Advice: 0 on a piece that lands on a word hit, 0.2 to 0.4 elsewhere." }
    MusicTheme:
      type: object
      description: "What a piece shares across its pages (`design.theme`, a server that has it lists `theme` in the catalog's `features`). It is injected in every page of the render and of the preview, so both draw the same."
      properties:
        css: { type: string, maxLength: 20480, description: "A stylesheet injected after the page's own one: it may restyle `#verse` and `#hit`, define the glow and the type scale and add `@font-face` from `data:` URLs. Refused with `422 design.theme.css: ...` when it has `@import`, a `url(` that is not `data:`, `expression(`, `behavior:`, `javascript:` or `<`." }
        assets:
          type: object
          maxProperties: 5
          additionalProperties: { type: string, maxLength: 51200 }
          description: "Small SVG drawings by name (`^[a-z][a-z0-9_]{0,31}$`; no script, foreignObject, event handler or outside reference). A part reads `window.__theme.assets[name]` or places one with the slot `{{asset:name}}` in its fragment (an unknown name leaves the slot empty and a draft warns of it)."
        hud:
          type: object
          description: "Four corner labels (up to 40 characters each) the `hud-chrome` part draws; a script piece's design override may replace them (`MusicDesignOverride.hud`)."
          properties:
            tl: { type: string, maxLength: 40 }
            tr: { type: string, maxLength: 40 }
            bl: { type: string, maxLength: 40 }
            br: { type: string, maxLength: 40 }
    MusicThemeHud:
      type: object
      properties:
        tl: { type: string, maxLength: 40 }
        tr: { type: string, maxLength: 40 }
        bl: { type: string, maxLength: 40 }
        br: { type: string, maxLength: 40 }
    MusicDesignStored:
      type: object
      required: [design, source, edited]
      properties:
        design: { $ref: "#/components/schemas/MusicDesign" }
        source: { type: string, enum: [assistant, fallback, user] }
        fallback_reason: { type: string, description: "Why the design is a fallback; absent otherwise." }
        note: { type: string, description: "What the program changed in the assistant's design (the accent's lightness, to reach the contrast); absent for nothing." }
        edited: { type: boolean, description: "Whether the user set it: a new proposal does not overwrite it unless asked to." }
        notice:
          type: string
          description: >-
            Only in the answer of `PUT .../design`, when the default mode or the modes of the sections changed while
            the script has pieces with a `mode` of their own that differs from the design's: how many. Nothing is
            changed; clear the `mode` of those pieces (`PUT .../script`) to make them follow the design.
    MusicScript:
      type: object
      required: [version, pieces]
      properties:
        version: { type: integer, enum: [1] }
        pieces: { type: array, items: { $ref: "#/components/schemas/MusicScriptPiece" } }
        home: { type: string, description: "The part the chorus comes back to (the one every chorus piece uses): the script proposal names it, the fixed rule sets it to the part of the first chorus piece. Optional; nothing refuses a script that has none or whose chorus pieces differ." }
        layers:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/MusicLayer" }
          description: |
            Lanes of parts drawn over the sequence of pieces, in this order (the last on top, over the parts of the pieces and under the verse and the word hit).
            Each item is drawn in the page of every piece its range touches, and is visible only between its `start` and `end`. A part reads its time as
            seconds from the item's `start`, so one that draws from `t` carries on across the cuts (the beat clock of a part is still the piece's own).
            Refused with `422`, naming the layer and the item, for a part that is not in the catalog, bad parameters, an empty range or one outside the song,
            items of one lane that overlap (they follow one another, in order), a repeated layer id, more than 4 layers or 32 items in a layer, and a piece whose
            page would draw the same part twice (as its main part, an extra or another item) or more than 8 parts. A script without `layers` is drawn as always.
    MusicLayer:
      type: object
      required: [id, items]
      properties:
        id: { type: string, description: "Lower case letters, digits and dashes, up to 24 characters; unique in the script." }
        items: { type: array, maxItems: 32, items: { $ref: "#/components/schemas/MusicLayerItem" } }
    MusicLayerItem:
      type: object
      required: [start, end]
      description: >-
        What a layer draws between `start` and `end`: a part (`part`) or a whole HyperFrames block (`block`, a name of
        `GET /api/hyperframes/blocks`), never both. A block is drawn inside the page of every piece the range touches, over
        what is under it and under the layers above and the verse, and its own timeline is sought to the seconds from `start`;
        `params` are then the values of the variables it declares. A block that is not in the catalog, failed its checks or
        lacks the libraries is refused when the script is saved (`422`, naming it); a block item cannot `animate`.
      properties:
        part: { type: string, description: "A part of the catalog. Absent when the item is a block." }
        block: { type: string, description: "A HyperFrames block. Absent when the item is a part." }
        params: { type: object, additionalProperties: true }
        start: { type: number, description: "Song seconds." }
        end: { type: number, description: "Song seconds, after `start` and not after the end of the song." }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
    MusicScriptPiece:
      type: object
      required: [id, start, end]
      description: "A piece is made from a part of the catalog (`part`) or is a 3D scene drawn by Blender (`blender`), never both. A 3D piece has no `part`, `params`, `animate`, `with`, `design`, `mode`, `lines`, `hit` or `stage` (`422` naming the piece and the field)."
      properties:
        id: { type: string }
        start: { type: number }
        end: { type: number }
        section: { type: string }
        part: { type: string, description: "The part of the catalog the piece is made from; empty for a 3D piece." }
        blender:
          type: object
          description: "Makes the piece a 3D scene: Blender draws it as a scene of the piece's project, for the length of the piece, following the song's tempo (a key may be in beats: `beat`, counted from the start of the piece) and the song's design (`bg`, `fg`, `accent` colours and the `display`/`body` fonts when the design has one in the server's pack); no font files. The description is checked like a hand-written one when the script is saved and when it renders (`422` naming the piece and each fault by its place in the JSON). It is returned by `GET` of the piece and of the script."
          required: [description]
          properties:
            description: { type: object, additionalProperties: true, description: "The JSON of a scene (contract version 1 of the Blender engine)." }
        params: { type: object, additionalProperties: true }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
        mode:
          type: string
          enum: [dark, light]
          description: >-
            Optional. Absent, the piece is drawn in the mode the design gives its section (`modes`, then
            `default_mode`), so a design that changes is followed by the piece. The proposals write none.
        transition_seconds: { type: number, minimum: 0, maximum: 2, description: "The crossfade into this piece from the one before (0 is a cut); without it, the design's `transition_seconds`. Ignored on the first piece." }
        lines: { type: array, items: { $ref: "#/components/schemas/MusicScriptLine" } }
        hit: { $ref: "#/components/schemas/MusicScriptHit" }
        stage: { $ref: "#/components/schemas/MusicStage" }
        with:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/MusicPartRef" }
          description: "Extra parts drawn alongside the main one, on top and in this order (up to three, without repeating any part of the piece): for example a year bar that stays while the main screen changes."
        design: { $ref: "#/components/schemas/MusicDesignOverride" }
    MusicPartRef:
      type: object
      required: [part]
      properties:
        part: { type: string }
        params: { type: object, additionalProperties: true }
        animate: { $ref: "#/components/schemas/MusicAnimate" }
    MusicKeyframe:
      type: object
      required: [t, value]
      properties:
        t: { type: number, description: "Seconds from the start of the piece." }
        value: { description: "A value the parameter accepts as a static one." }
        ease: { type: string, enum: [linear, in, out, in-out, step], default: linear, description: "How the value travels from this keyframe to the next." }
    MusicAnimate:
      type: object
      description: |
        Parameters that change over the piece: a parameter name (of a part whose manifest marks it `animatable`) to its keyframes, with `t` strictly
        increasing inside the piece. Between two keyframes a number is interpolated with the ease of the earlier one (`linear`; `in` and `out` are
        cubic; `in-out`; `step` holds), integer parameters are rounded; any value that is not a number is held until the next keyframe. Before the
        first keyframe and after the last the value is the nearest one. Refused with `422`, naming the piece and the parameter, for a parameter that
        is not animatable, no keyframe, `t` outside the piece or not increasing, an unknown ease, or a value outside the parameter's limits.
      additionalProperties: { type: array, minItems: 1, items: { $ref: "#/components/schemas/MusicKeyframe" } }
    MusicDesignOverride:
      type: object
      description: "Design fields that this piece overrides for itself (another palette for an era). The result is validated as a whole design and, if it is not valid, the script is rejected naming the piece and the field. Without it, the piece uses the song's design."
      properties:
        dark: { type: string }
        light: { type: string }
        accent: { type: string }
        display: { type: string }
        body: { type: string }
        verse_style: { type: string, enum: [plain, highlight, karaoke, glow] }
        hit_style: { type: string, enum: [plain, metal, glow] }
        hud: { $ref: "#/components/schemas/MusicThemeHud", description: "Replaces the theme's HUD texts for this piece alone." }
    MusicScriptLine:
      type: object
      properties:
        line: { type: integer, description: "The verse number among the map's words; with it the text and timings come from the map." }
        text: { type: string }
        start: { type: number }
        end: { type: number }
        keyword: { type: string, description: "A word of the verse." }
    MusicScriptHit:
      type: object
      required: [word, at, length]
      properties:
        word: { type: string }
        at: { type: number, description: "Second of the song." }
        length: { type: number }
    MusicStage:
      type: object
      properties:
        background: { type: string }
        characters: { type: array, items: { $ref: "#/components/schemas/MusicStageCharacter" } }
    MusicStageCharacter:
      type: object
      required: [character, x, y, size]
      properties:
        character: { type: string }
        pose: { type: string }
        expression: { type: string }
        action: { type: string }
        x: { type: number, description: "Percentage of the frame width where the anchor goes." }
        y: { type: number, description: "Percentage of the height, counted from the top." }
        size: { type: number, description: "Character height as a percentage of the frame height." }
    SongMap:
      type: object
      required: [version, duration, bpm, beats, beat_base, grid_anchored, sections, words, attacks, loudness_hop, loudness]
      properties:
        version: { type: integer }
        audio_key: { type: string }
        duration: { type: number }
        bpm: { type: number }
        beats: { type: array, items: { type: number } }
        beat_base: { type: integer }
        grid_anchored: { type: boolean, description: "Whether it was found where the beat falls; if not, the grid starts at 0." }
        sections:
          type: array
          items:
            type: object
            required: [tag, start, end]
            properties:
              tag: { type: string }
              start: { type: number }
              end: { type: number }
        words:
          type: array
          items:
            type: object
            required: [text, start, end, line, heard, confidence]
            properties:
              text: { type: string }
              start: { type: number }
              end: { type: number }
              line: { type: integer }
              heard: { type: boolean, description: "The word took its time from a word Whisper heard; `false` for one whose time was made up between its neighbours or spread over its section." }
              confidence: { type: number, description: "How sure Whisper was of the word it heard (the geometric mean of the probabilities of its tokens); `0` when the word was not heard or its timing gives none." }
              snapped: { type: string, enum: [attack, beat], description: "Present when the start of the word was moved onto something: `attack` (an attack of the separated voice within 120 ms, never closer than 40 ms to a neighbour) or `beat` (a beat within 60 ms, for a heard word with no attack near). Absent for a word left where it was heard or that was not heard." }
        words_estimated: { type: boolean, description: "The word timings were distributed across the sections instead of being heard." }
        words_source: { type: string, enum: [estimated, heard, heard-voice, edited], description: "Where the times of the words come from: `estimated` (the lines were spread over their sections), `heard` (Whisper on the mix), `heard-voice` (Whisper on the separated voice) or `edited` (a word was moved by hand). Absent for a map with no words. `words_estimated` stays `true` only for `estimated`." }
        attacks: { type: integer, description: "How many attacks of the separated voice (where a syllable starts) were found when the words were placed: 0 when the voice was not separated (the mix was heard) or the map is older than the attacks." }
        loudness_hop: { type: number }
        loudness: { type: array, items: { type: number } }
    MusicProposeRequest:
      type: object
      required: [what]
      properties:
        what: { type: string, enum: [design, script, all], description: "`all` writes the design and then the script, from the same prompt and model, in the background (`202`)." }
        provider: { type: string, description: "The id of a saved provider (`GET /api/providers`) that writes this proposal instead of the `motion_graphics` routing, for this call only (the routing is not written); `model` then names a model of that provider. A remote one needs consent (`400 consent_required`, until `POST /api/providers/{id}/acknowledge`); an unknown one is `400` naming it. An asked-for provider that cannot be used is refused, never replaced by the fixed rule; one that is reachable at the start but fails while writing falls back with a `fallback_reason`." }
        prompt: { type: string, maxLength: 2000, description: "The person's direction for the video, free text: the assistant reads it for the design and for the script. It replaces the one kept with the piece; without it the kept one (if any) is used. `422` above 2000 characters." }
        reference: { type: string, description: "The id of a `ready` reference to follow the rhythm of: it replaces the one kept with the piece; an empty text clears it; absent keeps the piece's. `422` unless it exists and is ready (nothing changes)." }
        model: { type: string, description: "An installed model of the assistant (`GET /api/assist/models`); `422` naming it when a local Ollama does not have it. Without it the routing decides." }
        async: { type: boolean, description: "Answer `202` and work in the background; `what: all` always does. Follow it in `proposal` of `GET /api/music-motion/pieces/{id}`." }
        blocks: { type: string, enum: [auto, off], description: "`auto` (the default): the script writer is offered a menu of the HyperFrames blocks and components that can be drawn now and may add up to two layers of them; the items that do not pass the checks are dropped and named in `notes`. `off`: no menu and no block layers. `422` for another value." }
    MusicProposeAnswer:
      type: object
      required: [what, source]
      properties:
        what: { type: string, enum: [design, script] }
        source: { type: string, enum: [assistant, fallback] }
        fallback_reason: { type: string, description: "Why the fixed rule wrote it (present only when `source` is `fallback`): there is no assistant, a run holds the memory, the assistant failed, its last answer was refused, or the wait timed out. It says that the fixed rule does not read the prompt when one was sent." }
        fallback_pieces: { type: array, items: { type: string }, description: "For `what: script` with `source: fallback`: the pieces whose part the fixed rule chose." }
        model: { type: string, description: "The model that wrote it, or the one asked for when it failed." }
        design_note: { type: string, description: "As in the proposal in the background: what the program changed in the assistant's design (the accent's lightness, for its contrast); absent for nothing." }
        provider: { type: string, description: "The provider asked for on the request; absent when the routing's own wrote." }
        design: { $ref: "#/components/schemas/MusicDesignStored" }
        script: { $ref: "#/components/schemas/MusicScript" }
        replacements:
          type: array
          items:
            type: object
            required: [piece, from, to]
            properties:
              piece: { type: string }
              from: { type: string }
              to: { type: string }
        notes: { type: array, items: { type: string }, description: "What the proposal did not use of what it was given: a reference with no rhythm sheet (analysed before shots existed: run its breakdown) or one that is no longer in the library." }
    MusicRenderAnswer:
      type: object
      required: [run_id, estimate]
      properties:
        run_id: { type: string }
        estimate: { $ref: "#/components/schemas/MusicEstimate" }
    DurationRange:
      type: object
      required: [min, max, default]
      properties:
        min: { type: number }
        max: { type: number }
        default: { type: number }
    VideoOption:
      type: object
      required: [id, name, description, engine, available, clip_seconds, duration, audio, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        engine: { type: string, enum: [wan, animatediff, minimax-h3, ltx-2.3, blender] }
        available: { type: boolean }
        reason: { type: string, description: "What is missing or why it does not fit, when it is not available." }
        clip_seconds: { type: number }
        duration: { $ref: "#/components/schemas/DurationRange" }
        audio: { type: boolean, description: "Whether the engine can write the sound." }
        estimate: { type: integer, description: "Seconds of a generation at the best quality, 16:9 and with no start image." }
        default: { type: boolean }
        inputs: { $ref: "#/components/schemas/GenerationInputs" }
    GenerationInputs:
      type: object
      required: [start_image, end_image]
      description: "What the option accepts besides the text, with its limits. What is absent is not accepted. The reference limits are those measured for the memory of the card the server would use."
      properties:
        start_image: { type: boolean, description: "Accepts the start image (`image`)." }
        end_image: { type: boolean, description: "Accepts an end image (`end_image`): MiniMax H3 with its first-and-last-frame package, and LTX 2.3." }
        reference_images: { $ref: "#/components/schemas/InputLimit" }
        reference_videos: { $ref: "#/components/schemas/InputLimit" }
        reference_audios: { $ref: "#/components/schemas/InputLimit" }
        scene: { type: boolean, description: "Accepts the description of a 3D scene (`blender.description`) and nothing else: the option `blender`." }
    InputLimit:
      type: object
      required: [max]
      properties:
        min: { type: integer, description: "Minimum (reference images require at least one)." }
        max: { type: integer }
        max_seconds: { type: number, description: "Maximum duration of each video or audio." }
    ImageModel:
      type: object
      required: [id, name, description, kind, available, strength, negative_prompt, max_variants, default]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [img2img, instruction], description: "`img2img` starts from the image with a strength; `instruction` is an editing model that changes the image according to the text." }
        available: { type: boolean }
        reason: { type: string }
        strength: { type: boolean, description: "Whether it accepts `strength`." }
        negative_prompt: { type: boolean, description: "Whether it accepts `negative_prompt`." }
        max_variants: { type: integer }
        default: { type: boolean }
    GenerationOptions:
      type: object
      required: [video, image_models, aspect_ratios, qualities]
      properties:
        video:
          type: array
          items: { $ref: "#/components/schemas/VideoOption" }
        image_models:
          type: array
          items: { $ref: "#/components/schemas/ImageModel" }
        aspect_ratios:
          type: array
          items: { type: string }
        qualities:
          type: array
          items: { type: string }
    ImageEditRequest:
      type: object
      description: "`prompt` is required; without `model` the default from `GET /api/generation/options` is used; without `variants`, 1."
      properties:
        model: { type: string, description: "Identifier from `image_models`." }
        prompt: { type: string }
        negative_prompt: { type: string, description: "Only `img2img` models take it." }
        strength: { type: number, description: "How far it departs from the image, greater than 0 and at most 1; only `img2img` models take it." }
        variants: { type: integer, description: "From 1 to the model's `max_variants`." }
        adult: { type: boolean, description: "The label the client puts on the retouch." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, its own (for example `my-dashboard`): 1 to 32 lowercase letters, digits or hyphens. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created. It is saved in the project's `scenes.yaml` and in the run, and is used to group in the statistics and the metrics." }
    ImageEditResult:
      type: object
      required: [variant, seed, image]
      properties:
        variant: { type: integer, description: "From 1." }
        seed: { type: integer, format: int64 }
        image: { type: string, description: "Address of the image." }
    ImageEdit:
      type: object
      required: [id, state, progress, request, client, run_id, created_at, size_bytes]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none or if it predates this field)." }
        state: { type: string, enum: [queued, running, done, failed] }
        progress: { type: integer }
        request: { $ref: "#/components/schemas/ImageEditRequest" }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk." }
        results:
          type: array
          items: { $ref: "#/components/schemas/ImageEditResult" }
        error: { type: string }
    VideoEditSetting:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string, enum: [choice, number, integer, boolean, string, color] }
        values: { type: array, items: {}, description: "The accepted values when `kind` is `choice`." }
        min: { type: number }
        max: { type: number }
        default: { description: "The value used if it is not sent." }
        required: { type: boolean, description: "It must be sent and cannot be blank." }
        description: { type: string }
    VideoEditTool:
      type: object
      required: [id, name, description, available, needs_image, settings]
      properties:
        id: { type: string, enum: [scale, interpolate, reframe, remove-background, depth, extend, motion-control] }
        name: { type: string }
        description: { type: string }
        available: { type: boolean }
        reason: { type: string, description: "Why it is not available (only with `available: false`): a file, a binary, the vision service or card memory is missing." }
        needs_image: { type: boolean, description: "Whether it needs a reference image." }
        accepts_motion: { type: boolean, description: "Whether it can take a motion from the library instead of a video (`motion-control`)." }
        notes: { type: array, items: { type: string }, description: "Limits the client should show (for example «human silhouettes only», «33 frames», «quality drops with each extension»)." }
        settings:
          type: array
          items: { $ref: "#/components/schemas/VideoEditSetting" }
    VideoEditOptions:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: { $ref: "#/components/schemas/VideoEditTool" }
    VideoEditRequest:
      type: object
      required: [tool]
      description: >-
        `settings` carries the tool's settings, with the names from `GET /api/video-edits/options`:
        `scale` {factor: 2|4, engine: fast|quality}; `interpolate` {fps: 24|30|60}; `reframe` {aspect_ratio: 16:9|9:16|1:1|4:5,
        mode: crop|pad, color}; `remove-background` {background (color, default #00ff00), alpha}; `depth` with no settings;
        `extend` {seconds: 2 to 10, prompt (required), engine: minimax-h3|ltx}; `motion-control` {prompt, strength: 0.2 to 1 (default 0.6), guidance: 1 to 10 (default 6; lower burns the highlights less but follows the prompt less),
        start (seconds, default 0, only with `motion`)}.
      properties:
        tool: { type: string, enum: [scale, interpolate, reframe, remove-background, depth, extend, motion-control] }
        settings: { type: object, additionalProperties: true }
        motion: { type: string, description: "`motion-control` only: the identifier of a `ready` motion from the library, instead of the `video` part." }
        client: { type: string, pattern: '^[a-z0-9-]{1,32}$', description: "The name of the dashboard making the request, as in `POST /api/generations`. Without it, `unknown` applies; if it does not match the pattern, `422` and nothing is created." }
    VideoEditResult:
      type: object
      required: [video, format, has_audio]
      properties:
        video: { type: string, description: "The video's address (a read-only artifact)." }
        format: { type: string, enum: [mp4, webm], description: "MP4 (H.264, yuv420p), or WebM with alpha in `remove-background` with `alpha`." }
        has_audio: { type: boolean, description: "The original's sound is kept in `scale`, `reframe` and `remove-background`; not in the other tools." }
        width: { type: integer }
        height: { type: integer }
        fps: { type: number }
        duration: { type: number, description: "Seconds." }
        engine: { type: string, description: "What it was made with, when there are alternatives (`fast`/`quality`, the interpolation network or the fallback filter)." }
        notes: { type: array, items: { type: string }, description: "Run warnings, for example that the fallback filter was used or that nobody was found." }
        extended_times: { type: integer, description: "`extend` only: how many times the video has been extended since its original." }
    VideoEdit:
      type: object
      required: [id, tool, state, progress, request, client, run_id, created_at, size_bytes]
      properties:
        id: { type: string }
        client: { type: string, description: "The dashboard that requested it (`unknown` if it named none)." }
        tool: { type: string }
        state: { type: string, enum: [queued, running, done, failed, cancelled] }
        progress: { type: integer }
        request: { $ref: "#/components/schemas/VideoEditRequest" }
        run_id: { type: string }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, description: "What its files take up on disk." }
        result: { $ref: "#/components/schemas/VideoEditResult" }
        error: { type: string }
    MotionRequest:
      type: object
      description: "All fields are optional; the `video` or `source` part is required."
      properties:
        title: { type: string }
        tags: { type: array, items: { type: string } }
        source: { type: string, description: "The address of a video the server can already read, instead of the `video` part." }
    Motion:
      type: object
      required: [id, title, tags, duration, people, state, preview]
      properties:
        id: { type: string }
        title: { type: string }
        tags: { type: array, items: { type: string } }
        duration: { type: number, description: "Seconds, at most 30." }
        people: { type: integer }
        state: { type: string, enum: [processing, ready, failed] }
        preview: { type: string, description: "Address of the preview (`GET /api/motions/{id}/preview`)." }
        source: { type: string, description: "The YouTube address the video was taken from; absent when it was uploaded as a file. The video itself is never kept." }
        error: { type: string }
    PhaseDuration:
      type: object
      required: [phase, model, resolution, gpu, executions, min_executions, enough, period_days]
      properties:
        phase: { type: string, enum: [render, animate] }
        model: { type: string }
        resolution: { type: string }
        gpu: { type: string }
        steps: { type: integer }
        frames: { type: integer }
        executions: { type: integer, description: "Executions that meet all of the above." }
        min_executions: { type: integer, description: "How many are needed to trust the history." }
        enough: { type: boolean }
        median_seconds: { type: number, description: "Only with enough history." }
        p95_seconds: { type: number, description: "Only with enough history." }
        period_days: { type: integer, description: "How many days back the history counts." }
    EstimateRequest:
      type: object
      required: [yaml]
      properties:
        yaml: { type: string, description: "The scenes.yaml to estimate (a draft or a project's)." }
        project: { type: string, description: "A server project whose cache is read: what it will reuse adds nothing." }
        gpu: { type: string, description: "Index of the card; without it, the one the server would choose." }
    Estimate:
      type: object
      required: [seconds, source, history_phases, table_phases, cached_phases]
      properties:
        seconds: { type: integer }
        source: { type: string, enum: [history, table, mixed], description: "Where the figure for the image and animation phases comes from." }
        executions: { type: integer, description: "The executions of the history figure that has the fewest; only if there is a history part." }
        history_phases: { type: integer, description: "Parts whose time comes from this machine's history: each image or animation phase and, as one more, the rest (narration, clip and join) when there is history for both." }
        table_phases: { type: integer, description: "Parts whose time comes from the table." }
        cached_phases: { type: integer, description: "Phases the cache will reuse that add nothing." }
        gpu: { type: string, description: "The card the calculation was made with." }
    ProjectVersion:
      type: object
      required: [version, created_at, reason, bytes]
      properties:
        version: { type: integer, description: "The number of the version inside its project, from 1." }
        created_at: { type: string, format: date-time }
        reason: { type: string, enum: [save, patch, fix, run, extend, restore, import] }
        bytes: { type: integer }
    ProjectVersionText:
      allOf:
        - { $ref: "#/components/schemas/ProjectVersion" }
        - type: object
          required: [yaml]
          properties:
            yaml: { type: string, description: The text of the definition as it was. }
    ProjectSummary:
      type: object
      required: [id, name, mode, scene_count, client]
      properties:
        id: { type: string }
        name: { type: string }
        mode: { type: string, enum: [video, images, music, models3d, ""], description: "Empty when the project cannot be read (`invalid`); in that case `name` is also empty and `scene_count` is 0." }
        scene_count: { type: integer, description: "Scenes of the project; 0 for a music one and for one that cannot be read." }
        track_count: { type: integer, description: Number of tracks of a music project. }
        adult: { type: boolean, description: "Project label: `true` for over-18s, `false` reviewed and suitable for everyone; absent, not reviewed." }
        invalid: { type: boolean }
        error: { type: string }
        client: { type: string, description: "Who made the project: its `client:` (a client name), `embedded` (a normal project without it) or `unknown` (a generation API one without it)." }
        kind: { type: string, enum: [generation, image_edit, video_edit, model_generation], description: "Only on a generation API project (with `managed=include`)." }
    Run:
      type: object
      description: A run from the history.
      required: [id, project, state, gpu, keep_tmp, force, vram_warn_mb, created_at, result_available]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted] }
        result_available: { type: boolean, description: "`false` when the run's project or its files no longer exist: the run stays in the history and the statistics, but there is no result to link to." }
        server: { type: string, description: "The server that made the run, for a history that several share (empty if not recorded)." }
        gpu: { type: string, description: "Card or cards requested (empty: the one the server chooses)." }
        keep_tmp: { type: boolean }
        force: { type: boolean }
        only: { type: string, description: "Scene the run was limited to." }
        vram_warn_mb: { type: integer }
        overlap: { type: integer, description: "Lookahead scenes requested (only appears if greater than 0)." }
        mode: { type: string, description: "Output mode requested for this run; empty: the project's. `animation` for the runs of a music-motion piece (project `api-mm-`), whose project is not listed." }
        client: { type: string, description: "The dashboard that requested the run through the generation API (copied from its project's `scenes.yaml`); empty in normal projects and in anything predating the field." }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        artifact: { type: string }
        error: { type: string }
    Download:
      type: object
      required: [id, state, kind, name, files, source, bytes, created_at]
      properties:
        id: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        kind: { type: string }
        name: { type: string }
        files: { type: array, items: { type: string } }
        source: { type: string }
        bytes: { type: integer }
        total: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ContainerState:
      type: object
      description: Lifecycle of a music generator's local service (the field is called `container` for compatibility).
      required: [state]
      properties:
        state: { type: string, enum: [stopped, starting, running] }
        gpu: { type: integer, description: Card it runs on. }
        port: { type: integer, description: Port on 127.0.0.1 where the service is published. }
        since: { type: string, description: "When it started (RFC 3339)." }
        memory_mb: { type: integer, description: "RAM it uses (only with ?stats=1)." }
        error: { type: string, description: "Why the last start failed." }
    BinaryStatus:
      type: object
      required: [name, required, present]
      properties:
        name: { type: string }
        required: { type: boolean, description: "Without it some mode cannot run (optional ones, like the music engine, do not require it)." }
        present: { type: boolean }
        path: { type: string }
        version: { type: string }
        fix: { type: string, description: "How to install it, if missing (or why it is no good: Blender too old)." }
        devices: { type: array, items: { type: string }, description: "Devices it renders on, if it has several (Blender: those of Cycles, e.g. \"OPTIX NVIDIA GeForce RTX 4070\")." }
    AssetEntry:
      type: object
      required: [name, size]
      properties:
        name: { type: string }
        size: { type: integer, format: int64, description: "Bytes (the sum of its files, for an adapter folder)." }
        speakers:
          type: array
          description: The speakers of a Piper voice that has several (omitted on the usual single-speaker one).
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer }
              name: { type: string }
    GpuStatus:
      type: object
      required: [index, name, free_vram_mb]
      properties:
        index: { type: integer }
        name: { type: string }
        free_vram_mb: { type: integer }
        total_vram_mb: { type: integer, description: The card's memory. }
        ollama_mb: { type: integer, description: What an Ollama process holds on this GPU. }
        speed_factor: { type: number, description: "How many times slower than the reference machine (an RTX 5060 Ti) it has been in its runs; below 1 it is faster. Appears when there are enough samples." }
        speed_samples: { type: integer }
        low_vram: { type: boolean, description: Little free memory is left for a render. }
        warnings: { type: array, items: { type: string } }
    ModelsDirectory:
      type: object
      description: "Only if the server has a models folder (`--models-dir`, `MODELS_DIR` or `~/.config/veritmo/models-dir`). The repository's `models/` is a link to it, so models are installed and read there. If the disk is not mounted `available` is false and nothing is installed (nothing is written to the local disk); it is not the same as having no models."
      required: [dir, available, linked]
      properties:
        dir: { type: string, description: "Absolute path of the models folder, as the server sees it." }
        available: { type: boolean, description: The folder exists and is writable. }
        linked: { type: boolean, description: "The repository's `models/` leads to this folder. If false and `available` is true, `veritmo models migrate` needs to be run." }
        reason: { type: string, description: "Why it is not available, or what is missing." }
        disk: { $ref: "#/components/schemas/DiskReport" }
    DiskReport:
      type: object
      required: [free_bytes, total_bytes, warn_below_bytes, low]
      properties:
        free_bytes: { type: integer, format: int64 }
        total_bytes: { type: integer, format: int64 }
        warn_below_bytes: { type: integer, format: int64 }
        low: { type: boolean }
    EngineAvailability:
      type: object
      description: Whether an optional music engine (HeartMuLa, DiffRhythm2) can be used now and, if not, why.
      required: [available]
      properties:
        available: { type: boolean }
        mode: { type: string, enum: [local, external] }
        reason: { type: string }
        detail: { type: string }
        missing: { type: array, items: { type: string } }
        version: { type: string }
        container: { $ref: "#/components/schemas/ContainerState" }
        backends:
          type: object
          description: >-
            Only for HeartMuLa and DiffRhythm2: for each way of running the generator on this machine (`dotnet`, `docker`), whether it has everything it
            needs and what it lacks. It is what the page reads to choose the backend and to offer the download of what is missing.
          additionalProperties: { $ref: "#/components/schemas/BackendStatus" }
    BackendStatus:
      type: object
      description: One way of running a music generator on this machine (`dotnet` or `docker`) and what it lacks.
      required: [available]
      properties:
        available: { type: boolean, description: "Nothing is missing. The generator may still be stopped: that is the `container` state." }
        missing:
          type: array
          description: "What is lacking, in the order a person fixes it: `service` (the .NET service, or dotnet) and `weights` for dotnet; `docker`, `image`, `weights` and `gpu_runtime` for docker."
          items: { type: string, enum: [service, weights, docker, image, gpu_runtime] }
        reason: { type: string, description: "The first thing missing as the usual reason code (`no_service`, `no_weights`, `no_docker`, `no_image`, `no_gpu_runtime`)." }
        detail: { type: string }
        need_bytes: { type: integer, format: int64, description: "The disk the missing parts take (approximate, measured on this project's images and weights); absent when nothing is missing or the size is not known." }
    MusicInstallPart:
      type: object
      description: One thing an install fetches or builds. `state` and `error` are only in a job.
      required: [part]
      properties:
        part: { type: string, enum: [service, image, weights] }
        need_bytes: { type: integer, format: int64 }
        licenses: { type: array, items: { type: string }, description: "The licences the person accepts by confirming (the weights)." }
        state: { type: string, enum: [pending, running, done, skipped, failed, cancelled], description: "`skipped`: it was there when its turn came. `cancelled`: it was running when the install was cancelled (the parts after it stay `pending`)." }
        error: { type: string }
    MusicInstallPlan:
      type: object
      description: What an install would do, without doing it.
      required: [engine, backend, parts, total_bytes, disk, confirm_required]
      properties:
        engine: { type: string }
        backend: { type: string, enum: [dotnet, docker] }
        parts: { type: array, items: { $ref: "#/components/schemas/MusicInstallPart" }, description: "Only what is missing, in the order it runs; empty when nothing is." }
        total_bytes: { type: integer, format: int64 }
        disk:
          type: array
          description: The disk each place needs (the parts that go to the same file system are added up) against what it has free.
          items:
            type: object
            required: [path, parts, need_bytes, free_bytes, sufficient]
            properties:
              path: { type: string }
              parts: { type: array, items: { type: string } }
              need_bytes: { type: integer, format: int64 }
              free_bytes: { type: integer, format: int64 }
              sufficient: { type: boolean }
        licenses: { type: array, items: { type: string }, description: "What confirming accepts." }
        confirm_required: { type: boolean, description: "`false` when there is nothing to install." }
    MusicInstall:
      type: object
      description: An install that was confirmed.
      required: [id, engine, backend, state, parts, created_at]
      properties:
        id: { type: string }
        engine: { type: string }
        backend: { type: string, enum: [dotnet, docker] }
        state: { type: string, enum: [running, done, failed, cancelled] }
        parts: { type: array, items: { $ref: "#/components/schemas/MusicInstallPart" } }
        error: { type: string, description: "Which part failed and why." }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    EnvironmentReport:
      type: object
      required: [edition, content_mode, binaries, models, retouch, voices, loras, music, music_adapters, transcription, separation, dictation, gpus, ollama, tokens, token_sources]
      properties:
        edition: { type: string, enum: [private, public] }
        content_mode: { type: string, enum: [censored, strict, all] }
        models_dir: { $ref: "#/components/schemas/ModelsDirectory" }
        binaries: { type: array, items: { $ref: "#/components/schemas/BinaryStatus" } }
        models: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The image models. }
        retouch: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The files used only by the retouch models. }
        voices: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        loras: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        music: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        music_adapters: { type: array, items: { $ref: "#/components/schemas/AssetEntry" } }
        transcription: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The Whisper models. }
        separation: { type: array, items: { $ref: "#/components/schemas/AssetEntry" }, description: The weights of the voice separator (demucs.cpp) of `models/demucs/`; empty when it is not installed. }
        dictation:
          type: object
          description: Whether a spoken request can be transcribed here and, if not, why.
          required: [available]
          properties:
            available: { type: boolean }
            reason: { type: string }
        gpus: { type: array, items: { $ref: "#/components/schemas/GpuStatus" } }
        gpu_error: { type: string }
        ollama:
          type: object
          required: [host, source, remote]
          properties:
            host: { type: string }
            source: { type: string, enum: [setting, env, default] }
            remote: { type: boolean }
        tokens:
          type: object
          description: Whether there is a download key per service (never the value).
          required: [huggingface, civitai]
          properties:
            huggingface: { type: boolean }
            civitai: { type: boolean }
        token_sources:
          type: object
          description: Where the key in use comes from; the service does not appear if it has none.
          properties:
            huggingface: { type: string, enum: [env, file] }
            civitai: { type: string, enum: [env, file] }
        disk: { $ref: "#/components/schemas/DiskReport" }
        ram:
          type: object
          required: [total_bytes, available_bytes]
          properties:
            total_bytes: { type: integer, format: int64 }
            available_bytes: { type: integer, format: int64 }
        heartmula: { $ref: "#/components/schemas/EngineAvailability" }
        diffrhythm2: { $ref: "#/components/schemas/EngineAvailability" }
    StatsGroup:
      type: object
      required: [name, runs, seconds]
      properties:
        name: { type: string, description: "The project id, the GPU index or the type; empty in runs with no fixed GPU or of a project that no longer exists." }
        runs: { type: integer }
        seconds: { type: number }
        success_rate: { type: number }
        peak_vram_pct: { type: number, description: "GPU rows only." }
        mean_peak_vram_pct: { type: number }
        sampled_runs: { type: integer }
    StatsRunPoint:
      type: object
      required: [id, project, state, created_at, seconds, result_available]
      properties:
        id: { type: string }
        project: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, cancelled, interrupted] }
        created_at: { type: string }
        seconds: { type: number }
        mode: { type: string, enum: [video, images, music, models3d], description: "Absent if the project no longer exists." }
        result_available: { type: boolean }
    StatsResult:
      type: object
      required: [period, totals, duration, by_day, phases, cache, by_project, by_gpu, by_mode, by_client, run_durations, slowest]
      properties:
        period:
          type: object
          required: [since, until]
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        project: { type: string, description: "The filter they were computed with, if any." }
        mode: { type: string }
        totals:
          type: object
          required: [runs, by_state, total_seconds]
          properties:
            runs: { type: integer }
            by_state: { type: object, additionalProperties: { type: integer } }
            success_rate: { type: number, description: Successfully finished out of finished. }
            total_seconds: { type: number }
            queue_wait_mean_seconds: { type: number }
        duration:
          type: object
          required: [runs, total_seconds]
          properties:
            runs: { type: integer, description: The successful runs that have a duration. }
            mean_seconds: { type: number }
            median_seconds: { type: number }
            p95_seconds: { type: number }
            total_seconds: { type: number }
        by_day:
          type: array
          items:
            type: object
            required: [date, succeeded, failed, other, seconds]
            properties:
              date: { type: string }
              succeeded: { type: integer }
              failed: { type: integer }
              other: { type: integer }
              seconds: { type: number }
        phases:
          type: array
          items:
            type: object
            required: [phase, executions, reused, total_seconds]
            properties:
              phase: { type: string }
              executions: { type: integer }
              reused: { type: integer }
              total_seconds: { type: number }
              mean_seconds: { type: number }
              p95_seconds: { type: number }
        cache:
          type: object
          required: [executed, reused]
          properties:
            executed: { type: integer }
            reused: { type: integer }
            reuse_share: { type: number }
        by_project: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_gpu: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_mode: { type: array, items: { $ref: "#/components/schemas/StatsGroup" } }
        by_client: { type: array, items: { $ref: "#/components/schemas/StatsGroup" }, description: "One group per requester of the runs: the name of each generation API dashboard, `unknown` (unnamed or predating the field) and `embedded` (the normal projects)." }
        run_durations: { type: array, items: { $ref: "#/components/schemas/StatsRunPoint" } }
        slowest: { type: array, items: { $ref: "#/components/schemas/StatsRunPoint" } }
    ResourcePoint:
      type: object
      required: [t_ms, used_mb]
      properties:
        t_ms: { type: integer, format: int64, description: Milliseconds since the start of the run. }
        used_mb: { type: integer }
        util_pct: { type: integer, description: GPU utilization; RAM does not carry it. }
    RunResources:
      type: object
      required: [interval_ms, truncated, gpus, ram, peaks]
      properties:
        interval_ms: { type: integer, format: int64 }
        truncated: { type: boolean, description: There were more samples than are returned. }
        gpus:
          type: array
          items:
            type: object
            required: [index, total_mb, samples]
            properties:
              index: { type: integer }
              total_mb: { type: integer }
              samples: { type: array, items: { $ref: "#/components/schemas/ResourcePoint" } }
        ram:
          type: object
          required: [total_mb, samples]
          properties:
            total_mb: { type: integer }
            samples: { type: array, items: { $ref: "#/components/schemas/ResourcePoint" } }
        peaks:
          type: object
          required: [vram, ram]
          properties:
            vram:
              type: array
              items:
                type: object
                required: [gpu, mb, pct]
                properties:
                  gpu: { type: integer }
                  mb: { type: integer }
                  pct: { type: number }
            ram:
              type: object
              nullable: true
              required: [mb, pct]
              properties:
                mb: { type: integer }
                pct: { type: number }
  responses:
    CreatedId:
      description: Created.
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string }
    BadRequest:
      description: Malformed request (`invalid_request`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: The request body is over the limit of the endpoint (`invalid_request`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: The server refuses more work for now (`queue_full`, `too_many_attempts`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: The token is missing or invalid (`unauthorized`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Does not exist (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflict with the current state (`conflict`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unprocessable:
      description: Fails validation (`validation_failed`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
