<div class="row">
  <mat-form-field class="select">
    <mat-label>{{ label() }}</mat-label>
    <mat-select [attr.data-testid]="testId() + '-select'" [value]="value()" (selectionChange)="picked.emit($event.value)">
      @if (missing()) {
        <mat-option [value]="value()">
          <span class="mo-data">{{ value() }}</span>
          <span class="missing" i18n="@@picture.gone"> ⚠ not on disk</span>
        </mat-option>
      }
      @for (p of pictures(); track p.name) {
        <mat-option [value]="p.name"><span class="mo-data">{{ p.name }}</span></mat-option>
      }
    </mat-select>
    @if (error(); as err) {
      <mat-hint class="error" role="alert">{{ err }}</mat-hint>
    } @else if (hint()) {
      <mat-hint>{{ hint() }}</mat-hint>
    }
  </mat-form-field>
  <input
  #pick
  type="file"
  [accept]="importMetadata() ? '.png,.jpg,.jpeg,.webp,.gif,.mp4,.mov,.mkv,.webm,.avi,image/png,image/jpeg,image/webp,image/gif,video/*' : '.png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp'"
  hidden
  (change)="upload(pick)"
/>
  <button mat-stroked-button type="button" [attr.data-testid]="testId() + '-upload'" [disabled]="store.sourceBusy()" (click)="pick.click()">
    <mat-icon>upload_file</mat-icon>
    @if (importMetadata()) {
      <ng-container i18n="@@picture.uploadClip">Upload image, GIF or video</ng-container>
    } @else {
      <ng-container i18n="@@picture.upload">Upload image</ng-container>
    }
  </button>
</div>
@if (store.sourceError(); as msg) {
  <p class="server-error" role="alert" [attr.data-testid]="testId() + '-error'">
    <mat-icon inline>error</mat-icon>
    <span class="mo-data">{{ msg }}</span>
  </p>
}
@if (value() && !missing()) {
  <img class="preview" [attr.data-testid]="testId() + '-preview'" [src]="url(value())" [alt]="value()" />
}
