<svg class="chart" [attr.viewBox]="'0 0 ' + W + ' ' + H" role="group" [attr.aria-label]="ariaLabel()" data-testid="stacked-chart">
  <defs>
    <pattern [id]="patId + '-bad'" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" class="pat-bad-bg" />
      <line x1="0" y1="0" x2="0" y2="6" class="pat-bad-line" />
    </pattern>
    <pattern [id]="patId + '-dim'" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" class="pat-dim-bg" />
      <circle cx="2.5" cy="2.5" r="1" class="pat-dim-dot" />
    </pattern>
  </defs>
  @for (g of grid(); track g.v) {
    <line class="grid" [attr.x1]="L" [attr.x2]="W - R" [attr.y1]="g.y" [attr.y2]="g.y" />
    <text class="tick" [attr.x]="L - 6" [attr.y]="g.y + 4" text-anchor="end">{{ g.text }}</text>
  }
  @for (c of columns(); track c.category; let i = $index) {
    <g
      class="col"
      tabindex="0"
      role="img"
      [attr.aria-label]="textOf(c)"
      [attr.data-testid]="'col-' + i"
      (mouseenter)="active.set(i)"
      (mouseleave)="active.set(null)"
      (focus)="active.set(i)"
      (blur)="active.set(null)"
    >
      <rect class="hit" [attr.x]="c.cx - 22" [attr.y]="0" width="44" [attr.height]="H - B" />
      @for (s of c.segs; track s.name) {
        @if (s.h > 0) {
          <rect
            [class]="'seg seg--' + s.kind"
            [attr.x]="c.x"
            [attr.y]="s.y"
            [attr.width]="c.w"
            [attr.height]="s.h"
            [attr.fill]="s.kind === 'ok' ? null : 'url(#' + patId + '-' + s.kind + ')'"
          />
        }
      }
      @if (c.label) {
        <text class="tick" [attr.x]="c.cx" [attr.y]="H - B + 16" text-anchor="middle">{{ c.label }}</text>
      }
    </g>
  }
</svg>
<ul class="legend" data-testid="chart-legend">
  @for (s of series(); track s.name) {
    <li><span [class]="'swatch swatch--' + s.kind" aria-hidden="true"></span>{{ s.name }}</li>
  }
</ul>
<p class="readout mo-data" role="status" aria-live="polite" data-testid="chart-readout">{{ readout() }}</p>
