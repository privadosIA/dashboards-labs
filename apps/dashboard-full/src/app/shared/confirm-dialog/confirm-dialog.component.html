<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p class="message">{{ data.message }}</p>
  @if (data.option) {
    <mat-checkbox
      data-testid="confirm-option"
      [checked]="option()"
      (change)="option.set($event.checked)"
      >{{ data.option }}</mat-checkbox
    >
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false" i18n="@@confirm.cancel">Cancel</button>
  <button
    mat-flat-button
    [class.destructive]="data.destructive"
    [mat-dialog-close]="data.option ? { confirmed: true, option: option() } : true"
    cdkFocusInitial
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
