<div class="slider">
  <label [attr.for]="inputId">{{ label() }}</label>
  <mat-slider [min]="min()" [max]="max()" [step]="step()" discrete>
    <input matSliderThumb [id]="inputId" [attr.aria-label]="label()" [attr.data-testid]="testId()" [value]="value()" (valueChange)="valueChange.emit($event)" />
  </mat-slider>
  <span class="mo-data">{{ value() }}</span>
</div>
