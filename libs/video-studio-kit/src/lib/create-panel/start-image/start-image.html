<section [attr.data-testid]="testId()">
  <h3>{{ label() || t.panel.startImage }}</h3>
  @if (image(); as current) {
    <div class="preview">
      <img [src]="current.dataUrl" [alt]="current.name" />
      <div class="preview-actions">
        <button type="button" class="btn retouch" [title]="t.retouch.button" (click)="retouch()">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11a2.1 2.1 0 0 0-3-3L5 16l-1 4zM14 7l3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span class="sr">{{ t.retouch.button }}</span>
        </button>
        <button type="button" class="btn delete" [title]="t.panel.removeImage" (click)="remove()">
          <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2m-7 0 1 12h8l1-12M10 11v5m4-5v5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
          <span class="sr">{{ t.panel.removeImage }}</span>
        </button>
      </div>
    </div>
  } @else {
    <label class="drop" [title]="t.panel.dropHint + ' · ' + t.panel.imageHint" [class.dragging]="dragging()" (dragover)="onDragOver($event)" (dragleave)="dragging.set(false)" (drop)="onDrop($event)">
      <input type="file" accept="image/*" (change)="onFile($event)" />
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="sr">{{ t.panel.chooseImage }}</span>
      <small class="sr">{{ t.panel.dropHint }} · {{ t.panel.imageHint }}</small>
    </label>
  }
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</section>
