<section class="pieces">
  <header>
    <h1>{{ t.title }}</h1>
    <p>{{ t.intro }}</p>
    <a class="new" data-testid="new-animation" [routerLink]="link('new')">{{ common.nav.new }}</a>
  </header>

  <app-load-example />

  @if (refused()) {
    <p class="refused" role="alert" data-testid="refused">{{ refused() }}</p>
  }

  @if (pieces() === null) {
    <p class="notice" role="status">{{ common.loading }}</p>
  } @else if (pieces()!.length === 0) {
    <div class="notice" data-testid="empty">
      <p>{{ t.empty }}</p>
      <p class="hint">{{ t.emptyHint }} <a [routerLink]="link('songs')">{{ common.nav.songs }}</a></p>
    </div>
  } @else {
    <lab-paged-list listId="motion-pieces" [data]="pieces()!" [lang]="lang">
      <ng-template let-page>
        <ul class="list">
          @for (p of page; track p.id) {
            <li><app-piece-card [piece]="p" (open)="open($event)" (remove)="remove($event)" /></li>
          }
        </ul>
      </ng-template>
    </lab-paged-list>
  }
</section>
