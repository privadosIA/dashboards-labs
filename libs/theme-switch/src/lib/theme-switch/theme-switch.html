<button type="button" class="switch" data-testid="theme-switch" [attr.aria-label]="label()" [title]="label()" (click)="toggle()">
  @if (light()) {
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-testid="icon-moon"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" /></svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" data-testid="icon-sun">
      <circle cx="12" cy="12" r="4.5" />
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" />
    </svg>
  }
</button>
