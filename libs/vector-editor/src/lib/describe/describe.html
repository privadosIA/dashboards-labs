<dialog #dialog class="modal" data-testid="describe-dialog" [attr.aria-label]="t.title" (close)="open.set(false)" (click)="backdrop($event)">
  @if (open()) {
    <div class="box">
      <header class="bar">
        <h2>{{ t.title }}</h2>
        <button type="button" class="close" data-testid="describe-close" [attr.aria-label]="t.close" [attr.title]="t.close" (click)="open.set(false)">×</button>
      </header>

      @if (working()) {
        <p role="status" class="status" data-testid="describe-working">{{ t.writing(modelName()) }}</p>
        <p class="hint">{{ t.waitHint }}</p>
        <div class="actions">
          <button type="button" data-testid="describe-cancel-write" (click)="cancel()">{{ t.cancelWrite }}</button>
        </div>
      } @else {
        <p class="hint">{{ t.intro }}</p>
        @if (problem()) {
          <p class="problem" role="alert" data-testid="describe-problem">{{ problem() }}</p>
        }
        <dynamic-form [schema]="schema" [(model)]="form" [showDefaultActions]="false" showErrors="touched" (statusChange)="valid.set($event === 'VALID')" />
        <lab-assistant-picker [(value)]="assistant" [routingModels]="routingModels()" [alwaysAdd]="true" [title]="t.assistant" [hint]="''" />
        <div class="actions">
          <button type="button" class="primary" data-testid="describe-confirm" [disabled]="!valid() || loading()" (click)="write()">{{ t.confirm }}</button>
          <button type="button" data-testid="describe-cancel" (click)="open.set(false)">{{ t.cancel }}</button>
        </div>
      }
    </div>
  }
</dialog>
