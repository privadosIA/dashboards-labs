<ul class="layers" [attr.aria-label]="t.layers.label">
  @for (p of rows(); track p.id) {
    <li class="piece">
      <div class="row" [attr.data-piece]="p.id" [class.selected]="isSelected(p.id)" [class.current]="current() === p.id" [attr.aria-current]="current() === p.id ? 'true' : null" [class.off]="isHidden(p.part)">
        @if (p.with?.length) {
          <button type="button" class="fold" [attr.aria-expanded]="isOpen(p.id)" [attr.aria-label]="t.layers.extras + ' · ' + t.layers.piece(p.id)" (click)="toggleOpen(p.id)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="isOpen(p.id) ? 'M6 9l6 6 6-6' : 'M9 6l6 6-6 6'" /></svg>
          </button>
        } @else {
          <span class="fold spacer"></span>
        }
        <button type="button" class="name" [attr.aria-pressed]="isSelected(p.id)" (click)="pick(p.id)">
          <span class="part">{{ isEmpty(p) ? t.layers.empty : p.part }}</span>
          <span class="meta">{{ p.id }} · {{ p.start }}–{{ p.end }} s</span>
        </button>
        <button type="button" class="switch" [attr.aria-pressed]="solo() === p.part" [attr.aria-label]="t.layers.solo" [attr.title]="t.layers.soloHint" (click)="toggleSolo(p.part)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z" /></svg></button>
        <button type="button" class="switch" [attr.aria-pressed]="hidden().has(p.part)" [attr.aria-label]="t.layers.hide" [attr.title]="t.layers.hideHint" (click)="toggleHide(p.part)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 4l16 16" /></svg></button>
        <button type="button" class="switch remove" data-testid="layer-remove" [attr.aria-label]="t.layers.removePiece" [attr.title]="isEmpty(p) ? t.layers.removeSlot : t.layers.removePiece" [disabled]="locked()" (click)="removePiece.emit(p.id)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
      </div>
      @if (isOpen(p.id)) {
        <ul class="extras">
          @for (e of p.with; track $index) {
            <li class="row extra" [class.selected]="isSelected(p.id, $index)" [class.off]="isHidden(e.part)">
              <button type="button" class="name" [attr.aria-pressed]="isSelected(p.id, $index)" (click)="pick(p.id, $index)">
                <span class="part">{{ e.part }}</span>
                <span class="meta">{{ t.timeline.extra($index + 1) }}</span>
              </button>
              <button type="button" class="switch" [attr.aria-pressed]="solo() === e.part" [attr.aria-label]="t.layers.solo" [attr.title]="t.layers.soloHint" (click)="toggleSolo(e.part)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v-2a8 8 0 0 1 16 0v2M4 14h3v5H4zM17 14h3v5h-3z" /></svg></button>
              <button type="button" class="switch" [attr.aria-pressed]="hidden().has(e.part)" [attr.aria-label]="t.layers.hide" [attr.title]="t.layers.hideHint" (click)="toggleHide(e.part)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6M4 4l16 16" /></svg></button>
            </li>
          }
        </ul>
      }
    </li>
  }
</ul>
<button type="button" class="add-piece" data-testid="layer-add" [attr.title]="t.layers.addHint" [disabled]="locked()" (click)="addPiece.emit()">+ {{ t.layers.add }}</button>
